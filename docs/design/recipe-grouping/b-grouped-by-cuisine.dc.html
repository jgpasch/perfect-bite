<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grouped by cuisine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#1F4D33;font-family:'Figtree',sans-serif;color:#1D2A22}
.hd{padding:56px 16px 0;color:#fff}
.lt{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;letter-spacing:-0.025em;margin:0;line-height:1.1}
.search{margin-top:14px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:flex;align-items:center;gap:8px;padding:0 12px;color:#B7D2BF;font-size:17px;font-weight:500}
.ctl{display:flex;align-items:center;gap:8px;margin-top:12px}
.count{flex:1;font-size:15px;font-weight:600;color:#B7D2BF}
.hp{height:32px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;border:0;font:600 15px 'Figtree',sans-serif;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
.seg{height:32px;border-radius:999px;background:rgba(255,255,255,.14);display:inline-flex;padding:2px;box-sizing:border-box}
.seg span{width:44px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff}
.seg span.on{background:#fff;color:#1F4D33}
.ground{position:absolute;left:0;right:0;bottom:0;background:#EEF3EC;border-radius:22px 22px 0 0;padding-top:16px}
.card{background:#fff;border-radius:22px;margin:0 16px 12px;overflow:hidden}
.band{display:flex;align-items:center;gap:10px;padding:12px 16px}
.bname{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;flex:1}
.bsub{font-family:'Figtree',sans-serif;font-weight:500;font-size:13px;opacity:.85;margin-left:6px}
.bcount{font-size:13px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%}
.row{display:flex;align-items:center;gap:12px;padding-left:16px}
.tile{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.rbody{flex:1;min-height:72px;box-sizing:border-box;padding:12px 16px 12px 0;border-top:1px solid #EEF1EC;display:flex;flex-direction:column;justify-content:center;gap:2px}
.band + .row .rbody{border-top:0}
.rname{font-size:17px;font-weight:600}
.rmeta{font-size:13px;color:#55635A}
.tabbar{position:absolute;left:16px;right:16px;bottom:24px;display:flex;gap:12px}
.tabs{flex:1;height:62px;background:#fff;border:1px solid #B9C4BC;border-radius:999px;display:flex;align-items:center;padding:0 6px;box-sizing:border-box}
.tab{flex:1;height:50px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:#1D2A22}
.tab.on{background:#DCE4DA;color:#2E6B45}
.plus{width:62px;height:62px;border-radius:50%;background:#2E6B45;color:#fff;border:0;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="ph">
  <div class="hd">
    <h1 class="lt">Recipes</h1>
    <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Search 52 recipes</div>
    <div class="ctl">
      <span class="count">52 recipes</span>
      <button class="hp">Filters</button>
      <button class="hp">By cuisine<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <div class="seg" role="tablist" aria-label="Photo size"><span class="on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg></span><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path></svg></span></div>
    </div>
  </div>
  <div class="ground" style="top:222px">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
      <div class="card">
        <div class="band" style="background: {{s.soft}}; color: {{s.strong}}">
          <span class="dot" style="background: {{s.dot}}"></span>
          <span class="bname">{{s.name}}<span class="bsub">{{s.sub}}</span></span>
          <span class="bcount">{{s.count}}</span>
          <sc-if value="{{s.open}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></sc-if>
          <sc-if value="{{s.closed}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></sc-if>
        </div>
        <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="2">
          <div class="row">
            <div class="tile" style="background: {{r.soft}}; color: {{r.dot}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2 1.5-3 4-3 7v3h3"></path></svg></div>
            <div class="rbody"><div class="rname">{{r.name}}</div><div class="rmeta">{{r.meta}}</div></div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <div class="tabbar">
    <div class="tabs">
      <div class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"></path></svg>Lists</div>
      <div class="tab on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19"></path></svg>Recipes</div>
      <div class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>Settings</div>
    </div>
    <button class="plus" aria-label="Add"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const H = {
      green: ['#2E6B45', '#DDEFE2', '#2E6B45'], teal: ['#2A8C84', '#DCEFEC', '#1F6E68'],
      blue: ['#3E7BB8', '#DFEAF6', '#2F6396'], plum: ['#8A5BB0', '#ECE3F5', '#6E4594'],
      rose: ['#C2556B', '#F7E1E6', '#A33D53'], orange: ['#D0703A', '#FAE4D6', '#A04A1C'],
      amber: ['#C98A1E', '#F6EBD4', '#8A5C0C'], grey: ['#7C877F', '#E6ECE4', '#55635A']
    };
    const r = (name, meta, hue) => ({ name, meta, dot: H[hue][0], soft: H[hue][1] });
    const s = (name, sub, count, hue, rows) => ({ name, sub, count, dot: H[hue][0], soft: H[hue][1], strong: H[hue][2], rows, open: rows.length > 0, closed: rows.length === 0 });
    return {
      sections: [
        s('Asian', 'Thai, Japanese, Korean…', '14', 'teal', [r('Miso salmon', 'Japanese · 20 min', 'blue'), r('Pad see ew', 'Thai · 30 min', 'teal'), r('Bibimbap', 'Korean · 45 min', 'orange')]),
        s('European', 'Italian, Greek…', '12', 'blue', [r('Lemon ricotta pasta', 'Italian · 25 min', 'green'), r('Greek salad', 'Greek · 15 min', 'plum')]),
        s('Latin', '', '9', 'orange', []),
        s('Middle Eastern', '', '5', 'amber', []),
        s('No cuisine', '', '6', 'grey', [])
      ]
    };
  }
}
</script>
</body>
</html>
