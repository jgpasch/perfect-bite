<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B with shelves</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #163A26; color: #FFFFFF; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 60px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 8px">
<button aria-label="Recipes, switch to This week" style="flex: 1; display: flex; align-items: center; gap: 6px; padding: 0; border: none; background: transparent; color: #FFFFFF; text-align: left">
<span style="font-family: Fraunces, serif; font-size: 40px; font-weight: 700; letter-spacing: -0.01em">Recipes</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B7D2BF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" style="margin-top: 6px"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<button aria-label="Sort and photo size" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,0.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"></path></svg></button>
<button aria-label="Add recipe" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; color: #163A26; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 4px 0 14px; border-radius: 14px; background: rgba(255,255,255,0.14); color: #B7D2BF; margin-bottom: 4px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input placeholder="Search 24 recipes" aria-label="Search recipes" style="flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #FFFFFF; font: inherit; font-size: 17px">
<span style="width: 1px; height: 22px; background: rgba(255,255,255,0.22)"></span>
<button aria-label="Filters" style="width: 44px; height: 40px; border: none; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"></path><circle cx="16" cy="7" r="2.5"></circle><circle cx="10" cy="17" r="2.5"></circle></svg></button>
</label>
</div>
<div style="margin-top: 14px; flex-grow: 1; background: #111915; border-radius: 24px 24px 0 0; padding: 18px 0 16px; display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{shelves}}" as="s" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 16px">
<span style="color: {{s.iconColor}}; display: flex"><sc-if value="{{s.heart}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.3 5 6.8 5c2.1 0 3.5 1.1 5.2 3 1.7-1.9 3.1-3 5.2-3 3.5 0 5.6 3.6 4.3 6.8C19.5 16.4 12 21 12 21z"></path></svg></sc-if><sc-if value="{{s.clock}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></sc-if><sc-if value="{{s.calendar}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></sc-if></span>
<h3 style="flex: 1; margin: 0; font-size: 19px; font-weight: 700; color: #E8EFE9">{{s.title}}</h3>
<button style="min-height: 44px; padding: 0 2px; border: none; background: transparent; color: #7CC395; font-size: 15px; font-weight: 600">See all {{s.count}}</button>
</div>
<div style="display: flex; gap: 12px; padding: 0 16px; overflow: hidden">
<sc-for list="{{s.items}}" as="r" hint-placeholder-count="3">
<div style="flex-shrink: 0; width: 140px; display: flex; flex-direction: column; gap: 6px">
<div style="width: 140px; height: 105px; border-radius: 14px; background: {{r.soft}}; color: {{r.dot}}; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v7a2 2 0 0 0 4 0V3M9 12v9M17 3c-2 2-2.5 5-2.5 8H17v10"></path></svg></div>
<div style="font-size: 15px; font-weight: 600; color: #E8EFE9; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{r.name}}</div>
<div style="font-size: 13px; color: #A7B4AB">{{r.time}}</div>
</div>
</sc-for>
</div>
</section>
</sc-for>
<section style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
<div style="display: flex; align-items: baseline; gap: 8px">
<h3 style="margin: 0; font-size: 19px; font-weight: 700; color: #E8EFE9">All recipes</h3>
<span style="font-size: 13px; font-weight: 600; color: #A7B4AB">24</span>
</div>
<div style="background: #1B241F; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{recipes}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 64px; box-sizing: border-box; border-bottom: 1px solid #26302A">
<div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; background: {{r.soft}}; color: {{r.dot}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v7a2 2 0 0 0 4 0V3M9 12v9M17 3c-2 2-2.5 5-2.5 8H17v10"></path></svg></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 17px; font-weight: 600; color: #E8EFE9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</div>
<div style="font-size: 13px; color: #A7B4AB">{{r.meta}}</div>
</div>
</div>
</sc-for>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
const shrimp = { name: 'Bang Bang Shrimp with Herb Rice', time: '35 min', soft: '#3E2229', dot: '#E07E92' };
const tikka = { name: 'Chicken Tikka Masala', time: '1 hr 10 min', soft: '#3A2E14', dot: '#E0A84A' };
const shak = { name: 'Shakshuka', time: '30 min', soft: '#1E3A28', dot: '#7CC395' };
const salmon = { name: 'Lemon Herb Salmon', time: '25 min', soft: '#1D2E40', dot: '#6FA3D8' };
const eggplant = { name: 'Miso Glazed Eggplant', time: '40 min', soft: '#2E2440', dot: '#B08AD0' };
const cookies = { name: 'Brown Butter Cookies', time: '45 min', soft: '#3A2E14', dot: '#E0A84A' };
return {
shelves: [
{ title: 'This week', count: 4, heart: false, clock: false, calendar: true, iconColor: '#A7B4AB', items: [{ ...salmon, time: 'Thu dinner' }, { ...shak, time: 'Sat breakfast' }, { ...tikka, time: 'Sun dinner' }] },
{ title: 'Recently added', count: 24, heart: false, clock: true, calendar: false, iconColor: '#A7B4AB', items: [shrimp, eggplant, salmon] },
{ title: 'Favorites', count: 5, heart: true, clock: false, calendar: false, iconColor: '#7CC395', items: [tikka, shak, cookies] }
],
recipes: [
{ name: 'Bang Bang Shrimp with Herb Rice', meta: 'Dinner · 35 min', soft: '#3E2229', dot: '#E07E92' },
{ name: 'Brown Butter Cookies', meta: 'Dessert · 45 min', soft: '#3A2E14', dot: '#E0A84A' },
{ name: 'Chicken Tikka Masala', meta: 'Dinner · 1 hr 10 min', soft: '#3A2E14', dot: '#E0A84A' }
]
};
}
}
</script>
</body>
</html>
