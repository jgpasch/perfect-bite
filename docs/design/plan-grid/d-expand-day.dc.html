<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan grid, expand a day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E6B45}a:hover{color:#1F5233}
</style>
</helmet>
<div style="width: 390px; height: 940px; box-sizing: border-box; background: #EEF3EC; color: #1D2A22; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 12px;">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -1px;">Plan</h1>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button aria-label="Previous week" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D2A22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <div style="flex-grow: 1; text-align: center; font-size: 17px; font-weight: 700;">Oct 11 – 17</div>
      <button aria-label="Next week" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D2A22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      <button aria-label="Shop this week" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #2E6B45; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"></path><circle cx="9" cy="19.5" r="1.4"></circle><circle cx="17" cy="19.5" r="1.4"></circle></svg></button>
    </div>
  </div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; gap: 6px;">
      <div style="width: 44px; flex-shrink: 0;"></div>
      <div style="flex: 1 1 0; text-align: center; padding: 5px 0; border-radius: 999px; background: #F6EBD4; color: #8A5C0C; font-size: 12px; font-weight: 700;">Breakfast</div>
      <div style="flex: 1 1 0; text-align: center; padding: 5px 0; border-radius: 999px; background: #DCEFEC; color: #1F6E68; font-size: 12px; font-weight: 700;">Lunch</div>
      <div style="flex: 1 1 0; text-align: center; padding: 5px 0; border-radius: 999px; background: #ECE3F5; color: #6E4594; font-size: 12px; font-weight: 700;">Dinner</div>
    </div>
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <div style="display: flex; gap: 6px; align-items: stretch;">
        <button aria-label="{{d.label}}" aria-expanded="{{d.open}}" onClick="{{d.toggle}}" style="width: 44px; min-height: 44px; flex-shrink: 0; border: none; padding: 0; background: transparent; font: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <span style="width: 40px; padding: 4px 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; background: {{d.pillBg}}; color: {{d.pillInk}};">
            <span style="font-size: 12px; font-weight: 700;">{{d.short}}</span>
            <span style="font-size: 15px; font-weight: 600;">{{d.date}}</span>
          </span>
        </button>
        <sc-if value="{{d.open}}" hint-placeholder-val="{{false}}">
          <div style="flex: 1 1 0; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 6px; display: flex; flex-direction: column;">
            <sc-for list="{{d.rows}}" as="r" hint-placeholder-count="3">
              <div style="display: flex; gap: 10px; align-items: center; min-height: 64px; padding: 4px; border-top: 1px solid {{r.rule}};">
                <sc-if value="{{r.isRecipe}}" hint-placeholder-val="{{true}}">
                  <div style="width: 76px; height: 57px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: {{r.bg}};">
                    <svg style="width: 100%; height: 100%; display: block;" viewBox="0 0 76 57" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="38" cy="28" r="25" fill="#FFFFFF" fill-opacity="0.28"></circle><circle cx="38" cy="28" r="17" fill="{{r.food}}"></circle><circle cx="33" cy="23" r="5" fill="#FFFFFF" fill-opacity="0.35"></circle></svg>
                  </div>
                </sc-if>
                <sc-if value="{{r.isEmpty}}" hint-placeholder-val="{{false}}">
                  <div style="width: 76px; height: 57px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; border: 1.5px dashed #B9C4BC; display: flex; align-items: center; justify-content: center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C877F" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                  </div>
                </sc-if>
                <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
                  <span style="font-size: 12px; font-weight: 700; color: {{r.mealInk}};">{{r.meal}}</span>
                  <span style="font-size: 15px; font-weight: 700; line-height: 19px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{r.title}}</span>
                  <span style="font-size: 12px; font-weight: 600; color: #55635A;">{{r.sub}}</span>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{d.closed}}" hint-placeholder-val="{{true}}">
          <sc-for list="{{d.cells}}" as="c" hint-placeholder-count="3">
            <div style="flex: 1 1 0; min-width: 0; min-height: 64px; box-sizing: border-box; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 3px; background: {{c.cellBg}}; border: 1.5px dashed {{c.dash}}; justify-content: {{c.justify}}; align-items: {{c.align}};">
              <sc-if value="{{c.isRecipe}}" hint-placeholder-val="{{true}}">
                <div style="width: 32px; height: 24px; border-radius: 6px; background: {{c.bg}}; display: flex; align-items: center; justify-content: center;"><span style="width: 12px; height: 12px; border-radius: 6px; background: {{c.food}};"></span></div>
                <div style="font-size: 12px; font-weight: 700; line-height: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{c.name}}</div>
              </sc-if>
              <sc-if value="{{c.isNote}}" hint-placeholder-val="{{false}}">
                <div style="font-size: 13px; font-style: italic; color: #55635A; text-align: center;">{{c.note}}</div>
              </sc-if>
              <sc-if value="{{c.showPlus}}" hint-placeholder-val="{{false}}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7C877F" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              </sc-if>
            </div>
          </sc-for>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
renderVals() {
const open = this.state && this.state.open !== undefined ? this.state.open : 'Fri';
const R = {
  pancakes: { n: 'Blueberry pancakes', bg: '#E7C48A', f: '#B9783A', m: 25 },
  chili: { n: 'Leftover chili', bg: '#B8664F', f: '#7E2F22', m: 10 },
  chicken: { n: 'Roast chicken', bg: '#D9A46C', f: '#9A5A28', m: 80 },
  oats: { n: 'Overnight oats', bg: '#E6D8BC', f: '#B59B6A', m: 5 },
  wraps: { n: 'Turkey wraps', bg: '#B9CC93', f: '#6F8E45', m: 10 },
  tacos: { n: 'Chicken tacos', bg: '#E3A071', f: '#B4532A', m: 35 },
  lentil: { n: 'Red lentil soup', bg: '#E0A15E', f: '#B0632A', m: 40 },
  ricotta: { n: 'Lemon ricotta pasta', bg: '#EFDDA0', f: '#C9A43E', m: 25 },
  granola: { n: 'Yogurt and granola', bg: '#EDE3D1', f: '#B98B55', m: 5 },
  gnocchi: { n: 'Sheet-pan gnocchi', bg: '#D8B07E', f: '#9C6B34', m: 30 },
  bread: { n: 'Cottage cheese blueberry bread', bg: '#C9C3DE', f: '#5E5A98', m: 60 },
  stew: { n: 'Beef stew', bg: '#A9745A', f: '#62351F', m: 150 },
  shak: { n: 'Shakshuka', bg: '#E09078', f: '#A8361F', m: 35 },
  salmon: { n: 'Salmon and rice', bg: '#F0B9A0', f: '#D06E4C', m: 25 },
};
const W = [
  ['Sun', 'Sunday', '11', ['pancakes', 'chili', 'chicken']],
  ['Mon', 'Monday', '12', ['oats', 'wraps', 'tacos']],
  ['Tue', 'Tuesday', '13', [null, 'lentil', 'ricotta']],
  ['Wed', 'Wednesday', '14', ['granola', 'note:Eat out', 'gnocchi']],
  ['Thu', 'Thursday', '15', [null, null, 'note:Pizza night']],
  ['Fri', 'Friday', '16', ['bread', 'lentil', 'stew']],
  ['Sat', 'Saturday', '17', ['shak', null, 'salmon']],
];
const MEALS = [['Breakfast', '#8A5C0C'], ['Lunch', '#1F6E68'], ['Dinner', '#6E4594']];
const time = (m) => (m >= 60 ? Math.floor(m / 60) + ' hr' + (m % 60 ? ' ' + (m % 60) + ' min' : '') : m + ' min');
const days = W.map(([short, long, date, cells], i) => {
  const today = short === 'Fri';
  const past = i < 5;
  const isOpen = open === short;
  return {
    short, date,
    open: isOpen,
    closed: !isOpen,
    label: long + ' ' + date + (isOpen ? ', expanded' : ', collapsed'),
    toggle: () => this.setState({ open: isOpen ? null : short }),
    pillBg: today ? '#2E6B45' : isOpen ? '#FFFFFF' : 'transparent',
    pillInk: today ? '#FFFFFF' : '#1D2A22',
    rows: cells.map((k, m) => {
      const base = { meal: MEALS[m][0], mealInk: MEALS[m][1], rule: m === 0 ? 'transparent' : '#EEF1EC' };
      if (!k) return { ...base, isRecipe: false, isEmpty: true, title: 'Nothing planned', sub: 'Tap to plan' };
      if (k.startsWith('note:')) return { ...base, isRecipe: false, isEmpty: false, title: k.slice(5), sub: 'Note' };
      const r = R[k];
      return { ...base, isRecipe: true, isEmpty: false, bg: r.bg, food: r.f, title: r.n, sub: time(r.m) };
    }),
    cells: cells.map((k) => {
      if (!k) return { isRecipe: false, isNote: false, showPlus: !past, cellBg: 'transparent', dash: past ? 'transparent' : '#B9C4BC', justify: 'center', align: 'center' };
      if (k.startsWith('note:')) return { isRecipe: false, isNote: true, showPlus: false, note: k.slice(5), cellBg: '#DCE4DA', dash: 'transparent', justify: 'center', align: 'center' };
      const r = R[k];
      return { isRecipe: true, isNote: false, showPlus: false, name: r.n, bg: r.bg, food: r.f, cellBg: '#FFFFFF', dash: 'transparent', justify: 'flex-start', align: 'stretch' };
    }),
  };
});
return { days };
}
}
</script>
</body>
</html>
