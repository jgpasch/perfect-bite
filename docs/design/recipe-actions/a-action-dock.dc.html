<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option A, action dock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #111915; color: #E7EEE8; font-family: Figtree, sans-serif; box-sizing: border-box;">
  <div style="padding: 54px 16px 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1B241F; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7CC395" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button aria-label="More" style="width: 44px; height: 44px; border-radius: 22px; background: #1B241F; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="#7CC395" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.025em;">Lamb kofta</h1>
      <div style="font-size: 14px; color: #A6B3AA;">Sabaa · page 112</div>
    </div>
    <div style="display: flex; padding: 4px; border-radius: 16px; background: #28332C;">
      <button style="flex: 1; height: 40px; border-radius: 12px; background: #1B241F; font-weight: 700; font-size: 16px;">Ingredients</button>
      <button style="flex: 1; height: 40px; border-radius: 12px; background: transparent; font-weight: 600; font-size: 16px; color: #A6B3AA;">Method · 2</button>
    </div>
    <div style="border-radius: 22px; background: #1B241F; overflow: hidden;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 18px 20px 12px; border-bottom: 1px solid #26302A;">
        <h2 style="margin: 0; font-family: Fraunces, serif; font-weight: 600; font-size: 22px;">Ingredients</h2>
        <span style="font-size: 15px; color: #A6B3AA;">6</span>
      </div>
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid #26302A;">
          <span style="width: 10px; height: 10px; border-radius: 5px; flex: none; background: {{row.dot}};"></span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 17px; font-weight: 500;">{{row.name}}</span>
            <span style="font-size: 14px; color: #A6B3AA;">{{row.note}}</span>
          </div>
          <span style="font-size: 16px; font-weight: 600; color: #A6B3AA;">{{row.qty}}</span>
        </div>
      </sc-for>
      <button style="width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: transparent; color: #7CC395; font-weight: 600; font-size: 16px; text-align: left;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add ingredient</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(17,25,21,0), #111915 45%);" aria-hidden="true"></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; gap: 8px; padding: 8px; border-radius: 30px; background: #1B241F; border: 1px solid #26302A;">
    <button style="flex: 1; height: 52px; border-radius: 26px; background: #7CC395; color: #0E1F14; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 10px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 7H6.2"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>Add to a list</button>
    <button aria-label="Cook" style="width: 64px; height: 52px; border-radius: 26px; background: #28332C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: #E7EEE8;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EE9762" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.3 3 2.5 3.5C12.5 9 11 6 12 3z"/></svg>Cook</button>
    <button aria-label="Plan" style="width: 64px; height: 52px; border-radius: 26px; background: #28332C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: #E7EEE8;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E9BC5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Plan</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
rows: [
{ name: 'Lamb', note: 'fine minced (ground)', qty: '1 kg', dot: '#E58A9C' },
{ name: 'Onion', note: 'large, very finely chopped', qty: '1', dot: '#6FBF8A' },
{ name: 'Parsley', note: 'finely chopped', qty: '1 bunch', dot: '#6FBF8A' },
{ name: 'Sabaa Bharat', note: 'heaped (page 20)', qty: '1 tsp', dot: '#EE9762' },
{ name: 'Sea salt', note: 'to taste', qty: '', dot: '#EE9762' },
{ name: 'Paprika', note: '', qty: '1 tsp', dot: '#EE9762' }
]
};
}
}
</script>
</body>
</html>
