<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Answer a photo request</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
.f{font-family:'Figtree',system-ui,sans-serif;color:#1D2A22}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-0.025em}
.card{background:#FFFFFF;border-radius:22px;margin:0 16px;overflow:hidden}
.lbl{font-size:13px;font-weight:700;color:#55635A;padding:4px 32px 0}
.fn{font-size:13px;line-height:18px;color:#55635A}
.hl{font-size:17px;font-weight:700}
.body{font-size:17px;font-weight:500}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;flex-shrink:0}
</style>
</helmet>
<div class="f" style="width:390px;height:844px;background:#C9D3C7;position:relative;overflow:hidden">
<div style="position:absolute;top:54px;left:0;right:0;bottom:0;background:#EEF3EC;border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:14px">
  <div style="height:5px;width:36px;border-radius:3px;background:#B9C4BC;align-self:center;margin-top:6px"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:0 16px;height:44px">
    <button style="background:none;border:0;font-size:17px;color:#1D2A22;min-height:44px;padding:0 4px">Close</button>
  </div>

  <div style="padding:0 20px;display:flex;flex-direction:column;gap:6px">
    <div class="d" style="font-size:30px;line-height:36px">Sam needs a hand</div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="av" style="width:24px;height:24px;font-size:12px;background:#6E4594">S</span>
      <span class="fn">Asked for a photo · 2 min ago · Groceries</span>
    </div>
  </div>

  <div class="card" style="display:flex;align-items:center;gap:12px;padding:12px 16px">
    <div style="width:44px;height:44px;border-radius:12px;background:#FAE4D6;display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D0703A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="4" rx="1"></rect><path d="M7 7h10v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"></path><path d="M7 12h10"></path></svg>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:2px">
      <span class="hl">Za’atar</span>
      <span class="fn">1 jar · Spices · you added it Tuesday</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;padding:0 16px">
    <button style="height:54px;border-radius:999px;border:0;background:#2E6B45;color:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      Take a photo
    </button>
    <button style="height:54px;border-radius:999px;border:0;background:#FFFFFF;color:#1D2A22;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E6B45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M21 16l-5-5-8 8"></path></svg>
      Choose from library
    </button>
  </div>

  <label class="lbl" for="note">Add a note (optional)</label>
  <div class="card" style="display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px">
    <textarea id="note" rows="3" style="flex:1;border:0;resize:none;font-family:inherit;font-size:17px;font-weight:500;color:#1D2A22;outline:none;padding:6px 0;background:transparent" placeholder="Green tin, top shelf next to the sumac"></textarea>
    <button aria-label="Send note" style="width:40px;height:40px;border-radius:50%;border:0;background:#DDEFE2;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5233" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
    </button>
  </div>
  <div class="fn" style="padding:0 32px">A note on its own works too. Sam sees whatever you send on the item.</div>

  <button style="margin-top:auto;margin-bottom:40px;align-self:center;background:none;border:0;font-size:16px;font-weight:500;color:#55635A;min-height:44px;padding:0 16px">Can’t help right now</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
