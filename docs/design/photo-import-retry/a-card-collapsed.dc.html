<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipes, photo import failed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1F4D33; display: flex; flex-direction: column; font-family: Figtree, sans-serif; color: #1D2A22; position: relative; overflow: hidden">
  <div style="padding: 60px 20px 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.025em; color: #FFFFFF">Recipes</h1>
      <div style="display: flex; gap: 10px">
        <button aria-label="Sort and group" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg></button>
        <button aria-label="Add recipe" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #1F4D33; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </div>
    <div style="height: 40px; border-radius: 12px; background: rgba(255,255,255,0.14); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #B7D2BF; font-size: 17px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="flex-grow: 1">Search 24 recipes</span>
      <span style="font-size: 15px; font-weight: 600; color: #FFFFFF">Filters</span>
    </div>
  </div>

  <div style="flex-grow: 1; background: #EEF3EC; border-radius: 24px 24px 0 0; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px">

    <div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 1px 3px rgba(29,42,34,0.08)">
      <button aria-label="2 pages from a photo, open" style="position: relative; width: 58px; height: 70px; flex-shrink: 0; border: 0; padding: 0; background: none">
        <div style="position: absolute; left: 10px; top: 0; width: 46px; height: 61px; border-radius: 6px; background: #F3EEE3; border: 1px solid #DCE4DA; transform: rotate(6deg)"></div>
        <div style="position: absolute; left: 0; top: 6px; width: 46px; height: 61px; border-radius: 6px; background: #FBF8F1; border: 1px solid #DCE4DA; box-sizing: border-box; padding: 7px 6px; display: flex; flex-direction: column; gap: 4px">
          <div style="height: 5px; width: 70%; background: #8A9A8F; border-radius: 2px"></div>
          <div style="height: 3px; background: #C9D3C7; border-radius: 2px"></div>
          <div style="height: 3px; background: #C9D3C7; border-radius: 2px"></div>
          <div style="height: 3px; width: 80%; background: #C9D3C7; border-radius: 2px"></div>
          <div style="height: 3px; background: #C9D3C7; border-radius: 2px"></div>
          <div style="height: 3px; width: 60%; background: #C9D3C7; border-radius: 2px"></div>
        </div>
        <div style="position: absolute; right: 0; bottom: 0; min-width: 20px; height: 20px; border-radius: 10px; background: #1D2A22; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</div>
      </button>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 17px; font-weight: 700">Couldn't import 1 recipe</div>
        <div style="font-size: 13px; color: #55635A">Try again in a minute. Your photos are kept.</div>
      </div>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #2E6B45; color: #FFFFFF; font-size: 15px; font-weight: 700; flex-shrink: 0">Try again</button>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; overflow: hidden">
      <sc-for list="{{recipes}}" as="r" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #EEF1EC">
          <div style="width: 52px; height: 52px; border-radius: 12px; background: {{r.soft}}; color: {{r.dot}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"></path></svg>
          </div>
          <div style="flex-grow: 1; min-width: 0">
            <div style="font-size: 17px; font-weight: 500">{{r.name}}</div>
            <div style="font-size: 13px; color: #55635A">{{r.meta}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; gap: 10px; align-items: center">
    <div style="flex-grow: 1; height: 60px; border-radius: 30px; background: #FFFFFF; box-shadow: 0 4px 16px rgba(29,42,34,0.14); display: flex; align-items: center; justify-content: space-around; font-size: 12px; font-weight: 700; color: #55635A">
      <span>List</span>
      <span style="color: #2E6B45; position: relative">Recipes<span style="position: absolute; top: -9px; right: -12px; min-width: 16px; height: 16px; border-radius: 8px; background: #A33D53; color: #FFFFFF; font-size: 11px; display: flex; align-items: center; justify-content: center">1</span></span>
      <span>Plan</span>
      <span>Settings</span>
    </div>
    <button aria-label="Add" style="width: 60px; height: 60px; border-radius: 30px; border: 0; background: #2E6B45; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(29,42,34,0.18)"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      recipes: [
        { name: 'Lemon pasta', meta: 'Dinner · 25 min', soft: '#F6EBD4', dot: '#C98A1E' },
        { name: 'Chicken tikka masala', meta: 'Dinner · 50 min', soft: '#F7E1E6', dot: '#C2556B' },
        { name: 'Shakshuka', meta: 'Breakfast · 30 min', soft: '#FAE4D6', dot: '#D0703A' },
        { name: 'Green curry', meta: 'Dinner · 35 min', soft: '#DDEFE2', dot: '#2E6B45' },
        { name: 'Banana bread', meta: 'Dessert · 1 hr 10 min', soft: '#ECE3F5', dot: '#8A5BB0' },
        { name: 'Miso salmon', meta: 'Dinner · 20 min', soft: '#DFEAF6', dot: '#3E7BB8' }
      ]
    };
  }
}
</script>
</body>
</html>
