<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review kept pages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #C9D3C7; display: flex; flex-direction: column; justify-content: flex-end; font-family: Figtree, sans-serif; color: #1D2A22; overflow: hidden">
  <div style="background: #EEF3EC; border-radius: 28px 28px 0 0; padding: 8px 20px 34px; display: flex; flex-direction: column; gap: 18px; height: 780px; box-sizing: border-box">
    <div style="display: flex; justify-content: center"><div style="width: 36px; height: 5px; border-radius: 3px; background: #B9C4BC"></div></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.025em">Add recipe from photo</h2>
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #1D2A22; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <div style="background: #F7E1E6; border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A33D53" stroke-width="2.2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
      <div style="font-size: 15px; color: #A33D53; font-weight: 600">Couldn't import this yesterday at 6:42 PM. Try again in a minute.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 12px">
        <sc-for list="{{pages}}" as="p" hint-placeholder-count="2">
          <div style="position: relative; width: 96px; height: 128px; border-radius: 12px; background: #FBF8F1; border: 1px solid #DCE4DA; box-sizing: border-box; padding: 14px 12px; display: flex; flex-direction: column; gap: 6px" aria-label="{{p.label}}">
            <div style="height: 7px; width: 70%; background: #8A9A8F; border-radius: 2px"></div>
            <div style="height: 4px; background: #C9D3C7; border-radius: 2px"></div>
            <div style="height: 4px; width: 85%; background: #C9D3C7; border-radius: 2px"></div>
            <div style="height: 4px; background: #C9D3C7; border-radius: 2px"></div>
            <div style="height: 4px; width: 60%; background: #C9D3C7; border-radius: 2px"></div>
            <div style="height: 4px; background: #C9D3C7; border-radius: 2px"></div>
            <div style="height: 4px; width: 75%; background: #C9D3C7; border-radius: 2px"></div>
            <button aria-label="Remove {{p.label}}" style="position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 14px; border: 2px solid #EEF3EC; background: #1D2A22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
          </div>
        </sc-for>
        <button style="width: 96px; height: 128px; border-radius: 12px; border: 2px dashed #B9C4BC; background: none; color: #55635A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          Add page
        </button>
      </div>
      <div style="display: flex; gap: 6px; align-items: flex-start; font-size: 13px; color: #55635A">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 2px"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5"></path></svg>
        <span>Kept on this phone for 30 days, or until the recipe imports.</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 700; color: #55635A">Save to</div>
      <div style="display: flex; gap: 8px">
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #2E6B45; color: #FFFFFF; font-size: 15px; font-weight: 600">Smith home</button>
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #FFFFFF; color: #1D2A22; font-size: 15px; font-weight: 600">Lake house</button>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
      <div style="display: flex; align-items: center; padding: 12px 14px; gap: 12px; border-bottom: 1px solid #EEF1EC">
        <span style="flex-grow: 1; font-size: 17px; font-weight: 500">Also add ingredients to a list</span>
        <div role="switch" aria-checked="true" aria-label="Also add ingredients to a list" style="width: 51px; height: 31px; border-radius: 16px; background: #2E6B45; position: relative"><div style="position: absolute; right: 2px; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF"></div></div>
      </div>
      <div style="display: flex; align-items: center; padding: 12px 14px; gap: 12px">
        <span style="flex-grow: 1; font-size: 17px; font-weight: 500">List</span>
        <span style="font-size: 15px; font-weight: 600; color: #55635A">Groceries</span>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7C877F" stroke-width="2.4" stroke-linecap="round"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"></path></svg>
      </div>
    </div>

    <div style="flex-grow: 1"></div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <button style="height: 52px; border-radius: 26px; border: 0; background: #2E6B45; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>
        Try again &amp; add to Groceries
      </button>
      <button style="height: 48px; border-radius: 24px; border: 0; background: #F7E1E6; color: #A33D53; font-size: 16px; font-weight: 600">Dismiss and delete photos</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { pages: [{ label: 'Page 1 of 2' }, { label: 'Page 2 of 2' }] };
  }
}
</script>
</body>
</html>
