<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan agenda, several recipes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E6B45}a:hover{color:#1F5233}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #EEF3EC; color: #1D2A22; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 12px;">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -1px;">Plan</h1>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button aria-label="Previous week" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D2A22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <div style="flex-grow: 1; text-align: center; font-size: 17px; font-weight: 700;">Oct 11 – 17</div>
      <button aria-label="Next week" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D2A22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      <button aria-label="Shop this week" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #2E6B45; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"></path><circle cx="9" cy="19.5" r="1.4"></circle><circle cx="17" cy="19.5" r="1.4"></circle></svg></button>
    </div>
  </div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px;">
    <button style="height: 44px; border: none; border-radius: 14px; background: #FFFFFF; padding: 0 14px; display: flex; align-items: center; gap: 8px; font: inherit; color: #55635A; font-size: 15px; font-weight: 600;">
      <span style="flex-grow: 1; text-align: left;">Earlier this week · Sun – Mon</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7C877F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
      <div style="background: #FFFFFF; border-radius: 16px; padding: 10px 12px; display: flex; gap: 12px; box-shadow: inset 0 0 0 {{d.ring}} #2E6B45;">
        <div style="width: 36px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding-top: 4px;">
          <span style="font-size: 12px; font-weight: 700; color: {{d.dayInk}};">{{d.short}}</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; line-height: 26px; color: {{d.dayInk}};">{{d.date}}</span>
        </div>
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;">
          <sc-for list="{{d.meals}}" as="m" hint-placeholder-count="3">
            <div style="display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid {{m.rule}};">
              <span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 11px; background: {{m.soft}}; color: {{m.strong}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{m.letter}}</span>
              <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
                <sc-for list="{{m.recipes}}" as="r" hint-placeholder-count="1">
                  <div style="display: flex; align-items: baseline; gap: 8px; min-height: 20px;">
                    <span style="flex: 1 1 0; min-width: 0; font-size: 15px; font-weight: {{r.weight}}; line-height: 20px; color: {{r.ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.name}}</span>
                    <span style="font-size: 13px; color: #55635A; white-space: nowrap;">{{r.time}}</span>
                  </div>
                </sc-for>
                <sc-if value="{{m.isNote}}" hint-placeholder-val="{{false}}">
                  <span style="font-size: 15px; line-height: 20px; font-style: italic; color: #55635A;">{{m.note}}</span>
                </sc-if>
                <sc-if value="{{m.isEmpty}}" hint-placeholder-val="{{false}}">
                  <span style="font-size: 15px; line-height: 20px; font-weight: 600; color: #2E6B45;">{{m.add}}</span>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
const R = {
  lentil: ['Red lentil soup', '40 min'],
  ricotta: ['Lemon ricotta pasta', '25 min'],
  caesar: ['Caesar salad', '15 min'],
  granola: ['Yogurt and granola', '5 min'],
  gnocchi: ['Sheet-pan gnocchi', '30 min'],
  stew: ['Beef stew', '2 hr 30 min'],
  bread: ['Crusty bread', '3 hr'],
  shak: ['Shakshuka', '35 min'],
  salmon: ['Salmon and rice', '25 min'],
  greens: ['Garlic green beans', '15 min'],
  chicken: ['Roast chicken', '1 hr 20 min'],
  potatoes: ['Crispy potatoes', '45 min'],
  guac: ['Guacamole', '10 min'],
  rice: ['Mexican rice', '30 min'],
};
const MEALS = [
  { key: 'breakfast', letter: 'B', soft: '#F6EBD4', strong: '#8A5C0C' },
  { key: 'lunch', letter: 'L', soft: '#DCEFEC', strong: '#1F6E68' },
  { key: 'dinner', letter: 'D', soft: '#ECE3F5', strong: '#6E4594' },
];
const W = [
  ['Tue', '13', [null, ['lentil'], ['ricotta', 'caesar']]],
  ['Wed', '14', [['granola'], 'note:Eat out', ['gnocchi']]],
  ['Thu', '15', [null, null, 'note:Pizza night']],
  ['Fri', '16', [null, ['lentil'], ['stew', 'bread']]],
  ['Sat', '17', [['shak'], null, ['chicken', 'potatoes', 'caesar', 'bread', 'guac', 'rice', 'greens']]],
];
const days = W.map(([short, date, cells]) => {
  const today = short === 'Tue';
  return {
    short, date,
    ring: today ? '2px' : '0',
    dayInk: today ? '#2E6B45' : '#1D2A22',
    meals: cells.map((k, i) => {
      const m = MEALS[i];
      const base = { letter: m.letter, soft: m.soft, strong: m.strong, rule: i === 0 ? 'transparent' : '#EEF1EC', recipes: [], isNote: false, isEmpty: false };
      if (!k) return { ...base, isEmpty: true, add: '+ Add ' + m.key };
      if (typeof k === 'string') return { ...base, isNote: true, note: k.slice(5) };
      return { ...base, recipes: k.map((s) => ({ name: R[s][0], time: R[s][1], weight: 600, ink: '#1D2A22' })) };
    }),
  };
});
return { days };
}
}
</script>
</body>
</html>
