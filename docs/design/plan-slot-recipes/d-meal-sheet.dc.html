<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filled slot sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E6B45}a:hover{color:#1F5233}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #C9D3C7; color: #1D2A22; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;">
  <div style="padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; opacity: 0.35;">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -1px;">Plan</h1>
    <div style="height: 44px; border-radius: 22px; background: #FFFFFF;"></div>
    <div style="height: 64px; border-radius: 12px; background: #FFFFFF;"></div>
    <div style="height: 64px; border-radius: 12px; background: #FFFFFF;"></div>
  </div>
  <div style="flex-grow: 1; background: #EEF3EC; border-radius: 24px 24px 0 0; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 16px;">
    <div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #B9C4BC;"></div>
    <div style="display: flex; align-items: flex-start; gap: 12px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 12px; font-weight: 700; color: #6E4594;">Tuesday 13</span>
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; line-height: 34px; letter-spacing: -0.6px;">Dinner</h2>
      </div>
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #DCE4DA; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1D2A22" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; display: flex; flex-direction: column;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px 10px 12px; border-top: 1px solid {{r.rule}};">
          <div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: {{r.bg}};">
            <svg style="width: 100%; height: 100%; display: block;" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="20" fill="#FFFFFF" fill-opacity="0.28"></circle><circle cx="26" cy="26" r="13" fill="{{r.food}}"></circle><circle cx="22" cy="22" r="4" fill="#FFFFFF" fill-opacity="0.35"></circle></svg>
          </div>
          <a href="#" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: #1D2A22;">
            <span style="font-size: 17px; font-weight: 700; line-height: 22px;">{{r.name}}</span>
            <span style="font-size: 13px; color: #55635A;">{{r.time}}</span>
          </a>
          <button aria-label="{{r.removeLabel}}" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A33D53" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12h8"></path></svg></button>
          <button aria-label="{{r.moveLabel}}" style="width: 36px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C877F" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h14"></path></svg></button>
        </div>
      </sc-for>
      <button style="height: 56px; border: none; border-top: 1px solid #EEF1EC; background: transparent; padding: 0 14px; display: flex; align-items: center; gap: 10px; font: inherit; font-size: 17px; font-weight: 600; color: #2E6B45; border-radius: 0 0 16px 16px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E6B45" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Add a recipe      </button>
    </div>
    <p style="margin: -4px 4px 0; font-size: 13px; line-height: 18px; color: #55635A;">Tap a recipe to open it. Drag to change the order they show in.</p>
    <div style="display: flex; gap: 8px;">
      <button style="flex: 1 1 0; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #1D2A22;">Replace all…</button>
      <button style="flex: 1 1 0; height: 44px; border-radius: 22px; border: none; background: #F7E1E6; font: inherit; font-size: 15px; font-weight: 600; color: #A33D53;">Clear dinner</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
  { name: 'Lemon ricotta pasta', time: '25 min', bg: '#EFDDA0', food: '#C9A43E' },
  { name: 'Caesar salad', time: '15 min', bg: '#CFE0B4', food: '#7FA05A' },
].map((r, i) => ({ ...r, rule: i === 0 ? 'transparent' : '#EEF1EC', removeLabel: 'Remove ' + r.name, moveLabel: 'Reorder ' + r.name }));
return { rows };
}
}
</script>
</body>
</html>
