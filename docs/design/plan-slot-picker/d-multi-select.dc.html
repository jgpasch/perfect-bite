<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slot sheet, pick several</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E6B45}a:hover{color:#1F5233}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #C9D3C7; font-family: Figtree, system-ui, sans-serif; color: #1D2A22; position: relative; overflow: hidden;">
  <div style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: #EEF3EC; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 14px; padding: 8px 0 0; overflow: hidden;">
    <div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #B9C4BC;"></div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 4px 16px 0 20px;">
      <sc-if value="{{isAdd}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-weight: 700; font-size: 13px; color: #6E4594;">Tuesday 27 · Dinner</div>
          <h1 style="margin: 0; font: 800 30px/1.1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.025em;">Add to dinner</h1>
        </div>
      </sc-if>
      <sc-if value="{{notAdd}}" hint-placeholder-val="{{true}}">
        <div>
          <div style="font-weight: 700; font-size: 17px; color: #6E4594;">Tuesday 27</div>
          <h1 style="margin: 0; font: 800 30px/1.1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.025em;">Dinner</h1>
        </div>
      </sc-if>
      <button aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #DCE4DA; border: 0; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D2A22" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <sc-if value="{{isAdd}}" hint-placeholder-val="{{false}}">
      <div style="margin: 0 16px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: #DDEFE2; color: #1F5233; font-size: 13px; font-weight: 600;">
        <span style="display: flex;">
          <span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 6px; border: 2px solid #DDEFE2; background: #EFDDA0;"></span>
          <span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 6px; border: 2px solid #DDEFE2; background: #CFE0B4; margin-left: -7px;"></span>
        </span>
        <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">With Lemon ricotta pasta, Caesar salad</span>
      </div>
    </sc-if>
    <div style="padding: 0 16px;">
      <label style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 16px; padding: 0 14px; height: 48px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C877F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input value="{{q}}" onChange="{{onQ}}" placeholder="Search recipes" aria-label="Search recipes" style="flex: 1; min-width: 0; background: transparent; border: 0; font: 500 17px Figtree, sans-serif; color: #1D2A22; outline: none;">
      </label>
    </div>
    <div style="display: flex; gap: 8px; padding: 0 16px; overflow: hidden; flex-shrink: 0;">
      <button aria-label="Filters" style="flex-shrink: 0; font: 600 15px Figtree, sans-serif; color: #1D2A22; background: #FFFFFF; border: 1.5px solid #B9C4BC; border-radius: 999px; padding: 0 12px; height: 40px; display: flex; align-items: center; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
        Filters
      </button>
      <button aria-pressed="false" style="flex-shrink: 0; font: 600 15px Figtree, sans-serif; color: #1D2A22; background: #FFFFFF; border: 0; border-radius: 999px; padding: 0 14px; height: 40px;">Dinner</button>
      <button aria-pressed="false" style="flex-shrink: 0; font: 600 15px Figtree, sans-serif; color: #1D2A22; background: #FFFFFF; border: 0; border-radius: 999px; padding: 0 14px; height: 40px;">Favorites</button>
      <button aria-pressed="false" style="flex-shrink: 0; font: 600 15px Figtree, sans-serif; color: #1D2A22; background: #FFFFFF; border: 0; border-radius: 999px; padding: 0 14px; height: 40px;">Want to try</button>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 20px;">
      <div style="font-weight: 700; font-size: 13px; color: #55635A;">{{countLabel}}</div>
      <button style="font: 600 15px Figtree, sans-serif; color: #2E6B45; background: transparent; border: 0; padding: 0; display: flex; align-items: center; gap: 4px;">Newest first
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
    <sc-if value="{{showHint}}" hint-placeholder-val="{{false}}">
      <div style="margin: -6px 20px 0; font-size: 13px; color: #55635A;">Tap a recipe to plan it. Tick the circle to pick several.</div>
    </sc-if>
    <div style="margin: 0 16px; background: #FFFFFF; border-radius: 22px; overflow: hidden; flex-shrink: 0;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; border-top: {{r.rule}}; background: {{r.bg}}; opacity: {{r.opacity}};">
          <button onClick="{{r.tap}}" disabled="{{r.disabled}}" aria-label="{{r.label}}" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: #1D2A22; text-align: left; display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 16px;">
            <span style="width: 48px; height: 48px; border-radius: 12px; background: {{r.tint}}; flex-shrink: 0; display: flex; align-items: center; justify-content: center;"><span style="width: 20px; height: 20px; border-radius: 10px; background: {{r.food}};"></span></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-weight: 500; font-size: 17px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.name}}</span>
              <span style="font-size: 13px; color: #55635A;">{{r.line}}</span>
            </span>
            <sc-if value="{{r.inline}}" hint-placeholder-val="{{true}}">
              <span style="width: 26px; height: 26px; box-sizing: border-box; flex-shrink: 0; border-radius: 13px; border: {{r.ring}}; background: {{r.dot}}; display: flex; align-items: center; justify-content: center;">
                <sc-if value="{{r.checked}}" hint-placeholder-val="{{false}}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{r.checkInk}}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                </sc-if>
              </span>
            </sc-if>
          </button>
          <sc-if value="{{r.split}}" hint-placeholder-val="{{false}}">
            <button onClick="{{r.toggle}}" aria-label="{{r.circleLabel}}" aria-pressed="{{r.pressed}}" style="width: 52px; height: 68px; flex-shrink: 0; border: 0; border-left: 1px solid #EEF1EC; background: transparent; display: flex; align-items: center; justify-content: center;">
              <span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: {{r.ring}}; background: {{r.dot}}; display: flex; align-items: center; justify-content: center;">
                <sc-if value="{{r.checked}}" hint-placeholder-val="{{false}}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                </sc-if>
              </span>
            </button>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{showNotCooking}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 30px; background: #EEF3EC; border-top: 1px solid #DCE4DA; display: flex; align-items: center; gap: 8px;">
      <div style="font-weight: 700; font-size: 13px; color: #55635A; width: 64px; line-height: 1.2;">Not cooking?</div>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
        <button style="font: 600 13px Figtree, sans-serif; color: #1D2A22; background: #FFFFFF; border: 0; border-radius: 14px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="9" width="16" height="10" rx="2"></rect><path d="M3 9h18M9 6h6"></path></svg>
          Leftovers
        </button>
        <button style="font: 600 13px Figtree, sans-serif; color: #1D2A22; background: #FFFFFF; border: 0; border-radius: 14px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2v8M7 3v6M11 3v6M17 3c-2 0-3 3-3 6s1 4 3 4v8"></path></svg>
          Eating out
        </button>
        <button style="font: 600 13px Figtree, sans-serif; color: #1D2A22; background: #FFFFFF; border: 0; border-radius: 14px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"></path><path d="M9 12h6M9 16h4"></path></svg>
          Note…
        </button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{showAddBar}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 0 30px; background: #EEF3EC; border-top: 1px solid #DCE4DA; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; gap: 8px; padding: 0 16px; overflow: hidden;">
        <sc-for list="{{tray}}" as="t" hint-placeholder-count="2">
          <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 2px 0 6px; border-radius: 12px; background: #FFFFFF;">
            <span style="width: 28px; height: 28px; border-radius: 8px; background: {{t.tint}}; display: flex; align-items: center; justify-content: center;"><span style="width: 12px; height: 12px; border-radius: 6px; background: {{t.food}};"></span></span>
            <span style="font-size: 15px; font-weight: 600; white-space: nowrap;">{{t.name}}</span>
            <button onClick="{{t.remove}}" aria-label="{{t.label}}" style="width: 36px; height: 36px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#55635A" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px;">
        <button onClick="{{clear}}" style="height: 52px; padding: 0 12px; border: 0; background: transparent; font: 600 17px Figtree, sans-serif; color: #2E6B45;">Clear</button>
        <button onClick="{{commit}}" style="flex: 1; height: 52px; border: 0; border-radius: 16px; background: #2E6B45; color: #FFFFFF; font: 700 17px Figtree, sans-serif;">{{cta}}</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{showToast}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 16px; right: 16px; bottom: 120px; min-height: 52px; border-radius: 14px; background: #1D2A22; color: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px;">
      <span style="flex: 1; font-size: 15px; font-weight: 600;">{{toast}}</span>
      <button onClick="{{undo}}" style="height: 44px; padding: 0 10px; border: 0; background: transparent; color: #C3E3CC; font: 700 15px Figtree, sans-serif;">Undo</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["a","b","c","d","e"],"default":"a"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  seed() {
    const start = this.props.start ?? 'a';
    if (start === 'b') return { ticked: ['caesar', 'bread'], q: '' };
    if (start === 'c') return { ticked: ['caesar', 'bread'], q: 'garlic' };
    if (start === 'd') return { ticked: ['bread'], q: '' };
    return { ticked: [], q: '' };
  }
  renderVals() {
    const start = this.props.start ?? 'a';
    const s = this.state && this.state.ready ? this.state : { ...this.seed(), ready: true, toast: '' };
    const set = (patch) => this.setState({ ...s, ...patch });
    const isAdd = start === 'd';
    const split = start === 'e';
    const already = isAdd ? ['pasta', 'caesar'] : [];
    const all = [
      { id: 'stew', name: 'Beef stew', meta: '2 hr 30 min · Added today', tint: '#E9D3C6', food: '#A9745A' },
      { id: 'caesar', name: 'Caesar salad', meta: '20 min · Added yesterday', tint: '#E3EDD3', food: '#7FA05A' },
      { id: 'tacos', name: 'Chicken tacos', meta: '35 min · Added Fri', tint: '#F4DCC9', food: '#B4532A' },
      { id: 'bread', name: 'Garlic bread', meta: '15 min · Added Wed', tint: '#F3E7C4', food: '#C9A43E' },
      { id: 'beans', name: 'Garlic green beans', meta: '15 min · Added Oct 18', tint: '#DCEAD0', food: '#5E8A3A' },
      { id: 'pasta', name: 'Lemon ricotta pasta', meta: '25 min · Added Oct 14', tint: '#F6ECCB', food: '#C9A43E' },
      { id: 'chicken', name: 'Roast chicken', meta: '1 hr 20 min · Added Oct 9', tint: '#F0DCC6', food: '#9A5A28' },
      { id: 'salmon', name: 'Salmon and rice', meta: '25 min · Added Oct 2', tint: '#F6D9CC', food: '#D06E4C' },
    ];
    const byId = Object.fromEntries(all.map((r) => [r.id, r]));
    const ticked = s.ticked;
    const toggle = (id) => set({ ticked: ticked.includes(id) ? ticked.filter((x) => x !== id) : [...ticked, id], toast: '' });
    const q = s.q.trim().toLowerCase();
    const shown = all.filter((r) => !q || r.name.toLowerCase().includes(q));
    const n = ticked.length;
    const rows = shown.slice(0, 7).map((r, i) => {
      const isAlready = already.includes(r.id);
      const on = ticked.includes(r.id);
      const checked = on || isAlready;
      return {
        ...r,
        line: isAlready ? 'Already in dinner' : r.meta,
        rule: i === 0 ? '0' : '1px solid #EEF1EC',
        bg: on ? '#DDEFE2' : 'transparent',
        opacity: isAlready ? 0.6 : 1,
        disabled: isAlready,
        checked,
        inline: !split,
        split,
        pressed: on ? 'true' : 'false',
        ring: checked ? '0' : '2px solid #B9C4BC',
        dot: isAlready ? '#DCE4DA' : on ? '#2E6B45' : 'transparent',
        checkInk: isAlready ? '#55635A' : '#FFFFFF',
        label: split ? r.name + ', plan for dinner' : r.name + (on ? ', selected' : ''),
        circleLabel: 'Select ' + r.name,
        tap: split && n === 0
          ? () => set({ toast: 'Planned ' + r.name + ' for Tue dinner' })
          : () => toggle(r.id),
        toggle: () => toggle(r.id),
      };
    });
    const tray = ticked.map((id) => ({
      ...byId[id],
      label: 'Remove ' + byId[id].name,
      remove: () => toggle(id),
    }));
    const base = q ? shown.length + ' recipes' : 'All recipes';
    const cta = n === 1 ? 'Add to dinner' : 'Add ' + n + ' to dinner';
    return {
      isAdd,
      notAdd: !isAdd,
      q: s.q,
      onQ: (e) => set({ q: e.target.value }),
      countLabel: n > 0 ? n + ' selected · ' + base : base,
      showHint: split && n === 0,
      rows,
      tray,
      cta,
      showNotCooking: n === 0 && !isAdd,
      showAddBar: n > 0,
      clear: () => set({ ticked: [], toast: '' }),
      commit: () => set({ ticked: [], toast: n === 1 ? 'Added ' + byId[ticked[0]].name + ' to Tue dinner' : 'Added ' + n + ' recipes to Tue dinner' }),
      showToast: !!s.toast,
      toast: s.toast,
      undo: () => set({ toast: '' }),
    };
  }
}
</script>
</body>
</html>
