<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chips with pinned bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:#7CC395}a:hover{color:#A6DDB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B110E; font-family: Figtree, system-ui, sans-serif; color: #E7EEE8; position: relative; overflow: hidden;">
  <div style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: #111915; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 14px; padding: 8px 0 0; overflow: hidden;">
    <div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #3A463F;"></div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 4px 16px 0 20px;">
      <div>
        <div style="font-weight: 700; font-size: 17px; color: #E3AE4E;">Tuesday 20</div>
        <h1 style="margin: 0; font: 800 30px/1.1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.025em;">Breakfast</h1>
      </div>
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #1B241F; border: 0; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E7EEE8" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div style="padding: 0 16px;">
      <label style="display: flex; align-items: center; gap: 10px; background: #1B241F; border-radius: 16px; padding: 0 14px; height: 48px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7E8B82" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input placeholder="Search recipes" aria-label="Search recipes" style="flex: 1; background: transparent; border: 0; font: 500 17px Figtree, sans-serif; color: #E7EEE8; outline: none;">
      </label>
    </div>
    <div style="display: flex; gap: 8px; padding: 0 16px; overflow: hidden;">
      <button aria-label="All filters" style="flex-shrink: 0; font: 600 15px Figtree, sans-serif; color: #E7EEE8; background: #1B241F; border: 1.5px solid #3A463F; border-radius: 999px; padding: 0 12px; height: 40px; display: flex; align-items: center; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
        Filters
      </button>
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex-shrink: 0; font: 600 15px Figtree, sans-serif; color: {{c.fg}}; background: {{c.bg}}; border: 0; border-radius: 999px; padding: 0 14px; height: 40px;">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 20px;">
      <div style="font-weight: 700; font-size: 13px; color: #A6B3AA;">{{countLabel}}</div>
      <button style="font: 600 15px Figtree, sans-serif; color: #7CC395; background: transparent; border: 0; padding: 0; display: flex; align-items: center; gap: 4px;">{{sortLabel}}
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
    <div style="margin: 0 16px; background: #1B241F; border-radius: 22px; overflow: hidden; flex-shrink: 0;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: {{r.rule}};">
          <div style="width: 48px; height: 48px; border-radius: 12px; background: {{r.tint}}; flex-shrink: 0;"></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <div style="font-weight: 500; font-size: 17px; line-height: 1.25;">{{r.name}}</div>
            <div style="font-size: 13px; color: #A6B3AA;">{{r.line}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 30px; background: #141D18; border-top: 1px solid #26302A; display: flex; align-items: center; gap: 8px;">
    <div style="font-weight: 700; font-size: 13px; color: #A6B3AA; width: 64px; line-height: 1.2;">Not cooking?</div>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
      <button style="font: 600 13px Figtree, sans-serif; color: #E7EEE8; background: #1B241F; border: 0; border-radius: 14px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="9" width="16" height="10" rx="2"></rect><path d="M3 9h18M9 6h6"></path></svg>
        Leftovers
      </button>
      <button style="font: 600 13px Figtree, sans-serif; color: #E7EEE8; background: #1B241F; border: 0; border-radius: 14px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2v8M7 3v6M11 3v6M17 3c-2 0-3 3-3 6s1 4 3 4v8"></path></svg>
        Eating out
      </button>
      <button style="font: 600 13px Figtree, sans-serif; color: #E7EEE8; background: #1B241F; border: 0; border-radius: 14px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"></path><path d="M9 12h6M9 16h4"></path></svg>
        Note
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = (this.state && this.state.on) || {};
    const all = [
      { name: 'Miso Butter Salmon', tint: '#3B1E26', meta: '30 min · Added today', tags: ['want'], age: 0 },
      { name: 'Scrambled Eggs with Parmesan', tint: '#33290F', meta: '15 min · Added today', tags: ['breakfast', 'fav'], age: 0 },
      { name: 'Cottage Cheese Blueberry Bread', tint: '#1B2D3F', meta: '55 min · Added Mon', tags: ['breakfast', 'want'], age: 1 },
      { name: 'Lemon Orzo Soup', tint: '#163633', meta: '40 min · Added Oct 15', tags: ['fav'], age: 7 },
      { name: 'Gluten-Free Breakfast Casserole', tint: '#3A2416', meta: '1 hr 15 min · Added Oct 12', tags: ['breakfast', 'fav'], age: 10 },
      { name: 'Overnight Oats', tint: '#1E3A28', meta: '5 min · Added Sep 30', tags: ['breakfast'], age: 22 },
      { name: 'Sheet Pan Chicken Fajitas', tint: '#3A2416', meta: '35 min · Added Sep 2', tags: [], age: 50 },
    ];
    const defs = [['breakfast', 'Breakfast'], ['fav', 'Favorites'], ['want', 'Want to try']];
    const chips = defs.map(([id, label]) => ({
      label,
      pressed: on[id] ? 'true' : 'false',
      bg: on[id] ? '#7CC395' : '#1B241F',
      fg: on[id] ? '#0E1F14' : '#E7EEE8',
      pick: () => this.setState({ on: { ...on, [id]: !on[id] } }),
    }));
    const keep = (r) => Object.keys(on).every((k) => !on[k] || r.tags.includes(k));
    const shown = all
      .filter(keep)
      .sort((a, b) => a.age - b.age)
      .map((r) => ({ ...r, line: r.meta }));
    const any = Object.keys(on).some((k) => on[k]);
    return {
      chips,
      countLabel: any ? shown.length + ' recipes' : 'All recipes',
      sortLabel: 'Newest first',
      rows: shown.slice(0, 6).map((r, i) => ({ ...r, rule: i === 0 ? '0' : '1px solid #26302A' })),
    };
  }
}
</script>
</body>
</html>
