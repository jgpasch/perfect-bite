<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filters sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:#7CC395}a:hover{color:#A6DDB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B110E; font-family: Figtree, system-ui, sans-serif; color: #E7EEE8; position: relative; overflow: hidden;">
  <div aria-hidden="true" style="position: absolute; left: 12px; right: 12px; top: 54px; height: 60px; background: #0E1512; border-radius: 28px 28px 0 0;"></div>
  <div style="position: absolute; left: 0; right: 0; top: 70px; bottom: 0; background: #111915; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 18px; padding: 8px 0 0;">
    <div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #3A463F;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
      <button style="font: 500 17px Figtree, sans-serif; color: #E7EEE8; background: #1B241F; border: 0; border-radius: 999px; padding: 11px 18px;">Clear</button>
      <h1 style="margin: 0; font: 800 22px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em;">Filters</h1>
      <div style="width: 84px;"></div>
    </div>
    <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 0 20px;">
      <sc-for list="{{facets}}" as="f" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="font-weight: 700; font-size: 13px; color: #A6B3AA;">{{f.label}}</div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <sc-for list="{{f.values}}" as="v" hint-placeholder-count="3">
              <button aria-pressed="{{v.pressed}}" style="font: 600 15px Figtree, sans-serif; color: {{v.fg}}; background: {{v.bg}}; border: 0; border-radius: 999px; padding: 0 14px; height: 38px;">{{v.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="padding: 12px 16px 28px; background: #111915; border-top: 1px solid #26302A;">
      <button style="width: 100%; height: 54px; border: 0; border-radius: 999px; background: #7CC395; color: #0E1F14; font: 700 17px Figtree, sans-serif;">Show 4 recipes</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const v = (label, on) => ({ label, pressed: on ? 'true' : 'false', bg: on ? '#7CC395' : '#1B241F', fg: on ? '#0E1F14' : '#E7EEE8' });
    return {
      facets: [
        { label: 'Saved', values: [v('Favorite'), v('Want to try')] },
        { label: 'Meal', values: [v('Breakfast', true), v('Lunch'), v('Dinner'), v('Snack')] },
        { label: 'Protein', values: [v('Eggs', true), v('Chicken'), v('Fish'), v('Beans & lentils')] },
        { label: 'Diet', values: [v('Vegetarian', true), v('Vegan')] },
        { label: 'Cuisine', values: [v('American'), v('Italian'), v('Mexican'), v('Mediterranean')] },
        { label: 'Method', values: [v('Sheet pan'), v('One pot'), v('No cook'), v('Air fryer')] },
        { label: 'Time', values: [v('Under 15 min'), v('Under 30 min'), v('Under 1 hr')] },
      ],
    };
  }
}
</script>
</body>
</html>
