<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe screen with collections</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF3EC; font-family: Figtree, sans-serif; color: #1D2A22">
<div style="padding: 54px 8px 0; display: flex; align-items: center; justify-content: space-between">
<button style="min-height: 44px; padding: 0 8px; border: none; background: transparent; color: #2E6B45; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg>Mom's cookbook</button>
<button aria-label="More" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #DCE4DA; color: #2E6B45; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
</div>
<div style="padding: 6px 16px 0; display: flex; flex-direction: column">
<h1 style="margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em; line-height: 1.15">Pot roast</h1>
<div style="font-size: 15px; color: #55635A; min-height: 28px; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M8 6l1.5-2h5L16 6"></path></svg>From photos · See original pages</div>
<button aria-label="Tags: Dinner, American, Beef, Over 1 hour" style="min-height: 44px; padding: 0; border: none; background: transparent; color: #55635A; font-size: 13px; display: flex; align-items: center; gap: 6px; text-align: left">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1.5"></circle></svg>
<span style="flex: 1">Dinner · American · Beef · Over 1 hour</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</button>
<button aria-label="Collections: Mom's cookbook, Kid favorites" style="min-height: 44px; padding: 0; border: none; border-top: 1px solid #DCE4DA; background: transparent; color: #55635A; font-size: 13px; display: flex; align-items: center; gap: 6px; text-align: left">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"></rect><path d="M6 6h12M9 3h6"></path></svg>
<span style="flex: 1">Mom's cookbook · Kid favorites</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</button>
</div>
<div style="margin: 10px 16px 0; background: #FFFFFF; border-radius: 22px; padding: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700">Ingredients</h2>
<div style="display: flex; align-items: center; gap: 4px; background: #EEF3EC; border-radius: 999px; padding: 2px">
<button aria-label="Fewer servings" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: transparent; color: #2E6B45; font-size: 22px; font-weight: 700">−</button>
<span style="font-size: 15px; font-weight: 600">Serves 6</span>
<button aria-label="More servings" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: transparent; color: #2E6B45; font-size: 22px; font-weight: 700">+</button>
</div>
</div>
<div style="margin-top: 8px; display: flex; flex-direction: column">
<sc-for list="{{ings}}" as="i" hint-placeholder-count="6">
<div style="display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EEF1EC; font-size: 17px"><span style="width: 76px; flex-shrink: 0; font-size: 15px; font-weight: 600; color: #55635A">{{i.q}}</span><span style="font-weight: 500">{{i.n}}</span></div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
ings: [
{ q: '3 lb', n: 'chuck roast' },
{ q: '1', n: 'yellow onion' },
{ q: '4', n: 'carrots' },
{ q: '1 lb', n: 'baby potatoes' },
{ q: '2 cups', n: 'beef broth' },
{ q: '2 tbsp', n: 'tomato paste' },
{ q: '3', n: 'garlic cloves' }
]
};
}
}
</script>
</body>
</html>
