<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filters with collections</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #C9D3C7; font-family: Figtree, sans-serif; color: #1D2A22">
<div style="position: absolute; left: 0; right: 0; top: 60px; bottom: 0; background: #EEF3EC; border-radius: 22px 22px 0 0; padding: 8px 16px 0; display: flex; flex-direction: column">
<div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #B9C4BC"></div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; line-height: 1.1">Filters</h1>
<button style="min-height: 44px; padding: 0 4px; border: none; background: transparent; color: #2E6B45; font-size: 17px">Clear</button>
</div>
<div style="margin-top: 10px; display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 2px; font-size: 13px; font-weight: 700; color: #55635A">{{g.title}}</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{g.vals}}" as="v" hint-placeholder-count="4">
<button aria-pressed="{{v.on}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{v.border}}; background: {{v.bg}}; color: {{v.fg}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px">{{v.label}}</button>
</sc-for>
</div>
</section>
</sc-for>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 34px">
<button style="width: 100%; min-height: 52px; border-radius: 999px; border: none; background: #2E6B45; color: #FFFFFF; font-size: 17px; font-weight: 700">Show 5 recipes</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const v = (label, on) => on
? { label, on: true, bg: '#2E6B45', fg: '#FFFFFF', border: '#2E6B45' }
: { label, on: false, bg: '#FFFFFF', fg: '#1D2A22', border: '#B9C4BC' };
return {
groups: [
{ title: 'Saved', vals: [v('Favorites'), v('Want to try')] },
{ title: 'Collections', vals: [v("Mom's cookbook", true), v('Kid favorites'), v('Weeknight dinners'), v('Thanksgiving')] },
{ title: 'Meal', vals: [v('Breakfast'), v('Dinner', true), v('Side'), v('Dessert')] },
{ title: 'Protein', vals: [v('Chicken'), v('Beef'), v('Pork'), v('Fish'), v('Eggs')] },
{ title: 'Time', vals: [v('Under 30 min'), v('Under 1 hour'), v('Over 1 hour')] }
]
};
}
}
</script>
</body>
</html>
