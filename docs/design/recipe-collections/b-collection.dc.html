<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mom's cookbook collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF3EC; font-family: Figtree, sans-serif; color: #1D2A22">
<div style="padding: 54px 8px 0; display: flex; align-items: center; justify-content: space-between">
<button style="min-height: 44px; padding: 0 8px; border: none; background: transparent; color: #2E6B45; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg>Recipes</button>
<button aria-label="More" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #DCE4DA; color: #2E6B45; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
</div>
<div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -0.02em; line-height: 1.1">Mom's cookbook</h1>
<div style="font-size: 15px; color: #55635A">12 recipes</div>
</div>
<div style="padding: 16px 16px 0; display: flex; gap: 8px">
<button style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #DDEFE2; color: #1F5233; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add recipes</button>
<button style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #B9C4BC; background: #FFFFFF; color: #1D2A22; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filter</button>
</div>
<div style="margin: 16px 16px 0; background: #FFFFFF; border-radius: 18px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 64px; box-sizing: border-box; border-bottom: 1px solid #EEF1EC">
<div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; background: {{r.soft}}; color: {{r.dot}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v7a2 2 0 0 0 4 0V3M9 12v9M17 3c-2 2-2.5 5-2.5 8H17v10"></path></svg></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</div>
<div style="font-size: 13px; color: #55635A">{{r.meta}}</div>
</div>
</div>
</sc-for>
</div>
<div style="position: absolute; top: 100px; right: 12px; width: 250px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 10px 30px rgba(29,42,34,0.18); overflow: hidden">
<button style="width: 100%; min-height: 44px; padding: 0 16px; border: none; border-bottom: 1px solid #EEF1EC; background: transparent; color: #1D2A22; font-size: 17px; display: flex; align-items: center; justify-content: space-between">Rename<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
<button style="width: 100%; min-height: 44px; padding: 0 16px; border: none; border-bottom: 1px solid #EEF1EC; background: transparent; color: #1D2A22; font-size: 17px; display: flex; align-items: center; justify-content: space-between">Select recipes<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg></button>
<button style="width: 100%; min-height: 44px; padding: 0 16px; border: none; background: transparent; color: #A33D53; font-size: 17px; display: flex; align-items: center; justify-content: space-between">Delete collection<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const H = { green: ['#2E6B45', '#DDEFE2'], teal: ['#2A8C84', '#DCEFEC'], blue: ['#3E7BB8', '#DFEAF6'], plum: ['#8A5BB0', '#ECE3F5'], rose: ['#C2556B', '#F7E1E6'], orange: ['#D0703A', '#FAE4D6'], amber: ['#C98A1E', '#F6EBD4'] };
const r = (name, meta, h) => ({ name, meta, dot: H[h][0], soft: H[h][1] });
return {
rows: [
r('Banana bread', 'Dessert · Over 1 hour', 'amber'),
r('Chicken and dumplings', 'Dinner · Over 1 hour', 'orange'),
r('Green bean casserole', 'Side · Under 1 hour', 'green'),
r('Lemon bars', 'Dessert · Under 1 hour', 'amber'),
r('Pot roast', 'Dinner · Over 1 hour', 'orange'),
r('Potato salad', 'Side · Under 30 min', 'teal'),
r('Sunday meatloaf', 'Dinner · Over 1 hour', 'rose'),
r('Tuna noodle casserole', 'Dinner · Under 1 hour', 'blue')
]
};
}
}
</script>
</body>
</html>
