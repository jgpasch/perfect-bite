<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipes with a Collections shelf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1F4D33; font-family: Figtree, sans-serif; color: #1D2A22">
<div style="padding: 56px 16px 0; display: flex; flex-direction: column; gap: 14px; color: #FFFFFF">
<div style="display: flex; align-items: center; gap: 8px">
<h1 style="flex: 1; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.025em; line-height: 1.1">Recipes</h1>
<button aria-label="Sort and group" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,0.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"></path></svg></button>
<button aria-label="Add recipe" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; color: #1F4D33; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 4px 0 14px; border-radius: 14px; background: rgba(255,255,255,0.14); color: #B7D2BF; font-size: 17px; font-weight: 500">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="flex: 1">Search 52 recipes</span>
<span style="width: 1px; height: 22px; background: rgba(255,255,255,0.22)"></span>
<button aria-label="Filters" style="width: 44px; height: 40px; border: none; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; top: 186px; bottom: 0; background: #EEF3EC; border-radius: 22px 22px 0 0; padding-top: 14px; display: flex; flex-direction: column; gap: 18px">
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 16px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55635A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
<h2 style="flex: 1; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700">This week</h2>
<button style="min-height: 44px; border: none; background: transparent; color: #2E6B45; font-size: 15px; font-weight: 600">See all 4</button>
</div>
<div style="display: flex; gap: 12px; padding: 0 16px; overflow: hidden">
<sc-for list="{{week}}" as="r" hint-placeholder-count="3">
<div style="flex-shrink: 0; width: 132px; display: flex; flex-direction: column; gap: 5px">
<div style="width: 132px; height: 92px; border-radius: 14px; background: {{r.soft}}; color: {{r.dot}}; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v7a2 2 0 0 0 4 0V3M9 12v9M17 3c-2 2-2.5 5-2.5 8H17v10"></path></svg></div>
<div style="font-size: 15px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</div>
<div style="font-size: 13px; color: #55635A">{{r.cap}}</div>
</div>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 16px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55635A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"></rect><path d="M6 6h12M9 3h6"></path></svg>
<h2 style="flex: 1; margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700">Collections</h2>
<button style="min-height: 44px; border: none; background: transparent; color: #2E6B45; font-size: 15px; font-weight: 600">See all 4</button>
</div>
<div style="display: flex; gap: 12px; padding: 0 16px; overflow: hidden">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="3">
<button style="flex-shrink: 0; width: 132px; padding: 0; border: none; background: transparent; text-align: left; color: #1D2A22; display: flex; flex-direction: column; gap: 5px">
<div style="width: 132px; height: 92px; border-radius: 14px; overflow: hidden; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; background: #FFFFFF">
<span style="background: {{c.a}}"></span><span style="background: {{c.b}}"></span><span style="background: {{c.c}}"></span><span style="background: {{c.d}}"></span>
</div>
<span style="font-size: 15px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
<span style="font-size: 13px; color: #55635A">{{c.count}}</span>
</button>
</sc-for>
<button style="flex-shrink: 0; width: 132px; height: 92px; border-radius: 14px; border: 2px dashed #B9C4BC; background: transparent; color: #2E6B45; font-size: 15px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New collection</button>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
<div style="display: flex; align-items: baseline; gap: 8px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700">All recipes</h2>
<span style="font-size: 13px; font-weight: 700; color: #55635A">52</span>
</div>
<div style="background: #FFFFFF; border-radius: 18px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 64px; box-sizing: border-box; border-bottom: 1px solid #EEF1EC">
<div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; background: {{r.soft}}; color: {{r.dot}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v7a2 2 0 0 0 4 0V3M9 12v9M17 3c-2 2-2.5 5-2.5 8H17v10"></path></svg></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 17px; font-weight: 600">{{r.name}}</div>
<div style="font-size: 13px; color: #55635A">{{r.meta}}</div>
</div>
</div>
</sc-for>
</div>
</section>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; gap: 12px">
<div style="flex: 1; height: 62px; background: #FFFFFF; border: 1px solid #B9C4BC; border-radius: 999px; display: flex; align-items: center; padding: 0 6px; box-sizing: border-box">
<div style="flex: 1; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">Lists</div>
<div style="flex: 1; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #DCE4DA; color: #2E6B45">Recipes</div>
<div style="flex: 1; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">Plan</div>
<div style="flex: 1; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">Settings</div>
</div>
<button aria-label="Add" style="width: 62px; height: 62px; border-radius: 50%; border: none; background: #2E6B45; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const H = { green: ['#2E6B45', '#DDEFE2'], teal: ['#2A8C84', '#DCEFEC'], blue: ['#3E7BB8', '#DFEAF6'], plum: ['#8A5BB0', '#ECE3F5'], rose: ['#C2556B', '#F7E1E6'], orange: ['#D0703A', '#FAE4D6'], amber: ['#C98A1E', '#F6EBD4'] };
const r = (name, cap, h) => ({ name, cap, dot: H[h][0], soft: H[h][1] });
const c = (name, count, hs) => ({ name, count, a: H[hs[0]][1], b: H[hs[1]][1], c: H[hs[2]][1], d: H[hs[3]][1] });
return {
week: [r('Lemon herb salmon', 'Thu dinner', 'blue'), r('Shakshuka', 'Sat breakfast', 'green'), r('Pot roast', 'Sun dinner', 'orange')],
cols: [c("Mom's cookbook", '12 recipes', ['orange', 'amber', 'rose', 'green']), c('Kid favorites', '9 recipes', ['blue', 'amber', 'teal', 'plum'])],
rows: [
{ name: 'Bang bang shrimp', meta: 'Dinner · 35 min', dot: H.rose[0], soft: H.rose[1] },
{ name: 'Banana bread', meta: 'Dessert · Over 1 hour', dot: H.amber[0], soft: H.amber[1] }
]
};
}
}
</script>
</body>
</html>
