t.ts (16, fake Pexels) covers the mapping and request params; the query key and page; non-https and incomplete photos dropped and an empty alt as null; hasMore, page 10 included; no results, cached; a cache hit not calling Pexels or counting the global cap; another page not being a hit; a hit still rate-limited; the user limit; the global cap; no key; Pexels 429; Pexels 500, 401, a network error, HTML and no photos; the timeout; a failed cache save; bad queries and pages refused before counting. request.test.ts (8) covers trimming and the default page, bounds, 405, the 400s, 413 declared or not, failure statuses and Retry-After, 401 from the deployed function, and the cap env. pgTAP 40_photo_search.test.sql (33) covers the minute and day limits with cache hits, the global cap counting only fresh searches, a refused search using no budget, the cache (save, replace, 24-hour expiry, per page), the retention job and access. Jest src/shared/__tests__/photo-search.test.ts covers schema bounds, refusals, photoSearchKey and the shared index. Deno photo-search: 24 passed (needs --allow-sys, as the other functions do, because an npm dependency reads the hostname). supabase db reset and supabase test db pass (40 files, 1091 tests). jest 4577 passed; lint and tsc clean."],"manualChecks":["Picking a stock photo, and its credit: needs `PIXABAY_API_KEY` in `supabase/functions/.env` and the photo-search function served (`supabase functions serve --env-file supabase/functions/.env`). On a simulator, open a recipe with no photo, tap Add photo, search, tap Load more, then pick a result. The sheet should close, the thumb should show with a spinner, and then the photo should appear with \"Photo updated\" and the \"Photo: \u003cname> / Pixabay\" chip at the bottom right. Tapping the chip should open the photo's Pixabay page in Safari, and VoiceOver should read \"Photo by \u003cname> on Pixabay, link\". Check that \"Photos provided by Pixabay\" shows under the results, that with the app in Spanish a Spanish search (\"pollo asado\") finds photos, that Change photo… also shows the search, that Undo puts back the previous photo and its credit, that a second signed-in member sees the photo and credit after sync, and that Photo library and Take photo still work and show no chip."]},{"id":"0d7561c86f06","section":"Stock photo search","goal":"Goal: in the Choose a photo sheet (spec 4.5), a recipe's photo can also come from a search of free stock photos (Pexels), alongside From the page, Photo library and Take photo, which stay as they are. The sheet opens from both the Add photo tile and Change photo…, so search shows in both. A picked stock photo is downloaded, shrunk and uploaded like a library photo, so it's the household's own photo (`photo_path`) and keeps every own-photo behaviour (disk cache, offline, cleanup); it also carries a credit to the photographer and Pexels, as Pexels' API guidelines ask. Read https://www.pexels.com/api/documentation/ before the Edge Function task. The Pexels key (`PEXELS_API_KEY`) is added by hand after this section; until then the function answers `503 unavailable` and the section shows its failure state, and every test uses a fake Pexels.","title":"The Search photos section in the Choose a photo sheet","text":"The Search photos section in the Choose a photo sheet (spec 4.5). In `src/app/recipe/[id]/photo.tsx`, between From the page (when shown) and Photo library / Take photo: a \"Search photos\" group with a search field (`TextField`, return key \"Search\", VoiceOver \"Search photos\"), pre-filled with the recipe's name but not searched until the sheet opens (search once on open with the name, then only on Return; never on each keystroke). Results in the same two-column grid of 4:3 tiles as the page photos (radius `md`, cropped, `thumb`), the photographer's name over each tile's bottom edge (`caption` `inkSecondary` on a `surface` chip), VoiceOver \"Photo by Jane Doe, 3 of 20, button\" (use `alt` too when present). A **Load more** button under the grid while `hasMore` (pages up to 10). Under the grid, \"Photos provided by Pexels\" (`footnote` `inkSecondary`) linking to https://www.pexels.com in Safari. States as the page photos: placeholder tiles (`surfaceMuted`) while loading; offline, the field disabled with \"Needs a connection\"; no results, \"No photos for \"X\". Try another word.\"; `rate_limited`, \"You've searched a lot today. Try again later.\"; anything else, \"Couldn't search photos. Try again later.\" A tile that fails to load leaves the grid. The loading logic in `src/features/recipes/photo-search.ts` (`searchPhotos(query, page)` → result or error, as `loadPagePhotos`). Strings in `en.ts` and `es.ts`. Tokens from DESIGN.md only. Jest: the search on open uses the recipe name; typing doesn't search, Return does; Load more appends; each state; the Pexels link. Update spec 4.5 (the sheet's sections).","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":["Search photos section (2026-10-17, spec 4.5). New src/features/recipes/photo-search.ts has searchPhotos(query, page = 1), which returns `{ ok, photos, hasMore }` or an error: offline, rate_limited or failed. It works like loadPagePhotos: offline, no session or no config is offline; FunctionsFetchError or a throw is offline; rate_limited, or a bare 429, is rate_limited; everything else, including a 503 with no key and a bad response, is failed. An empty query or a page outside 1–10 fails without a request, and page 10 never has more. photoSearchQuery trims and cuts to 100 characters, and appendPhotos adds a page while dropping ids already shown. In photo.tsx, a \"Search photos\" group sits between From the page and the Photo library card. It has a TextField (return key search, VoiceOver \"Search photos\", pre-filled with the recipe's name). The opening search starts in a loading state set in useState, and an effect sends the request, so lint's set-state-in-effect rule is satisfied. After that only Return searches. Each search bumps a run counter, so a late answer to an older one is dropped. The results use the same Grid with a new SearchTile: 4:3, radius md, the thumb, and the author on a surface chip in caption inkSecondary. VoiceOver reads \"Photo by X, i of n\", or \"{alt}, photo by X, i of n\" when Pexels gives a description. Load more (Button, busy while loading) asks for the next page of the searched query, not the edited text. A failed Load more keeps the photos and shows the error, and it can be tapped again. \"Photos provided by Pexels\" is a footnote link that opens https://www.pexels.com through openRecipeLink. The states: placeholders labelled \"Searching photos\"; offline (known, or from the search) disables the field with \"Needs a connection\"; no results says \"No photos for “X”. Try another word.\"; rate_limited and failed show their messages. A broken thumb leaves the grid. Tiles don't do anything when tapped yet (onPick is unset); the next task wires picking. Strings are in en/es, and spec 4.5 describes the section. Tests: new search-photos.test.ts (17) covers the request body, the default page and the cut, page 10, bad input with no request, offline three ways, fetch errors and throws, rate_limited by code and status, 503/502/400/500 as failed, a bad response, photoSearchQuery and appendPhotos. recipe-photo-sheet.test.tsx \"Search photos\" (17) covers the search on open with the name and placeholders; the section's place; a long name cut; tile and chip style; typing not searching while Return does; an empty Return; a stale answer dropped; Load more paging, busy, de-duplicated and hidden on the last page; no Load more; a failed Load more then a retry; offline two ways; no results; rate_limited and failed; a broken tile; and the Pexels link. I changed four existing assertions in recipe-photo-sheet.test.tsx because the sheet now has this section: three texts() lists gain \"Search photos\" and \"Photos provided by Pexels\", and the offline count of \"Needs a connection\" goes from 2 to 3. The expo-linking mock there is now a spy. jest 4611 passed, lint and tsc clean."],"manualChecks":[]},{"id":"ae83424f26dc","section":"Stock photo search","goal":"Goal: in the Choose a photo sheet (spec 4.5), a recipe's photo can also come from a search of free stock photos (Pexels), alongside From the page, Photo library and Take photo, which stay as they are. The sheet opens from both the Add photo tile and Change photo…, so search shows in both. A picked stock photo is downloaded, shrunk and uploaded like a library photo, so it's the household's own photo (`photo_path`) and keeps every own-photo behaviour (disk cache, offline, cleanup); it also carries a credit to the photographer and Pexels, as Pexels' API guidelines ask. Read https://www.pexels.com/api/documentation/ before the Edge Function task. The Pexels key (`PEXELS_API_KEY`) is added by hand after this section; until then the function answers `503 unavailable` and the section shows its failure state, and every test uses a fake Pexels.","title":"Picking a stock photo, and its credit","text":"Picking a stock photo, and its credit (spec 4.5). Tapping a search result closes the sheet and runs the own-photo flow: download `full` to the cache directory (expo-file-system's current API for SDK in `package.json`; read the versioned docs), `downscalePhoto(uri, UPLOAD_PHOTO)`, then `uploadRecipePhoto(recipeId, localUri, credit)` with `{ provider: 'pexels', author, authorUrl, pageUrl }`. The recipe screen shows the spinner while it downloads and uploads, then \"Photo updated\" with **Undo**; a failed download or upload shows \"Couldn't upload the photo\" with **Try again** (which retries the whole pick). The credit shows wherever the source credit would on a site photo (the photo's bottom-right corner on the recipe screen): \"Photo: Jane Doe / Pexels\" as a `caption` `inkSecondary` `surface` chip; tapping it opens `pageUrl` in Safari; VoiceOver \"Photo by Jane Doe on Pexels, link\". It replaces the \"own photo never shows a credit\" rule with \"an own photo shows its `photo_credit` when it has one\"; the site source credit still never shows on an own photo. Recipes tab rows and plan tiles don't show it. Jest: picking a result uploads with the credit; a failed download leaves the recipe as it was and offers Try again; the chip renders with the right text and link for a credited own photo and not for a library photo; Undo of a stock pick restores the old photo and credit. NEEDS A MANUAL CHECK (needs `PEXELS_API_KEY` in `supabase/functions/.env` and the function served): on a simulator, open a recipe with no photo, tap Add photo, search, Load more, pick one, and the photo uploads with the credit chip; Change photo… shows the search too; Undo works; a second signed-in member sees the photo and credit after sync; Photo library and Take photo still work. Update spec 4.5.","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":["Picking a stock photo, and its credit (2026-10-17, spec 4.5). photo-upload.ts: the upload body moved into a private runUpload(recipeId, shown, credit, stock, prepare). uploadRecipePhoto uses it and works the same. The new uploadStockPhoto(recipeId, photo) downloads `full` with expo-file-system's File.downloadFileAsync to a new `stock-\u003cuuid>.jpg` in Paths.cache (idempotent), runs downscalePhoto(…, UPLOAD_PHOTO), deletes the full-size download (also when shrinking fails), and uploads with stockPhotoCredit(photo) ({ provider: 'pexels', author, authorUrl, pageUrl }). PhotoUpload has a new `stock` field. While a stock photo downloads, `localUri` is its `thumb`, so the recipe screen shows the thumb with the spinner. retryPhotoUpload re-runs the whole pick (download included) when `stock` is set. In the Choose a photo sheet, tapping a search result calls uploadStockPhoto and closes the sheet; SearchSection's onPick and SearchTile's onPress are now required. In recipe-credit.tsx, the new PhotoCreditChip reads \"Photo: Jane Doe / Pexels\" in caption inkSecondary on a surface chip at the bottom right, opens pageUrl through openRecipeLink, and VoiceOver reads \"Photo by Jane Doe on Pexels\" as a link with a hint. RecipePhotoHeader takes a `credit` and shows the chip in place of the source credit, and no credit while uploading. The recipe screen passes useRecipePhoto's credit, so the site's source credit still never shows on an own photo, and rows and plan tiles are unchanged. New en/es strings are under recipes.photoCredit. Spec 4.5 now describes the pick and replaces the no-credit rule with the own-photo credit rule. Tests: photo-upload.test.ts \"uploadStockPhoto\" (9) covers stockPhotoCredit; the download to the cache, the shrink, the deletion, the upload with its credit and outbox fields, and the thumb shown while uploading; a new file for each pick; a failed download (no upload, recipe as it was, a failed state with stock, Try again downloading again); a failed shrink still deleting the download; a failed upload, whose retry starts from the download; a library retry not downloading; Undo of a stock pick over a stock photo; and a deleted recipe. recipe-photo-sheet.test.tsx \"picking a stock photo, and its credit\" (7) covers a tap closing the sheet and uploading with the credit; the thumb and spinner with no chip, then the photo, the chip and \"Photo updated\"; the chip's text, style, position, VoiceOver and link, with no site credit even when there's a link; a library photo with no chip; a site photo with its source credit and no chip; a failed download, with Try again retrying the pick; and Undo restoring the old photo and credit. recipe-credit.test.tsx \"PhotoCreditChip\" (5) covers the text, label and link, nothing for a null or undefined credit, Spanish, and one line. The expo-file-system mocks in photo-upload.test.ts and recipe-photo-sheet.test.tsx gained downloadFileAsync, Paths and delete; no existing assertions changed. jest 4632 passed, lint and tsc clean. NEEDS A MANUAL CHECK: see manual-checks.md."],"manualChecks":["Picking a stock photo, and its credit: needs `PIXABAY_API_KEY` in `supabase/functions/.env` and the photo-search function served (`supabase functions serve --env-file supabase/functions/.env`). On a simulator, open a recipe with no photo, tap Add photo, search, tap Load more, then pick a result. The sheet should close, the thumb should show with a spinner, and then the photo should appear with \"Photo updated\" and the \"Photo: \u003cname> / Pixabay\" chip at the bottom right. Tapping the chip should open the photo's Pixabay page in Safari, and VoiceOver should read \"Photo by \u003cname> on Pixabay, link\". Check that \"Photos provided by Pixabay\" shows under the results, that with the app in Spanish a Spanish search (\"pollo asado\") finds photos, that Change photo… also shows the search, that Undo puts back the previous photo and its credit, that a second signed-in member sees the photo and credit after sync, and that Photo library and Take photo still work and show no chip."]},{"id":"c24b99537df8","section":"Who added it","goal":"Goal: the item sheet says who put an item on the list, by name, so you know who to ask about it. Today the \"Added\" card only shows when an item has more than one add or a recipe add, and it calls every other member \"Someone else\", because members' names weren't on the device. They are now (`household_member_names`, `useMemberNames` in `src/features/households/member-names.ts`), so this is mostly UI. Mockups: `docs/design/item-requests/a-added-by-one.dc.html` (one person) and `b-added-by-several.dc.html` (several), canvas https://claude.ai/artifact/YDjSWr3wp7Wtf3PZad79j2. Avatars use `avatarColors(memberHue(userId), …)` (`src/components/appearance.ts`, `src/domain/aisle-color.ts`), as the Adding pill does.","title":"Names on the \"Added\" rows","text":"Names on the \"Added\" rows (spec 4.4). `addedByLabel` and `addedLine` (`src/domain/added-by.ts`) take the household's short names (`MemberNames`, as `checkedLine` already does): another member's add reads \"Alex, Tuesday\"; \"Someone else\" stays only for a member whose name isn't on the device (removed, deleted, not loaded yet) and for old rows with no `added_by`. A recipe add by another member reads \"Shakshuka · Alex, yesterday\" (yours stays \"Shakshuka, yesterday\"); Siri stays \"Siri\". In the item sheet (`src/app/list/[id]/item/[itemId].tsx`), each \"Added\" row gets a 24 pt round avatar (new token `sizes.addedAvatar`) before the who-and-when text: the member's initial on `avatarColors(memberHue(id))`, yours too; a recipe row keeps its recipe's `IconTile` look in place of the avatar (`recipeHue`, `fork.knife`) at the same size; Siri gets a `mic` tile in grey. The avatar is decorative to VoiceOver (the row's label already names the person). Strings in `en.ts` and `es.ts`. Jest: `addedLine` with a known member, an unknown one, you, a recipe add by someone else and by you, and Siri; the sheet renders an avatar per row. Update spec 4.4's \"Added\" bullet.","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":["Names on the \"Added\" rows (2026-10-17, spec 4.4). `addedByLabel` and `addedLine` in src/domain/added-by.ts take the household's short names as an optional last argument (`names`, defaulting to empty, as `checkedLine` does). Another member's add reads \"Alex, Tuesday\". \"Someone else\" now covers only a member whose name isn't on the device and an old row with no `added_by`. A recipe add by another member reads \"Shakshuka · Alex, yesterday\" (new string `addedBy.recipeBy` in en/es). Yours, or one with no `added_by`, stays \"Shakshuka, yesterday\", and Siri stays \"Siri\". In the item sheet, each \"Added\" row has a new `AddedAvatar` before the who-and-when text, at the new token `sizes.addedAvatar` (24). For a member it's a round avatar: their initial (\"?\" when their name isn't known) on `avatarColors(memberHue(id))`, yours too, or grey for a row with no `added_by`. A recipe add gets an `IconTile` (`recipeHue`, `fork.knife`; grey once the recipe id is gone), and Siri gets a grey `mic` tile. The avatar is hidden from VoiceOver. The recipe row's gap went from xs to sm, to match the mockup's 8 pt. Spec 4.4's \"Added\" bullet and DESIGN.md's component sizes are updated. Tests: added-by.test.ts has a new addedByLabel case (a member's name, and a recipe add by them) and a new \"with the household's names\" block (7 cases): a known member, an unknown one, names not loaded, no added_by, you with your name cached, a recipe add by someone else / by you / with none recorded / by an unknown member / once the recipe is gone, Siri asked by another member, and signed out. item-screen.test.tsx has a new \"who added each one\" block (5 cases): rows named You / Alex / Someone else, with 24 pt round avatars \"J\", \"A\", \"?\" in each member's colour and the onPrimary initial; avatars hidden from VoiceOver; an old add with no one recorded showing a grey \"?\"; a recipe add by Alex (\"Shakshuka · Alex, just now\", in the row's VoiceOver label too) with its recipe tile, and a Siri row with a grey mic tile; your own recipe add as just the recipe. No existing tests changed. jest 4649 passed, lint and tsc clean. The first baseline jest run had one SIGSEGV worker crash (delete-account.test.ts), which passed on its own and in the full runs after."],"manualChecks":[]},{"id":"8797a1b8d6c9","section":"Who added it","goal":"Goal: the item sheet says who put an item on the list, by name, so you know who to ask about it. Today the \"Added\" card only shows when an item has more than one add or a recipe add, and it calls every other member \"Someone else\", because members' names weren't on the device. They are now (`household_member_names`, `useMemberNames` in `src/features/households/member-names.ts`), so this is mostly UI. Mockups: `docs/design/item-requests/a-added-by-one.dc.html` (one person) and `b-added-by-several.dc.html` (several), canvas https://claude.ai/artifact/YDjSWr3wp7Wtf3PZad79j2. Avatars use `avatarColors(memberHue(userId), …)` (`src/components/appearance.ts`, `src/domain/aisle-color.ts`), as the Adding pill does.","title":"\"Added by\" under the item's title","text":"\"Added by\" under the item's title (spec 4.4, board A). On the item sheet, under the amount (and above the \"Checked … by\" line, which stays), a row with up to three overlapping 22 pt avatars (new token `sizes.addedByAvatar`, each ringed 2 pt in `background`, 6 pt overlap) and a `footnote` `inkSecondary` line with the names in `ink` 700: one person, \"Added by Alex · Tuesday\" (when = their earliest live add, `addedWhen`); you, \"Added by you · Tuesday\"; two people, \"Added by Alex and you\" (you last, no time); three or more, \"Added by Alex, Sam and 2 others\". Siri adds count as you; a recipe add counts as whoever added the recipe to the list. Contributions with no `added_by` are skipped, and with none left the row doesn't show. Compute it in a pure `addedBySummary(contributions, userId, names, now)` in `src/domain/added-by.ts` returning `{ people: { userId, initial }[], text }` (with the bold parts marked, as notifications do). VoiceOver reads the row as one element: \"Added by Alex, Tuesday\". Strings in `en.ts` and `es.ts` (Spanish plural rules for \"and N others\"). Jest for `addedBySummary` (one, you, two, three+, unknown name, Siri, recipe, a deleted contribution ignored) and for the sheet showing it. Update spec 4.4 and DESIGN.md's component patterns (an \"Added by row\" entry) with the new tokens.","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":["\"Added by\" under the item's title (2026-10-17, spec 4.4, board A). New pure `addedBySummary(contributions, userId, names, now)` in src/domain/added-by.ts. It returns `{ people, text, label }`. `people` is up to three `{ userId, initial }` (others by first add, you last). `text` is runs of `{ text, bold }`, with the known names bold. These are runs rather than a single bold substring like notifications use, because there can be two bold names. `label` is the VoiceOver reading (\"Added by Alex, Tuesday\"). Siri and recipe adds count as their `added_by`. Adds with no added_by, or a `deletedAt`, are skipped, and it returns null when none are left. A member whose name isn't known is \"someone\" (not bold) with a \"?\" avatar. Three or more people name the first two and count the rest, so three people read \"Alex, Sam and 1 other\". New strings addedBy.byOne/byYou/byTwo/byOneAndYou/byMany_one|_other/byOneLabel/byYouLabel/byNobody in en and es. In Spanish, you is \"por ti\", and the plural is \"y 1 persona más\" / \"y N personas más\". `avatarInitial` moved to src/domain/avatar-initial.ts so the domain stays free of db imports; households.ts re-exports it. New tokens are `sizes.addedByAvatar` 22, `addedByAvatarRing` 2 and `addedByAvatarOverlap` 6. The item sheet has a new `AddedByRow` between the amount and the Checked line: overlapping avatars ringed in `background`, then a footnote inkSecondary line with nested ink 700 names, as one accessible element. Spec 4.4 has a new \"Added by\" bullet. DESIGN.md has the sizes and an \"Added by row\" component pattern. Tests: added-by.test.ts \"addedBySummary\" (14 cases) covers one member in bold with the label, the earliest add whatever the order, you, two with you last, two others in order, three/four with three avatars, an unknown name, Siri, recipe, a deleted add even when earliest, no added_by → null, signed out, a name that matches sentence text, and Spanish. item-screen.test.tsx \"the Added by row\" (8 cases) covers bold name and ringed 22 pt avatar style, the VoiceOver label, you, two overlapping by -6, four people, placement between amount and Checked, a recipe add by Alex, and no row with no added_by plus the row disappearing after Alex's amount is removed. No existing tests changed. jest 4671 passed, lint and tsc clean."],"manualChecks":["App: line up \"N to get\" with the view button: on a simulator, open a list with items and screenshot the header in As added, By aisle and By recipe. The \"12 to get\" text's center and the pill's center should be on the same line, the pill should sit the same distance under the title as before, and the pill should still open its menu when tapped just above or below it (44 pt tap area). Tick every item (no count) and the pill alone should sit where it did. Repeat at a large Dynamic Type size (Settings → Accessibility → Larger Text), where the row may wrap: items on each line stay centered, and the pill grows to fit its label instead of the text spilling out."]},{"id":"71fdd6b55874","section":"Push notifications","goal":"Goal: household members hear about each other's list activity when the app is closed: \"Alex added milk, eggs and 4 more to Groceries\" and \"Alex is shopping at Groceries\". This is spec 11.1 coming out of Later, and the in-app banners (4.11) are the base it builds on. iOS only (Android isn't a target, but nothing here should rule it out: keep the Android channel call and the `platform` column). Delivery is Expo Push (`expo-notifications`, which talks to APNs for us). Spec 11.1 says to queue from a trigger on `list_items` inserts, but a Combine adds a **contribution** to an existing open item and inserts no `list_items` row. So \"added\" events come from `list_item_contributions` inserts, and \"shopping\" events from `list_items.checked_at` going from null to set. A trigger queues each event on a pgmq queue `household_events`, as stash does for captures. A worker Edge Function `send-notifications`, run by pg_cron every minute, groups the events and sends one push per group to the household's other members. The person who made the change never gets a push about it. **Grouping.** A group is (household, actor, list, kind). It sends once it has been quiet for 60 s (its newest event is at least 60 s old) or its oldest event is 5 minutes old, whichever comes first, so a burst of adds becomes one push. At send time the worker re-reads the rows, so an add that was undone (the contribution is soft-deleted) or an item unchecked again doesn't count, and a group left with nothing is dropped without sending. **Added**: counts the live contributions. The body names up to two items by `display_name`, then \"and N more\". A group that is all one recipe's add reads \"Alex added Tacos (8 items) to Groceries\". **Shopping**: sent at most once per (actor, list) in a 2-hour window, on the first checks after none for 2 hours, never once per check. **Stale events**: a device that was offline in the store syncs its checks hours later. Drop events whose row time (the contribution's `created_at`, the item's `checked_at`) is more than 15 minutes older than the worker's clock, so nobody hears \"Alex is shopping\" after Alex got home. **Actor name**: the first word of `profiles.display_name`. **Recipients.** A recipient is any current member of the household, other than the actor, who has at least one push token, has that kind turned on, and isn't in their quiet hours, judged in their own time zone. Membership is read when the push is sent, so someone who left the household gets nothing. Tapping a push opens that list (`/list/\u003cid>`). **By hand, not by Ralph** (the user runs anything hosted, see memory). Hand over these steps in the task's progress.md entry rather than running them: - create the APNs key: `yarn dlx eas-cli credentials` → iOS → production → Push Notifications. - make a new development build after the plugin is added: `yarn dlx eas-cli build --profile development --platform ios`, or `yarn expo run:ios`. - set the hosted Vault secrets the cron job reads. - `supabase db push`, and `supabase functions deploy send-notifications`. - optionally, `supabase secrets set EXPO_ACCESS_TOKEN=…` for Expo's enhanced push security. Spec: add a new section 4.13 \"Push notifications\" from this goal, and update 5 (new tables), 8 (the worker and the queue) and 11.1 (it now covers only what's still Later: location reminders and per-household muting) as each task changes them. Push needs a development build (it doesn't work in Expo Go) and a real device, so every on-device check is a manual check.","title":"Server: push tokens and notification settings","text":"Server: push tokens and notification settings. New migration in `supabase/migrations/`. **`public.push_tokens`**: `token text primary key` (the Expo push token, `ExponentPushToken[…]`), `user_id uuid not null references auth.users on delete cascade`, `platform text not null check (platform in ('ios', 'android'))`, `created_at` and `updated_at timestamptz not null default now()`, with an index on `user_id`. Turn RLS on, with no direct table access for `authenticated`. Writes go through two `security definer` functions granted to `authenticated` only. `public.register_push_token(p_token text, p_platform text)` validates the token's shape (`raises invalid token`) and upserts it for `auth.uid()`; a token already held by another user moves to the caller, because the device changed hands on sign-in. `public.unregister_push_token(p_token text)` deletes the caller's row and is a no-op if it isn't theirs. **`public.notification_settings`**: `user_id uuid primary key references auth.users on delete cascade`, `items_added boolean not null default true`, `shopping boolean not null default true`, `quiet_hours_start time` and `quiet_hours_end time` (both null = off; a start later than the end wraps past midnight), `time_zone text not null default 'UTC'` (an IANA name, checked against `pg_timezone_names` in a trigger or in the setter), and `updated_at`. It has RLS: select, insert and update for the user's own row only. A missing row means the defaults. The table is per user, is read and written online, and doesn't go through the outbox or sync (the settings screen needs a connection to change it, like Leave household does). Add a `private.push_recipients(p_household_id uuid, p_actor uuid, p_kind text, p_at timestamptz)` function for the worker: members of the household minus the actor, with their tokens, filtered by the kind's setting and by quiet hours in each user's `time_zone`; execute for `service_role` only. pgTAP tests in `supabase/tests/`: register, re-register (moves the token, bumps `updated_at`), unregister someone else's token (no-op), a bad token shape, RLS on both tables (a user can't read another's settings or any token), the defaults when there is no row, and `push_recipients` (the actor is excluded, a former member is excluded, a kind switched off, quiet hours inside, outside and wrapping midnight across time zones, a user with no token). Check that `admin.delete_user` (and its tests) still pass with the new FKs.","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":["Push tokens and notification settings (2026-10-17, spec 4.13, 5). New migration supabase/migrations/20261103120000_push_notifications.sql. public.push_tokens (token pk, user_id cascade + index, platform ios|android, created_at/updated_at with the set_updated_at trigger) has RLS on and no client grants. register_push_token(p_token, p_platform) and unregister_push_token(p_token) are security definer, granted to authenticated only, and raise `not signed in` (42501) without a user. register checks the shape `^(Exponent|Expo)PushToken\\[[A-Za-z0-9_-]+\\]$` and ≤ 200 chars (`invalid token`, 22023) and the platform (`invalid platform`), then upserts on token: another user's token moves to the caller and updated_at is bumped. unregister deletes only the caller's row and is a no-op otherwise. public.notification_settings (user_id pk cascade, items_added/shopping default true, quiet_hours_start/end, time_zone default 'UTC') checks the quiet hours are both null or both set and different, has a trigger (private.check_notification_time_zone) raising `invalid time zone` (22023) for a name not in pg_timezone_names, and select/insert/update own-row policies (no delete). private.push_recipients(household, actor, kind, at) returns (user_id, token, platform), one row per device, for current members other than the actor, with the kind on (`items_added` | `shopping`, else `invalid kind`) and outside quiet hours [start, end) in their own time zone (start > end wraps midnight); a missing settings row is the defaults. Execute is service_role only; the migration grants service_role usage on schema private. Note for the worker task: `private` isn't exposed by PostgREST (config.toml schemas = public, graphql_public), so supabase-js `.rpc` can't reach push_recipients as is; the worker needs a direct Postgres connection or a public service_role-only wrapper. Spec 5 updated: both tables in the DDL, the cascade note, and RLS bullets for notification_settings, push_tokens and push_recipients (4.13 itself comes with the docs task). Tests: new supabase/tests/41_push_notifications.test.sql (56): privileges on the functions and tables; register, the ExpoPushToken shape, bad shapes (no prefix, empty, a space, trailing text, null, too long), a bad platform, not signed in; re-register by the same user (bumps updated_at, keeps created_at) and by another user (moves the token, new platform, still one row); unregistering someone else's and an unknown token (no-op) and one's own; settings RLS (can't read, insert for, update or delete another's row), the column defaults, an unknown time zone on insert and update, half-set and zero-length quiet hours; push_recipients excluding the actor, a former member, a kind switched off and a user with no token, one row per device, quiet hours inside, outside, wrapping midnight (late evening and early morning) and at the exact start and end, across New York and Tokyo, an unknown kind, and authenticated refused; admin.delete_user cascading the user's tokens and settings. supabase db reset and supabase test db (all 41 files, incl. 15_admin and 21_delete_account), jest 4671 passed, lint and tsc clean. No existing tests changed. BY HAND (with the rest of the section): `supabase db push`."],"manualChecks":[]},{"id":"429d070edc26","section":"Push notifications","goal":"Goal: household members hear about each other's list activity when the app is closed: \"Alex added milk, eggs and 4 more to Groceries\" and \"Alex is shopping at Groceries\". This is spec 11.1 coming out of Later, and the in-app banners (4.11) are the base it builds on. iOS only (Android isn't a target, but nothing here should rule it out: keep the Android channel call and the `platform` column). Delivery is Expo Push (`expo-notifications`, which talks to APNs for us). Spec 11.1 says to queue from a trigger on `list_items` inserts, but a Combine adds a **contribution** to an existing open item and inserts no `list_items` row. So \"added\" events come from `list_item_contributions` inserts, and \"shopping\" events from `list_items.checked_at` going from null to set. A trigger queues each event on a pgmq queue `household_events`, as stash does for captures. A worker Edge Function `send-notifications`, run by pg_cron every minute, groups the events and sends one push per group to the household's other members. The person who made the change never gets a push about it. **Grouping.** A group is (household, actor, list, kind). It sends once it has been quiet for 60 s (its newest event is at least 60 s old) or its oldest event is 5 minutes old, whichever comes first, so a burst of adds becomes one push. At send time the worker re-reads the rows, so an add that was undone (the contribution is soft-deleted) or an item unchecked again doesn't count, and a group left with nothing is dropped without sending. **Added**: counts the live contributions. The body names up to two items by `display_name`, then \"and N more\". A group that is all one recipe's add reads \"Alex added Tacos (8 items) to Groceries\". **Shopping**: sent at most once per (actor, list) in a 2-hour window, on the first checks after none for 2 hours, never once per check. **Stale events**: a device that was offline in the store syncs its checks hours later. Drop events whose row time (the contribution's `created_at`, the item's `checked_at`) is more than 15 minutes older than the worker's clock, so nobody hears \"Alex is shopping\" after Alex got home. **Actor name**: the first word of `profiles.display_name`. **Recipients.** A recipient is any current member of the household, other than the actor, who has at least one push token, has that kind turned on, and isn't in their quiet hours, judged in their own time zone. Membership is read when the push is sent, so someone who left the household gets nothing. Tapping a push opens that list (`/list/\u003cid>`). **By hand, not by Ralph** (the user runs anything hosted, see memory). Hand over these steps in the task's progress.md entry rather than running them: - create the APNs key: `yarn dlx eas-cli credentials` → iOS → production → Push Notifications. - make a new development build after the plugin is added: `yarn dlx eas-cli build --profile development --platform ios`, or `yarn expo run:ios`. - set the hosted Vault secrets the cron job reads. - `supabase db push`, and `supabase functions deploy send-notifications`. - optionally, `supabase secrets set EXPO_ACCESS_TOKEN=…` for Expo's enhanced push security. Spec: add a new section 4.13 \"Push notifications\" from this goal, and update 5 (new tables), 8 (the worker and the queue) and 11.1 (it now covers only what's still Later: location reminders and per-household muting) as each task changes them. Push needs a development build (it doesn't work in Expo Go) and a real device, so every on-device check is a manual check.","title":"App: install expo-notifications and register the device","text":"App: install expo-notifications and register the device. `yarn expo install expo-notifications` and add `\"expo-notifications\"` to `plugins` in `app.json` (no custom sounds and no background remote notifications; check the SDK 57 config-plugin options at https://docs.expo.dev/versions/v57.0.0/sdk/notifications/ first, since the API has changed across SDKs). Write a new module `src/features/push/registration.ts`. **`registerForPush({ prompt })`**: returns early on web, on a simulator (`expo-device` `Device.isDevice`) and when signed out. On Android it creates the `default` channel before asking for a token. It reads the permission and asks only when `prompt` is true and the status is `undetermined`, never at launch. When granted, it gets the Expo token with `getExpoPushTokenAsync({ projectId })`, where `projectId` comes from `Constants.expoConfig.extra.eas.projectId`. It calls `register_push_token` only when the token or user differs from the last one registered, or when the last registration is more than 7 days old; the last registration (`{ token, userId, at }`) is kept in device settings under `push.registration`. **When it runs**: after sign-in, on each foreground while signed in, and when `addPushTokenListener` reports a new token, all with `prompt: false`, so they only refresh a token the user already allowed. **Sign-out**: before `signOut()` in `src/features/auth/account.ts`, call `unregister_push_token` for the stored token, best effort with a short timeout, so a failure never blocks signing out, then clear `push.registration`. Expose `getPushPermission()` and `requestPushPermission()` (the latter calls `registerForPush({ prompt: true })` and returns the resulting status) for the settings task. Jest tests with `expo-notifications`, `expo-device` and the Supabase client mocked: no prompt when `prompt` is false; a denied permission registers nothing; an unchanged token isn't re-sent; a token from a new user is; and sign-out unregisters and clears the stored registration even when the RPC fails. Run `yarn dlx expo-doctor`. Manual check: in a dev build on a real iPhone, turn notifications on from Settings (next task) and confirm a row appears in `push_tokens`; sign out and confirm it's gone.","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":[],"manualChecks":["App: install expo-notifications and register the device: needs the APNs key (`yarn dlx eas-cli credentials` → iOS → production → Push Notifications) and a new development build (`yarn dlx eas-cli build --profile development --platform ios`, or `yarn expo run:ios`). On a real iPhone, check that launching and signing in never show the notification prompt. Once the settings task lands, turn notifications on from Settings, allow the prompt, and confirm a row for your user appears in `push_tokens` (platform `ios`). Background and foreground the app, and check the row isn't rewritten (`updated_at` unchanged). Sign out and confirm the row is gone. Then sign out with the network off and confirm sign-out still finishes within a few seconds."]},{"id":"eb9ca32e4058","section":"Push notifications","goal":"Goal: household members hear about each other's list activity when the app is closed: \"Alex added milk, eggs and 4 more to Groceries\" and \"Alex is shopping at Groceries\". This is spec 11.1 coming out of Later, and the in-app banners (4.11) are the base it builds on. iOS only (Android isn't a target, but nothing here should rule it out: keep the Android channel call and the `platform` column). Delivery is Expo Push (`expo-notifications`, which talks to APNs for us). Spec 11.1 says to queue from a trigger on `list_items` inserts, but a Combine adds a **contribution** to an existing open item and inserts no `list_items` row. So \"added\" events come from `list_item_contributions` inserts, and \"shopping\" events from `list_items.checked_at` going from null to set. A trigger queues each event on a pgmq queue `household_events`, as stash does for captures. A worker Edge Function `send-notifications`, run by pg_cron every minute, groups the events and sends one push per group to the household's other members. The person who made the change never gets a push about it. **Grouping.** A group is (household, actor, list, kind). It sends once it has been q pec: add a new section 4.13 \"Push notifications\" from this goal, and update 5 (new tables), 8 (the worker and the queue) and 11.1 (it now covers only what's still Later: location reminders and per-household muting) as each task changes them. Push needs a development build (it doesn't work in Expo Go) and a real device, so every on-device check is a manual check.","title":"Server: queue household events","text":"Server: queue household events. New migration: `create extension if not exists pgmq`, then `select pgmq.create('household_events')`, with RLS on `pgmq.q_household_events` and `pgmq.a_household_events` and no policies, as in stash's `capture_queue` migration. Add two `security definer` trigger functions in `private`, with execute revoked from `public`, `anon` and `authenticated`. **On `list_item_contributions` after insert**: when `added_by` is not null and `deleted_at` is null, send `{ kind: 'items_added', household_id, list_id (looked up from the item), actor: added_by, contribution_id, list_item_id, recipe_id, source, at: created_at }`. **On `list_items` after update of `checked_at`**: when the old value is null, the new one isn't, and `checked_by` is not null, send `{ kind: 'shopping', household_id, list_id, actor: checked_by, list_item_id, at: checked_at }`. The triggers fire for rows written by `apply_mutations` and by any other path (e.g. a future `siri-add`). They must never fail the write: wrap the `pgmq.send` in an exception block that raises a warning. Merges inside `apply_mutations` (an incoming item merged into an existing open item, 7.3) re-point contributions with updates, not inserts, so they don't queue a second event; confirm this, and add a test for it. pgTAP tests: an add, a recipe add (several contributions, one per ingredient), a Combine into an open item, a check, a re-check of an already-checked item (no event), an uncheck (no event), a row with a null actor (no event), a merge (no duplicate), and a pgmq failure that doesn't roll back the write (simulate it, e.g. by dropping the queue inside the test transaction).","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":["Queue household events (2026-10-17, spec 4.13, 8.5). New migration supabase/migrations/20261104120000_household_events.sql: pgmq extension, `pgmq.create('household_events')`, RLS on the queue and archive tables with no policies (as stash's capture_queue). Two security definer trigger functions in private (execute revoked from public, anon, authenticated): `queue_items_added` (after insert on list_item_contributions when added_by is set and deleted_at is null; payload kind, household_id, list_id looked up from the item, actor, contribution_id, list_item_id, recipe_id, source, at = created_at) and `queue_shopping` (after update of checked_at on list_items, null to set with checked_by; payload kind, household_id, list_id, actor, list_item_id, at = checked_at). Each pgmq.send sits in an exception block that raises a warning, so the write never fails. Confirmed that merges in apply_mutation (latest in 20261021120000_combine_languages.sql) re-point contributions with an update, so they queue nothing. Spec: section 4.13 didn't exist yet (earlier tasks only referred to it), so I added it from the goal, plus 8.5 (the queue), and pointed 11.1's pipeline bullet at them. New pgTAP supabase/tests/42_household_events.test.sql (30 asserts): queue exists with RLS; clients can't execute the trigger functions; an add through apply_mutations (exact payload); a direct recipe add (3 contributions give 3 events with recipe_id, at = created_at); a Combine into an open item; a check (exact payload); no event for a re-check, an uncheck, another field's edit, a null checked_by, a null added_by, an already-deleted contribution, an undo and redo of an add, or an item created already checked; an uncheck that merges into an open item (contribution re-pointed, no event); a new item merged within a batch (exactly one event, for the target item); a check through apply_mutations; and after pgmq.drop_queue, an add, a check and a synced add all still succeed and are kept. supabase db reset, supabase test db (42 files), yarn jest (4703), lint and tsc pass. BY HAND (later, with the worker): `supabase db push`."],"manualChecks":[]},{"id":"d1825284462c","section":"Push notifications","goal":"Goal: household members hear about each other's list activity when the app is closed: \"Alex added milk, eggs and 4 more to Groceries\" and \"Alex is shopping at Groceries\". This is spec 11.1 coming out of Later, and the in-app banners (4.11) are the base it builds on. iOS only (Android isn't a target, but nothing here should rule it out: keep the Android channel call and the `platform` column). Delivery is Expo Push (`expo-notifications`, which talks to APNs for us). Spec 11.1 says to queue from a trigger on `list_items` inserts, but a Combine adds a **contribution** to an existing open item and inserts no `list_items` row. So \"added\" events come from `list_item_contributions` inserts, and \"shopping\" events from `list_items.checked_at` going from null to set. A trigger queues each event on a pgmq queue `household_events`, as stash does for captures. A worker Edge Function `send-notifications`, run by pg_cron every minute, groups the events and sends one push per group to the household's other members. The person who made the change never gets a push about it. **Grouping.** A group is (household, actor, list, kind). It sends once it has been quiet for 60 s (its newest event is at least 60 s old) or its oldest event is 5 minutes old, whichever comes first, so a burst of adds becomes one push. At send time the worker re-reads the rows, so an add that was undone (the contribution is soft-deleted) or an item unchecked again doesn't count, and a group left with nothing is dropped without sending. **Added**: counts the live contributions. The body names up to two items by `display_name`, then \"and N more\". A group that is all one recipe's add reads \"Alex added Tacos (8 items) to Groceries\". **Shopping**: sent at most once per (actor, list) in a 2-hour window, on the first checks after none for 2 hours, never once per check. **Stale events**: a device that was offline in the store syncs its checks hours later. Drop events whose row time (the contribution's `created_at`, the item's `checked_at`) is more than 15 minutes older than the worker's clock, so nobody hears \"Alex is shopping\" after Alex got home. **Actor name**: the first word of `profiles.display_name`. **Recipients.** A recipient is any current member of the household, other than the actor, who has at least one push token, has that kind turned on, and isn't in their quiet hours, judged in their own time zone. Membership is read when the push is sent, so someone who left the household gets nothing. Tapping a push opens that list (`/list/\u003cid>`). **By hand, not by Ralph** (the user runs anything hosted, see memory). Hand over these steps in the task's progress.md entry rather than running them: - create the APNs key: `yarn dlx eas-cli credentials` → iOS → production → Push Notifications. - make a new development build after the plugin is added: `yarn dlx eas-cli build --profile development --platform ios`, or `yarn expo run:ios`. - set the hosted Vault secrets the cron job reads. - `supabase db push`, and `supabase functions deploy send-notifications`. - optionally, `supabase secrets set EXPO_ACCESS_TOKEN=…` for Expo's enhanced push security. Spec: add a new section 4.13 \"Push notifications\" from this goal, and update 5 (new tables), 8 (the worker and the queue) and 11.1 (it now covers only what's still Later: location reminders and per-household muting) as each task changes them. Push needs a development build (it doesn't work in Expo Go) and a real device, so every on-device check is a manual check.","title":"Edge Function: `send-notifications` worker","text":"Edge Function: `send-notifications` worker. New function `supabase/functions/send-notifications/` in the same shape as `import-recipe`: `index.ts` (wiring), `handler.ts` (pure logic), `store.ts` (database), `expo.ts` (Expo Push client) and Deno tests. It is called only by pg_cron with the service-role key; use `withSupabase` with service auth, or check the bearer against a secret, and answer 401 to anyone else. **Each run**: read up to 500 messages from `household_events` with `pgmq.read`, using a visibility timeout of 2 minutes (exposed through a `private` RPC for `service_role`, since pgmq isn't in the exposed schemas). Group them per the goal's rules, using the events' `at` and the worker's clock. Leave the messages of groups that aren't ready yet to reappear, and archive (`pgmq.archive`) every message that was sent, dropped as stale or dropped as empty. For a ready group, re-read its rows to count what's still live, build the title and body, resolve recipients with `private.push_recipients`, and send. Keep the shopping 2-hour window in a small `private.push_sent (household_id, actor, list_id, kind, sent_at)` table, which also serves as a log; add a daily pg_cron cleanup of rows older than 7 days. **Messages**: title = the list's name; body = \"Alex added milk, eggs and 4 more\", \"Alex added Tacos (8 items)\" or \"Alex is shopping\"; `data: { url: '/list/\u003cid>', kind, householdId }`; `sound: 'default'`; on iOS a `threadId` per list, so a list's pushes stack in Notification Center. Names come from the rows and are text only, so check that an item name with markdown or emoji goes through as-is. **Expo client**: POST to `https://exp.host/--/api/v2/push/send` in chunks of 100, with `Authorization: Bearer $EXPO_ACCESS_TOKEN` when that secret is set (add it to `supabase/functions/.env.example`, commented, unset meaning no header). Retry 429 and 5xx with backoff, up to 3 tries within the run. On a ticket error `DeviceNotRegistered`, delete that token. Store the `ok` ticket ids with their tokens in `private.push_receipts (ticket_id, token, created_at)`. **Receipts**: each run, also check receipts at least 15 minutes old through `/--/api/v2/push/getReceipts`; delete tokens whose receipt says `DeviceNotRegistered`, delete checked receipts, and drop any older than 24 hours. **Schedule**: a migration that adds `pg_net`, and a `cron.schedule('send-notifications', '* * * * *', …)` that calls `net.http_post` to the function. The URL and key come from Vault secrets `project_url` and `notifications_worker_key`, as sketched in stash's `capture_queue` migration. Make it work locally: document in the migration and in AGENTS.md's Supabase section how to seed the local Vault (the local functions URL on port 55321). Deno tests with a fake store and a fake `fetch`: grouping (quiet period, the 5-minute cap, two actors on one list giving two groups, two lists giving two groups), an undone add dropped, a stale event dropped, the shopping window, recipe wording, \"and N more\" wording, actor excluded, a 429 retried, `DeviceNotRegistered` deleting the token, receipts handled, and a 401 for a caller without the key. Manual check: with two users in one household (one of them on a dev build on a real iPhone, app closed), add 3 items as the other and get one push within about 2 minutes; check 2 items and get one \"is shopping\"; check more and get nothing else.","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":["send-notifications worker (2026-10-17, spec 4.13, 5, 8.5, 11.1). New Edge Function supabase/functions/send-notifications/ (index.ts wiring with `withSupabase({ auth: 'secret' })` as photo-cleanup does, handler.ts, store.ts, expo.ts, testing.ts fakes; `verify_jwt = false` in config.toml). New migration 20261105120000_send_notifications.sql: `private.push_sent` and `private.push_receipts` (RLS on, no client access); public functions for service_role only, because neither pgmq nor private is exposed: read/archive/release_household_events, notification_group (re-reads a group: list name, the actor's first word, live contributions or still-checked items, last push for actor+list+kind), notification_recipients (wraps private.push_recipients), record_push_sent, delete_push_tokens, save/due/delete_push_receipts; `private.request_send_notifications()` posting through pg_net with Vault `project_url` + `notifications_worker_key`, only when events or receipts are pending; cron `send-notifications` every minute and `push-sent-retention` daily (7 days). Two decisions to flag. (1) Groups that aren't ready are released (`pgmq.set_vt` 0) instead of left hidden for the 2-minute timeout: otherwise a burst read across two runs splits into two pushes. Sent/stale/empty events are archived; a group whose send fails stays hidden and is retried until it goes stale. (2) The shopping window is \"no shopping push for this actor+list in the last 2 hours\" (from push_sent). Wording: items are named and counted once even when a Combine added twice; the recipe form counts contributions; a missing name reads \"Someone\". AGENTS.md documents seeding the local Vault (host.docker.internal:55321); `EXPO_ACCESS_TOKEN` added to .env.example, commented out. Spec: 8.5 describes the worker, 5 the new tables and functions, and 11.1 now covers only location reminders and per-household muting. WebFetch and curl weren't allowed, so the Expo request/ticket/receipt shapes and the `threadId` field come from memory, not the docs (flagged in manual-checks.md). Tests: Deno expo.test.ts (9: chunks of 100, bearer only when set, 429 retried with backoff, 5xx/network errors up to 3 tries, 400 not retried, errors without data, ticket count mismatch, receipts in chunks of 1,000), handler.test.ts (39: quiet period, the 5-minute cap and just under it, two actors → two groups, two lists → two groups with their own url and threadId, actor excluded, undone adds, all undone → dropped, unchecked items, stale dropped, unusable message, no recipients, deleted list, one \"is shopping\" push for several checks, the shopping window inside/after/across runs/per list and actor, \"and N more\", a Combine's double add, recipe wording incl. 1 item and mixed groups, markdown and emoji names unchanged, \"Someone\", 429 retried, a failing send left to reappear while other groups send, DeviceNotRegistered tickets deleting tokens (with and without details.expoPushToken), receipts checked and deleted, missing receipts kept, a failed receipts request, HTTP 200/405/500), index.test.ts (3: 401 with no key, 401 with a wrong or publishable key, the secret key gets past auth) = 51 passing; pgTAP 43_send_notifications.test.sql (33: privileges, RLS, read/hide/release/archive, notification_group for adds and checks (undone, deleted item, other list, deleted list, no profile, invalid kind, checked by someone else, unchecked), last_sent_at per kind, push_sent's kind check, recipients wrapper, token deletion, receipts save/due/24h drop/limit/delete, cron schedules, no-op without Vault secrets). supabase db reset, supabase test db (43 files, 1212), yarn jest (4703), lint and tsc pass. BY HAND: `supabase db push`; set hosted Vault secrets `project_url` (if not already set) and `notifications_worker_key` (a secret API key); `supabase functions deploy send-notifications`; optionally `supabase secrets set EXPO_ACCESS_TOKEN=…`. NEEDS A MANUAL CHECK: see manual-checks.md."],"manualChecks":["Edge Function: `send-notifications` worker: after `supabase db push`, set the hosted Vault secrets `project_url` (https://\u003cref>.supabase.co, if not already set for photo-cleanup) and `notifications_worker_key` (a secret API key), then `supabase functions deploy send-notifications` (optionally `supabase secrets set EXPO_ACCESS_TOKEN=…`). With two users in one household, one of them on a dev build on a real iPhone with notifications allowed and the app closed: as the other user, add 3 items to a list and check exactly one push arrives within about 2 minutes, titled with the list's name and reading \"\u003cname> added \u003citem> t, and a group left with nothing is dropped without sending. **Added**: counts the live contributions. The body names up to two items by `display_name`, then \"and N more\". A group that is all one recipe's add reads \"Alex added Tacos (8 items) to Groceries\". **Shopping**: sent at most once per (actor, list) in a 2-hour window, on the first checks after none for 2 hours, never once per check. **Stale events**: a device that was offline in the store syncs its checks hours later. Drop events whose row time (the contribution's `created_at`, the item's `checked_at`) is more than 15 minutes older than the worker's clock, so nobody hears \"Alex is shopping\" after Alex got home. **Actor name**: the first word of `profiles.display_name`. **Recipients.** A recipient is any current member of the household, other than the actor, who has at least one push token, has that kind turned on, and isn't in their quiet hours, judged in their own time zone. Membership is read when the push is sent, so someone who left the household gets nothing. Tapping a push opens that list (`/list/\u003cid>`). **By hand, not by Ralph** (the user runs anything hosted, see memory). Hand over these steps in the task's progress.md entry rather than running them: - create the APNs key: `yarn dlx eas-cli credentials` → iOS → production → Push Notifications. - make a new development build after the plugin is added: `yarn dlx eas-cli build --profile development --platform ios`, or `yarn expo run:ios`. - set the hosted Vault secrets the cron job reads. - `supabase db push`, and `supabase functions deploy send-notifications`. - optionally, `supabase secrets set EXPO_ACCESS_TOKEN=…` for Expo's enhanced push security. Spec: add a new section 4.13 \"Push notifications\" from this goal, and update 5 (new tables), 8 (the worker and the queue) and 11.1 (it now covers only what's still Later: location reminders and per-household muting) as each task changes them. Push needs a development build (it doesn't work in Expo Go) and a real device, so every on-device check is a manual check.","title":"App: receiving notifications","text":"App: receiving notifications. **Taps**: in the root layout (`src/app/_layout.tsx`), once signed in and the app's data is ready, handle `Notifications.useLastNotificationResponse()`. It covers cold starts and taps while running, but only acts on each response id once; keep the last handled id in memory. It routes `data.url` with `router.push` when it is a known in-app route (`/list/\u003cuuid>`); ignore anything else. If the list isn't on this device yet (not synced), run a pull first, and if the list still isn't there, open the Lists tab and show a toast saying \"That list isn't available\". **Foreground**: call `Notifications.setNotificationHandler` so that a push arriving while the app is open shows no OS banner. Instead, post an in-app notification (4.11) with new `NotificationKind`s `itemsAdded` and `shopping`, using the push's title and body and an `onPress` that opens the list. If the user is already on that list's screen, post nothing (the realtime update shows the change). Add the kinds to `NotificationKind` and pick their icon and hue from DESIGN.md's tokens. Clear delivered notifications for a list (`dismissNotificationAsync` for those whose `data.url` matches) when that list's screen is opened. Jest tests: a cold-start response routes once, an unknown URL is ignored, a missing list falls back to the Lists tab, a foreground push becomes an in-app banner, and a foreground push for the open list posts nothing. Manual check: on a real iPhone dev build, tap a push with the app killed, backgrounded and open on another screen, and confirm each opens the right list; with the app open on that list, confirm nothing shows.","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":[],"manualChecks":["App: receiving notifications: on a real iPhone dev build signed in as one household member, have another member add items to a list. Tap the push w in Expo Go) and a real device, so every on-device check is a manual check.","title":"App: Settings → Notifications","text":"App: Settings → Notifications. A new row \"Notifications\" in Settings (`src/app/(tabs)/settings/index.tsx`, between Siri and Category order) opens a new screen `src/app/(tabs)/settings/notifications.tsx`. **Permission**: when the OS permission is undetermined, the screen shows a card that explains what you'd get (\"Know when someone in your household adds to a list or starts shopping\") with a **Turn on notifications** button that calls `requestPushPermission()`. When it's denied, the card says notifications are off for Perfect Bite and offers **Open Settings** (`Linking.openSettings()`). When it's granted, the card is gone. **Switches**, shown only when granted: \"Items added to lists\" (`items_added`) and \"Someone starts shopping\" (`shopping`). **Quiet hours**: a switch, plus From/To time pickers (the native time picker the app already uses, if there is one; check before adding one, and use `yarn expo install` if one is needed). The device's time zone (`Intl.DateTimeFormat().resolvedOptions().timeZone`) is saved with every change, and re-saved on foreground when it has changed, so travel follows the device. Settings load from and save to `notification_settings` (upsert of the user's row) with a small store in `src/features/push/settings.ts`. While offline, the controls are disabled with the usual offline note, like the other online-only settings. **Ask once at a good moment**: the first time the user is in a household with another member (after they accept an invite, or when a household-mate joins, seen on pull), show a one-time in-app prompt. It is a sheet or card with the same explanation, **Turn on** and **Not now** buttons, and it doesn't show again either way (a device setting `push.asked`). Never ask at launch or on sign-in. Text and layout follow DESIGN.md. Jest tests for the screen's three permission states, toggles saving, quiet-hours validation (start equal to end isn't allowed), the time zone saved, offline disabling, and the one-time prompt showing once. Manual check: on a real iPhone, go through undetermined → granted, and denied → Open Settings; turn off \"Someone starts shopping\" and confirm a check by a household-mate sends no push; set quiet hours that cover now and confirm nothing arrives.","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":[],"manualChecks":["App: Settings → Notifications: on a real iPhone dev build with the permission never asked (a fresh install), open Settings → Notifications: the \"Stay in the loop\" card shows; tap Turn on notifications and allow: the card goes, the switches show, and a row appears in `push_tokens`. Reinstall, tap Turn on and choose Don't Allow: the card says notifications are off; Open Settings opens iOS Settings for the app; allow there, come back, and the card is gone. Check the From/To compact time pickers look right in light and dark and at large text sizes, and that VoiceOver reads them as \"Quiet hours from\" / \"Quiet hours to\". Turn off \"Someone starts shopping\" and have a household-mate check an item: no push. Set quiet hours that cover now and have them add items: nothing arrives. In airplane mode the controls dim with \"Needs a connection\". One-time prompt: with the permission never asked, accept an invite (or have someone join your one-person household): the \"Turn on notifications?\" sheet shows once; after Turn on or Not now it never shows again."]},{"id":"71f8803c8be3","section":"Push notifications","goal":"Goal: household members hear about each other's list activity when the app is closed: \"Alex added milk, eggs and 4 more to Groceries\" and \"Alex is shopping at Groceries\". This is spec 11.1 coming out of Later, and the in-app banners (4.11) are the base it builds on. iOS only (Android isn't a target, but nothing here should rule it out: keep the Android channel call and the `platform` column). Delivery is E he Deno tests one last time across everything this section touched.","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":["Push notifications, Docs and checklist (2026-10-17): added `docs/push-setup.md` (APNs key through `eas credentials`, a new dev build, `supabase db push` with the expected migrations, `supabase functions deploy send-notifications`, optional `EXPO_ACCESS_TOKEN`, the hosted Vault secrets with create/update/check SQL and a cron run check, and a test push through Expo's tool or curl to a token from `push_tokens`), linked from AGENTS.md's Supabase section. Spec 4.13, 5, 8.5 and 11.1 were already written by earlier tasks; I fixed what was still stale: non-goals (only location reminders and per-household muting are Later), req 13's traceability row (4.11, 4.13, 11.1), 4.11 no longer calling push Later, 4.14's \"(4.13 is kept…)\" note removed, 4.15's push-language line (English for now) plus a new 11.1 bullet for pushes in the recipient's language, 8.2's tree (settings/notifications, features/push, functions/send-notifications), and §10's \"Later work landed\" line. Docs only, so no new tests. Final runs across the section: yarn jest (4782 passed, 2 skipped), lint and tsc clean, supabase test db (43 files, 1212 tests), send-notifications Deno tests (51 passed). Nothing hosted was run. NEEDS A MANUAL CHECK: run docs/push-setup.md by hand, in order: `yarn dlx eas-cli credentials` (iOS → production → Push Notifications); `yarn dlx eas-cli build --profile development --platform ios`; `supabase db push`; `supabase functions deploy send-notifications` (optionally `supabase secrets set EXPO_ACCESS_TOKEN=…`); in the hosted SQL editor `select vault.create_secret('https://\u003cref>.supabase.co', 'project_url');` (unless photo-cleanup already set it) and `select vault.create_secret('\u003csecret API key>', 'notifications_worker_key');`; then a test push (§6). See manual-checks.md."],"manualChecks":[]},{"id":"10a3e544e4aa","section":"Item photos","goal":"G const KEY = 'ralph-review:v1';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
let filter = 'todo';
try { filter = localStorage.getItem(KEY + ':filter') || 'todo'; } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function md(s) {
  const codes = [];
  let h = esc(s).replace(/`([^`]+)`/g, (_, c) => (codes.push(c), '\u0000' + (codes.length - 1) + '\u0000'));
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
       .replace(/https?:\/\/[^\s)<]*[^\s)<.,;:]/g, (u) => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>');
  return h.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
}
const day = (iso) => new Date(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
const needsCheck = (t) => t.status === 'manual' || t.manualChecks.length > 0 || /NEEDS A MANUAL CHECK/.test(t.text);
const visible = (t) => filter === 'all' || (filter === 'done' ? !!state[t.id] : filter === 'manual' ? needsCheck(t) && !state[t.id] : !state[t.id]);

function render() {
  const done = TASKS.filter((t) => state[t.id]).length;
  document.getElementById('sub').textContent = TASKS.length
    ? done + ' of ' + TASKS.length + ' reviewed · ' + (TASKS.length - done) + ' to go'
    : 'Nothing moved here yet. Run yarn review:tasks.';
  document.getElementById('fill').style.width = (TASKS.length ? (100 * done) / TASKS.length : 0) + '%';
  document.querySelectorAll('.filters button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.f === filter)));

  // Newest batch first; sections in the order they were in tasks.md.
  const batches = new Map();
  for (const t of TASKS.filter(visible)) {
    const b = batches.get(t.movedAt) || new Map();
    const s = b.get(t.section) || [];
    s.push(t); b.set(t.section, s); batches.set(t.movedAt, b);
  }
  const list = document.getElementById('list');
  if (!batches.size) { list.innerHTML = '<p class="empty">' + (filter === 'todo' ? 'All caught up.' : 'Nothing here.') + '</p>'; return; }
  list.innerHTML = [...batches.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([at, secs]) =>
    '<div class="batch">Moved ' + day(at) + '</div>' + [...secs.entries()].map(([name, ts]) => {
      const all = TASKS.filter((t) => t.section === name && t.movedAt === at);
      const n = all.filter((t) => state[t.id]).length;
      return '<section class="section"><h2>' + md(name) + '<span class="count">' + n + ' / ' + all.length + '</span></h2>' +
        (ts[0].goal ? '<details class="goal"><summary>Goal</summary><p>' + md(ts[0].goal) + '</p></details>' : '') +
        ts.map(task).join('') + '</section>';
    }).join('')).join('');
}

function task(t) {
  const badges = [];
  if (t.status === 'manual') badges.push('<span class="badge warn">Hands-on</span>');
  else if (needsCheck(t)) badges.push('<span class="badge warn">Manual check</span>');
  const rest = t.text.slice(t.title.length).replace(/^\s*/, '');
  return '<div class="task' + (state[t.id] ? ' reviewed' : '') + '">' +
    '<input type="checkbox" data-id="' + t.id + '" aria-label="Reviewed: ' + esc(t.title) + '"' + (state[t.id] ? ' checked' : '') + '>' +
    '<div><span class="title" data-toggle="' + t.id + '">' + md(t.title) + '</span><span class="badges">' + badges.join('') + '</span></div>' +
    '<details class="more" id="d-' + t.id + '"><summary>Details</summary>' +
      '<div class="block"><h3>Task</h3><p>' + md(rest || t.text) + '</p></div>' +
      (t.manualChecks.length ? '<div class="block"><h3>Manual check</h3>' + t.manualChecks.map((c) => '<p class="check">' + md(c) + '</p>').join('') + '</div>' : '') +
      (t.notes.length ? '<div class="block"><h3>What Ralph did</h3><ul>' + t.notes.map((n) => '<li>' + md(n) + '</li>').join('') + '</ul></div>' : '') +
    '</details></div>';
}

document.addEventListener('change', (e) => {
  const id = e.target.dataset && e.target.dataset.id;
  if (!id) return;
  if (e.target.checked) state[id] = new Date().toISOString(); else delete state[id];
  save();
  e.target.closest('.task').classList.toggle('reviewed', e.target.checked);
  setTimeout(render, filter === 'all' ? 0 : 350);
});
document.addEventListener('click', (e) => {
  const f = e.target.dataset && e.target.dataset.f;
  if (f) { filter = f; try { localStorage.setItem(KEY + ':filter', f); } catch {} render(); }
  const tg = e.target.closest && e.target.closest('[data-toggle]');
  if (tg) { const d = document.getElementById('d-' + tg.dataset.toggle); d.open = !d.open; }
});
document.getElementById('expand').onclick = () => {
  const ds = [...document.querySelectorAll('details.more')];
  const open = !ds.every((d) => d.open);
  ds.forEach((d) => (d.open = open));
};
document.getElementById('export').onclick = async (e) => {
  try { await navigator.clipboard.writeText(JSON.stringify(state)); e.target.textContent = 'Copied'; }
  catch { e.target.textContent = 'Copy failed'; }
  setTimeout(() => (e.target.textContent = 'Copy reviewed state'), 1500);
};
render();
</script>
