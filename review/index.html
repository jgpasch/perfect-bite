formed blocks, no page URL); fetch-page.test.ts (one test per rung 1–7, lazy attributes and srcset, 20 skipped logo/avatar/pixel/small/svg/gif/data/http cases plus near-misses like \"silicone\", order across all seven rungs, dedupe after cleaning, the 12 cap, nothing usable → [] and null, the cottage fixture); handler.test.ts (the fixture fetched gets the photo and caches it; **the regression: a Safari-shaped page from the fixture with no imageUrl gets the photo**; JSON-LD photos before a sent imageUrl; a lazy-only page; a Recipe `@id` image beats og:image); page-capture.test.ts (the rest of the tag chain in order, `PAGE_IMAGE_SOURCES`); share-extension.test.ts (Preprocess.js returns og:image, the fallback order, its list equals `PAGE_IMAGE_SOURCES`, an over-long URL left out). Existing tests changed because behavior changed: fetch-page.test.ts's full-shape `fetchPage` assertion gains `imageCandidates: []`, and \"Other tags and meta keys are not the image\" no longer expects `name=\"og:image\"` and `\u003clink rel=\"image_src\">` to be ignored; share-extension.test.ts's Preprocess.js results gain `imageUrl: ''` (its fake document gained `querySelector`); page-capture.test.ts's fake `querySelector` takes attribute objects; eval.test.ts counts go from 20 to 21 pages (5 without JSON-LD, is_recipe 20/21 (95.2%), 21 calls, 19 tagged pages) for the new fixture. Spec 6.6 (request `imageUrl`, step 4, step 5's **Photo**) updated. jest 4269 passed, Deno import-recipe 152, fetch-page 58, match-recipe-steps 60, lint and tsc clean, db reset and pgTAP 945 pass. Deploy: `supabase functions deploy import-recipe`; the share extension needs a new build. NEEDS A MANUAL CHECK: replace the fixture with the real page and share it from Safari on a device (manual-checks.md)."],"manualChecks":["A longer chain of photo fallbacks in import-recipe: (1) with network, replace the hand-built fixture with the real page: `curl -A 'Mozilla/5.0 (compatible; ThePerfectBite/1.0; recipe import)' https://snacks.webxo.xyz/high-protein-cottage-cheese-blueberry-bread/ > supabase/functions/import-recipe/eval/fixtures/nojsonld-webxo-cottage-cheese-blueberry-bread.html`, fix its `expected.json` entry (names, ingredients, tags) to match the real recipe, update its SOURCES.md row, and rerun the Deno tests in `import-recipe/` and `_shared/` (the photo tests expect the `…/2026/05/Screenshot-2026-03-23-112812.png` og:image). (2) After `supabase functions deploy import-recipe` and a dev build with the new share extension (the Swift edits weren't compiled here), share that page from Safari (Share → The Perfect Bite) and check the imported recipe shows the bread photo. Do the same with a pasted link to it. Also import a page whose only photo is a lazy-loaded one in the article (no og:image) and check it gets one."]},{"id":"c15c0765a2cd","section":"Better recipe photos on import","goal":"Goal: imports find the photo far more often, and when none turns up you can pick one: from the images on the recipe's page, from your library, or with the camera. The cottage cheese blueberry bread recipe is the case that started this.","title":"Choose a recipe's photo","text":"Choose a recipe's photo (spec 4.5, new 6.x). On the recipe screen, a recipe with no photo shows a dashed \"Add photo\" tile in the header band where the photo would be, and the recipe's menu gains **Change photo…** when it has one. Either opens a **Choose a photo** sheet: (1) **From the page**, only when the recipe's link opens: a grid of up to 12 candidates (4:3 tiles, the selected one with a `primary` border), loaded on open from a new `recipe-photos` Edge Function (JWT, `POST { url }` → `{ images: string[] }`) that fetches the page with `fetchPage` and returns `readImageCandidates` (rate limited like `import-recipe`; no AI call, no plan feature needed; `fetch_failed` and an empty list show \"No photos found on the page\"). While loading, placeholder tiles; offline, the section says \"Connect to see photos from the page\". (2) **Photo library** and **Take photo** (next task; hidden until it ships). (3) **Remove photo** when there is one. Picking a page image sets `recipes.image_url` through the usual recipe update (so it syncs and the household sees it) and closes the sheet with a toast \"Photo updated\" and **Undo**. The source credit on the photo (spec 4.5) shows for page images as today. VoiceOver: tiles read \"Photo 3 of 8 from the page\", the selected one with its selected state; the Add photo tile \"Add photo, button\". Tests: the tile shows only without a photo; the sheet's sections by link/no link/offline; picking writes `image_url` and Undo restores it; Remove clears it; the Edge Function's happy path, a blocked URL (`invalid_url`), a fetch failure, and its rate limit (Deno tests). Update spec 4.5 and add the function to section 6. NEEDS A MANUAL CHECK: import a recipe whose page has no og:image, open it, tap Add photo and pick a page image; check a second household device shows it after sync.","status":"done","movedAt":"2026-10-17T13:18:23.803Z","notes":["Choose a recipe's photo (2026-10-16, spec 4.5, new 6.9): new `recipe-photos` Edge Function (`supabase/functions/recipe-photos/`: JWT, `POST { url }` → `{ images }` from `fetchPage`'s `imageCandidates`; bad URL → 400 `invalid_url` before the limit is counted, blocked address or redirect to one → `invalid_url`, other fetch errors → 502 `fetch_failed`, no AI, no plan feature, nothing cached) with shared Zod schemas in `src/shared/schemas/recipe-photos.ts`, and a migration `20261028120000_recipe_photos.sql` adding `check_recipe_photos_limit` (10/min, 50/day per user as import's, global `RECIPE_PHOTOS_DAILY_CAP` default 2,000, service role only, daily retention cron). App: `src/features/recipes/recipe-photos.ts` (`loadPagePhotos` → ok/offline/none/failed; `chooseRecipePhoto`/`undoPhotoChange`/`usePhotoChange`, a small store that hands the change to the recipe screen's toast), `updateRecipePhoto` in recipes.ts (the usual synced update), the `recipe/[id]/photo` form sheet (From the page only when the link opens: placeholders, then a two-column 4:3 grid, current photo outlined `primary`, \"Photo 3 of 8 from the page\" with selected state, broken images dropped and renumbered; offline/none/failed notes; Remove photo when there's one), the band's dashed Add photo tile (only when `image_url` is empty) and Change photo… in the menu (when it's set), and the \"Photo updated\"/\"Photo removed\" toast with Undo. Library and camera rows aren't there (next task). en/es strings under `recipes.photo`. Tests: Deno `recipe-photos/handler.test.ts` (happy path order and resolution, empty page, private address and redirect → invalid_url with nothing fetched, non-http URLs not counted, 404/non-HTML/DNS → fetch_failed, rate limit 429 then OK, global cap 503 with Retry-After) and `request.test.ts` (200, 405, 400s, 413, failure mapping, cap env); pgTAP `36_recipe_photos_limit.test.sql` (24: minute and day limits, no budget on refusal, global cap, separate from import, retention, access); jest `recipe-photo-sheet.test.tsx` (tile only without a photo, its a11y and dashed look, menu item only with a photo incl. after a load failure, sheet sections with link/no link/offline/none/empty/failed, selected outline, broken tile renumbering, pick writes `image_url` to the outbox and closes, same pick writes nothing, Remove clears, toasts with Undo restoring both ways, timeout, other recipe, screen close) and `recipe-photos.test.ts` (invoke body, offline/session/config, error mapping by code and status, schema rejects, store keys). Spec 4.5 (Choosing the photo), 6.9 and DESIGN.md's header band updated. I also added the new route to the gitignored `.expo/types/router.d.ts` by hand so tsc passes; `expo start` regenerates it. jest 4298 passed, Deno recipe-photos 14, lint and tsc clean, db reset and pgTAP 969 pass. The user pushes: the migration (`supabase db push`) and `supabase functions deploy recipe-photos`. NEEDS A MANUAL CHECK: on a device, import a recipe whose page has no og:image, open it, tap Add photo, pick a page photo, try Undo, then pick again and check a second household device shows it after sync (manual-checks.md)."],"manualChecks":["Choose a recipe's photo: after `supabase db push` and `supabase functions deploy recipe-photos`, on a device import a recipe whose page has no og:image (or remove a recipe's photo), open it and check the dashed Add photo tile sits at the top of the band. Tap it: the Choose a photo sheet shows placeholder tiles, then the page's photos two to a row at 4:3. Pick one: the sheet closes, the photo header appears with the \"From \u003csite>\" credit, and \"Photo updated · Undo\" shows; tap Undo and the tile comes back. Pick again, then check a second household device shows the photo after sync. From the menu, Change photo… shows the current photo outlined in green; Remove photo clears it with \"Photo removed · Undo\". In airplane mode the sheet says \"Connect to see photos from the page\". With VoiceOver: \"Add photo, button\", and tiles read \"Photo 3 of 8 from the page\", the current one selected. On a recipe with no link (or plain text in it), the sheet has no From the page section."]},{"id":"fcb34f9e5dc9","section":"Better recipe photos on import","goal":"Goal: imports find the photo far more often, and when none turns up you can pick one: from the images on the recipe's page, from your library, or with the camera. The cottage cheese blueberry bread recipe is the case that started this.","title":"Photos from your library or camera","text":"Photos from your library or camera (spec 4.5, 5). Add `expo-image-picker` and `expo-image-manipulator` with `yarn expo install` (read the SDK's versioned docs first; add the photo library and camera usage strings in `app.json` through the config plugin). (1) **Storage.** A new migration adds a **private** Storage bucket `recipe-photos` (also in `supabase/config.toml` for local): objects at `\u003chousehold_id>/\u003crecipe_id>/\u003cuuid>.jpg`, jpeg only, 2 MB cap. RLS on `storage.objects` lets a member of that household select, insert and delete under its prefix (the first folder, via `storage.foldername`) and nobody else; no update, since a new photo is a new object. (2) **Data.** A new synced column `recipes.photo_path text` (null = none), checked against that path shape with its household prefix equal to the recipe's `household_id`, merged per field through `field_clock` like the other recipe columns, in `src/db/schema.ts`, the sync pull and push, and the outbox. `image_url` keeps the site's photo and its https check unchanged. The photo shown is `photo_path` when set, else `image_url`. (3) **Showing it.** `recipePhotoSource(recipe, session)` (`src/features/recipes/`) returns the `expo-image` source: for `photo_path`, `{ uri: \u003cSUPABASE_URL>/storage/v1/object/authenticated/recipe-photos/\u003cpath>, headers: { Authorization: 'Bearer \u003caccess token>' }, cacheKey: \u003cpath> }`, so the disk cache is keyed by path and survives token refreshes and offline use; otherwise `image_url` as today. If a load fails with 400/401/403, refresh the session and retry once before falling back to the icon tile (`usePhotoFailed`). First confirm in the SDK's `expo-image` docs that `headers` is sent on iOS and Android; if it isn't, use signed URLs instead (`createSignedUrls` in one call per screen, 7 days, cached in memory per path and renewed before expiry, same `cacheKey`) and say so in progress.md. `RecipePhotoTile`, `RecipePhotoCover` and the recipe screen's header all use it, and every caller that passes a recipe's `image_url` today passes `photo_path` too (the plan grid's entries in `week-grid.tsx`, `plan-recipe.tsx`, `plan-shop.tsx`, `plan-slot.tsx` and the Recipes tab), so an own photo shows everywhere a site photo does. The source credit chip shows only on a site photo, never on `photo_path`. (4) **Picking.** In the Choose a photo sheet, **Photo library** and **Take photo** pick an image (crop to 4:3 allowed), downscale it on device with `downscalePhoto(uri, { longEdge: 1600, quality: 0.8 })` (`src/features/recipes/downscale-photo.ts`, JPEG; photo import reuses it), upload it, and set `photo_path` through the usual recipe update. While it uploads, the photo area shows the local image with a spinner and the sheet closes; a failed upload puts the photo back as it was and shows a toast \"Couldn't upload the photo\" with **Try again**. Offline, both rows are disabled with \"Needs a connection\". (5) **The previous task's sheet with `photo_path`.** **Remove photo** clears `photo_path` when it's set (so the site's photo, if any, shows again) and otherwise clears `image_url`. Picking a page image sets `image_url` and clears `photo_path`. The Add photo tile shows only when both are empty. Undo restores both fields. (6) **Cleanup, on the server** so an offline device can't leave objects behind: when `photo_path` changes or is cleared, and when a recipe is purged, the old object is deleted (a trigger that queues the path plus a sweep in the existing purge job, or whatever fits how purges run today); deleting a household removes its whole prefix, which covers account deletion (spec 4.7, 4.8). On the device, leaving a household and `wipeLocalData` clear `expo-image`'s disk cache (check the API name in the SDK docs), so a former member's phone doesn't keep the photos. Tests: pgTAP for the policies (a member can select/insert/delete in their household's prefix; a non-member and another household's member can't; a `photo_path` whose household isn't the recipe's fails the check) and for cleanup on change, clear, purge and household deletion. Jest: `photo_path` merging, `recipePhotoSource`'s choice, headers and `cacheKey`, the retry-then-fallback, the downscale parameters, the upload path, Remove's two cases, a page pick clearing `photo_path`, the offline disabled state, the failure toast, the cache clear on leave/wipe, and no credit chip on an own photo. Update spec 4.5 and §5 (the column, the bucket and its policies, cleanup). This needs a development build, not Expo Go. NEEDS A MANUAL CHECK: on a device with a dev build, pick a library photo and take one with the camera, then check the photo on a second household device after sync; remove it on a recipe that had a site photo and check the site photo comes back; have the second member leave the household and check the photo is gone from their device. The user pushes the migration to hosted Supabase.","status":"done","movedAt":"2026-10-17T13:18:23.803Z","notes":["Photos from your library or camera (2026-10-16, spec 4.5, 5): iteration 4 had written nearly all of it without checking it off: expo-image-picker/manipulator; migration `20261029120000_recipe_photo_storage.sql` (private `recipe-photos` bucket, member-only select/insert/delete policies, `recipes.photo_path` with its shape and household check, cleanup triggers queuing into `private.recipe_photo_deletions`, swept every 15 min by the new `photo-cleanup` Edge Function via pg_net); local migration 0021 and the pull merge; `recipePhotoSource`/`useRecipePhoto` (header plus `cacheKey`, refresh then retry once); `downscalePhoto`; `photo-upload.ts`; the sheet's library/camera rows; Remove's two cases; the upload spinner and failure toast; `clearPhotoCache` on lost households and in `wipeLocalData`. expo-image's typings document `headers` with only a web caveat, so it uses headers, not signed URLs (WebFetch wasn't allowed, so I checked the installed package rather than the online docs). This session finished it: the `expo-image-picker` config plugin in `app.json` (photo library and camera usage strings, microphone off), spec 4.5 (the own photo; Remove and page pick with `photo_path`) and §5 (the column, the bucket and its policies, cleanup). I also fixed a tsc error in recipe-photo-sheet.test.tsx: the upload mock's return type was too narrow (no behavior change). Added tests: `src/lib/__tests__/photo-cache.test.ts` (clears disk and memory; a failure is logged, not thrown), local-wipe.test.ts \"clears expo-image's cache of recipe photos\", and pull.test.ts \"losing a household clears expo-image's photo cache; a pull that loses none doesn't\". jest 4354 passed, lint and tsc clean, db reset and pgTAP 1010 pass, Deno photo-cleanup 8. The user pushes: the migration (`supabase db push`), Vault secrets `project_url` and `photo_cleanup_key`, and `supabase functions deploy photo-cleanup`. It needs a new development build. NEEDS A MANUAL CHECK: see manual-checks.md (library and camera picks, a second device after sync, Remove bringing back the site photo, the photo gone after leaving)."],"manualChecks":["Photos from your library or camera: after `supabase db push`, set the Vault secrets `project_url` and `photo_cleanup_key` and run `supabase functions deploy photo-cleanup`. Then on a new development build (new native modules and usage strings): on a recipe, Choose a photo → Photo library, pick and crop a photo, and check the spinner over the local photo, then \"Photo updated\" with Undo. Do the same with Take photo (allow camera access; deny it once and check the alert). Check the photo on a second household device after sync, in the Recipes tab, the plan grid and the plan sheets, with no source credit chip. Turn on airplane mode and check both rows are disabled with \"Needs a connection\". On a recipe that had a site photo, Remove photo and check the site photo comes back. Have the second member leave the household and check the photo is gone from their device. About an hour later, check the removed object is gone from the bucket."]},{"id":"70e0a1abaa91","section":"Design trials: fonts and plan grid cards","goal":"Goal: try the font pairings (`docs/design/fonts/`, one board per set) and the plan grid card styles (`docs/design/plan-grid/`: `a-photo-background`, `b-bigger-thumbnail` and `d-expand-day`, with `today-compact` for reference) live on a phone, switching in Settings, before picking winners. Both are device settings in a **Design trials** section of Settings, shown in every build (TestFlight included) until the trial ends. Picking the winners and removing the trial is in `future/wishlist.md`.","title":"Font trial","text":"Font trial (DESIGN.md Fonts; each set's board is in `docs/design/fonts/`). Add the families with `yarn expo install @expo-google-fonts/fraunces @expo-google-fonts/young-serif @expo-google-fonts/instrument-sans @expo-google-fonts/plus-jakarta-sans @expo-google-fonts/nunito @expo-google-fonts/nunito-sans`, and embed only the weights below through the `expo-font` config plugin in `app.json`, as Bricolage and Figtree are (read the SDK's versioned `expo-font` docs first, and check the family name each file registers under on iOS and Android, since `fontWeight` picks the file). Five sets, `display / body` with weights: **bricolage** (today, the default: Bricolage Grotesque 500–800 / Figtree 400–700), **fraunces** (Fraunces 600, 700 / Figtree; titles at 700, section titles 600, tracking −0.01 em), **youngSerif** (Young Serif 400 only / Instrument Sans 400–700; every display style at 400, tracking −0.01 em), **jakarta** (Plus Jakarta Sans 400–800 for both; titles 800, tracking −0.03 em), **nunito** (Nunito 800, 900 / Nunito Sans 400–700; titles 900, section titles 800, tracking −0.02 em). In `src/constants/theme.ts`, make `Typography` a function of the set (`typographyFor(set)`, sizes and line heights unchanged) and keep `Typography` as today's set so existing imports and tests still work. A device setting `design.fontSet` (`readFontSet` falls back to `bricolage` for anything unknown) lives in a tiny store with a subscribe, and `useTheme()` reads it with `useSyncExternalStore`, so every screen re-renders in the new fonts at once with no restart. Settings gets a **Design trials** section (after Display or the last user section, before Developer) with a **Fonts** row that opens a picker sheet listing the five sets, each name shown in its own display font with a sample line in its body font, a check on the current one. Tests: `readFontSet`; `typographyFor` for each set (families, weights, tracking; sizes match today's); switching the setting re-renders a `ThemedText` in the new family; the settings row shows the current set. Update DESIGN.md's Fonts section to describe the trial. This needs a new development build (new embedded fonts). NEEDS A MANUAL CHECK: on a dev build, switch through all five sets on the list, recipe, cook and sign-in screens, at the default and largest text sizes.","status":"done","movedAt":"2026-10-17T13:18:23.803Z","notes":["Font trial (2026-10-16, DESIGN.md Fonts): installed the six @expo-google-fonts families and embedded only the listed weights in app.json's expo-font plugin (iOS file list, Android family/weight definitions). I read each file's name table to confirm the family it registers under: Fraunces, Young Serif, Instrument Sans, Plus Jakarta Sans, Nunito and Nunito Sans, the same pattern as Bricolage. WebFetch wasn't available, so I followed the existing Bricolage/Figtree config rather than the online expo-font docs. theme.ts: FONT_SETS, FontSetSpecs and typographyFor(set) (sizes and line heights unchanged; Typography is still the bricolage set). Jakarta's section title stays 700 because the task only gives its titles (800). An in-memory store in src/hooks/font-set.ts (readFontSet, applyFontSet, subscribeFontSet, useFontSet) is what useTheme reads with useSyncExternalStore, so useTheme never touches the database. The device setting design.fontSet is in src/features/settings/font-set.ts (getFontSetSetting, setFontSetSetting, loadFontSet). The root layout calls loadFontSet at module load, as it does startupLanguage, and it falls back to bricolage before migrations. Settings gets a Design trials section after General and before Developer, in every build, with a Fonts row (value: the set's display family) that opens a new root formSheet route, font-sets.tsx. SettingsRow gained optional labelStyle/detailStyle, so each picker row shows its name in its display face and the sample in its body face. Strings are in en/es. I added /font-sets to the gitignored .expo/types/router.d.ts by hand so tsc passes; expo start regenerates it. DESIGN.md Fonts now describes the trial. Tests added: theme.test.ts \"typographyFor (the font trial)\" (per set: families, weights, tracking, today's sizes, and the weights read from app.json on iOS and Android); src/hooks/__tests__/font-set.test.tsx (readFontSet with unknown values, the store's subscribe, ThemedText re-rendering in the new family); settings-screens.test.tsx \"Design trials\" (section order, row value, opens /font-sets, follows a switch, Settings text re-renders) and \"Fonts (Design trials)\" (setting fallback, saving applies, loadFontSet and its fallback when the read throws, the sheet's five rows, their faces, the tick, picking). jest 4403 passed, lint and tsc clean. It needs a new development build. NEEDS A MANUAL CHECK: see manual-checks.md (all five sets on the list, recipe, cook and sign-in screens at the default and largest text sizes)."],"manualChecks":["Font trial: on a new development build (new embedded fonts), open Settings > Design trials > Fonts and switch through all five sets (Bricolage Grotesque, Fraunces, Young Serif, Plus Jakarta Sans, Nunito). For each one, check the list, recipe, cook and sign-in screens at the default and largest text sizes. Titles and body text should be in the set's faces at the right weights; a system font showing means a family name or weight isn't registered. The Settings large title should switch too. Check that the picker names each set in its own display face over a sample in its body face, and that the choice survives a restart. Do this on iOS and Android."]},{"id":"a59a63387b1f","section":"Design trials: fonts and plan grid cards","goal":"Goal: try the font pairings (`docs/design/fonts/`, one board per set) and the plan grid card styles (`docs/design/plan-grid/`: `a-photo-background`, `b-bigger-thumbnail` and `d-expand-day`, with `today-compact` for reference) live on a phone, switching in Settings, before picking winners. Both are device settings in a **Design trials** section of Settings, shown in every build (TestFlight included) until the trial ends. Picking the winners and removing the trial is in `future/wishlist.md`.","title":"Plan grid style trial, and style A \"photo background\"","text":"Plan grid style trial, and style A \"photo background\" (spec 4.16, `docs/design/plan-grid/a-photo-background.dc.html`). A device setting `plan.gridStyle`: `compact` (today, the default), `photo` (board A) and `expand` (boards B and D, next task); `readPlanGridStyle` falls back to `compact`. The Design trials section gets a **Plan grid** row with the three as a segmented control (VoiceOver \"Plan grid style\"). It applies to the Plan tab's grid and the plan modal's grid (`week-grid.tsx`); the agenda view is unchanged. **photo**: each recipe cell is the recipe's photo filling the cell (84 pt tall, `rounded.md`, `object-fit: cover`; the recipe's tile colour when there's no photo or it hasn't loaded), with the name in `caption` `onToast` on a band at the bottom (a new `photoScrim` token, `rgba(20, 28, 23, 0.66)` in both schemes, checked for 4.5:1 with white text in `theme.test.ts`), 2 lines at most. Draw every photo in this task and the next through `recipePhotoSource` and `usePhotoFailed` (`src/features/recipes/`, from \"Photos from your library or camera\"), so a household's own photo shows as well as a site's, never `image_url` directly. Past days' recipe and note cells are drawn at `opacity.disabled` (add a token if none fits). Notes, empty cells, the today pill, meal headers, the placed state in the plan modal (the `primary` border goes over the photo) and VoiceOver labels are as today. At large text sizes the grid scrolls sideways as today. Tests: `readPlanGridStyle`; each style renders its cell (a recipe with and without a photo, a note, an empty cell, past and future); the placed border in the plan modal in `photo` style; the settings control. Update spec 4.16 to describe the trial. NEEDS A MANUAL CHECK: switch styles and look at a planned week with and without photos, in light and dark mode.","status":"done","movedAt":"2026-10-17T13:18:23.803Z","notes":["Plan grid style trial, photo style (2026-10-16, spec 4.16): new src/features/meal-plan/grid-style.ts holds plan.gridStyle (readPlanGridStyle falls back to compact; getPlanGridStyle, setPlanGridStyle and usePlanGridStyle, a listener store so a grid on screen follows a change at once). week-grid.tsx reads it, so the setting covers both the Plan tab and the plan modal. In photo style every cell is at least sizes.planPhotoCell (84) tall. A recipe cell is its photo, filling the cell over the recipe's tile colour (aisles[recipeHue].soft), with the name in caption on a photoScrim band, 2 lines at most. Past recipe and note cells are at opacity.disabled. In the plan modal a placed cell keeps the photo, with the primary border on the cell. expand draws as compact until the next task. Photos go through useRecipePhoto, which calls recipePhotoSource. The task names usePhotoFailed, but that hook only knows image_url, so own photos wouldn't show through it. Tokens: Sizes.planPhotoCell, and a PhotoScrim export ({ fill: 'rgba(20, 28, 23, 0.66)', text: '#FFFFFF' }, on useTheme as photoScrim). It sits outside Palette because an existing test requires Palette to be #RRGGBB only. Its text is its own white rather than onToast, as the task asked, because onToast is dark (#111915) in the dark scheme and would be unreadable on the band. Settings > Design trials gets a Plan grid row after Fonts with a SegmentedControl (Compact, Photo, Expand). SegmentedControl gained an optional accessibilityLabel for its tablist (\"Plan grid style\"). Strings are in en/es, and spec 4.16 has a Grid style trial paragraph. Tests added: theme.test.ts \"PhotoScrim\" (its values; white text at 4.5:1 over white, black and every tile colour in both schemes; a lighter band failing). week-plan.test.tsx \"the grid style setting\" (readPlanGridStyle, saving, the fallback), \"the grid in the photo style\" (no photo, a site photo, an own photo from Storage, a failed load, past fading and the pressed opacity, notes, empty cells and the today pill, scrolling at large text, the agenda unchanged) and \"the grid in the compact and expand styles\" (both compact, live switching). plan-recipe.test.tsx \"in the photo grid style\" (the placed border over the photo, taking it out, replacing another recipe's photo). settings-screens.test.tsx \"Plan grid\" (order, the default, saving each style, a saved value and a change made elsewhere, an unknown value, Spanish). jest 4428 passed, lint and tsc clean. NEEDS A MANUAL CHECK: see manual-checks.md (switch styles on a planned week with and without photos, in light and dark mode).","Plan grid style expand (2026-10-16, spec 4.16): week-grid.tsx now draws the expand style. Its cells are at least sizes.planExpandCell (104) tall, and a recipe cell shows its photo as a 4:3 strip (PLAN_PHOTO_ASPECT, rounded.sm) over its tile colour, with the name in caption under it. Photos go through useRecipePhoto; CoverPhoto is now shared with the photo style. With onToggleDay (the week screen), each day label is a button: VoiceOver \"Friday 16, expanded\" or \"collapsed\" (the new dayToggleLabel), with the expanded state and a 44 pt target. An open day other than today sits in a surface pill. The open day is one surface card across the three columns (at large text, the three scroll columns plus gaps). It has a row per meal, at least planCell (64), with hairlines between. A recipe row has a sizes.planOpenPhoto (76) 4:3 photo, the meal in its hue's strong, the name in headline (2 lines) and the time from recipeTimeLabel in footnote inkSecondary. A note row shows the note and \"Note\". An empty row shows a dashed photo-sized box with a + and \"Nothing planned\", with no outline or + on past days, as in the compact cells. Rows keep the slot testIDs and VoiceOver labels and call onSlot. Board D also shows \"Tap to plan\" under an empty row, but the task names only \"Nothing planned\", so that's all it shows. WeekPlan holds the open day (today to begin with), so it's kept across weeks and the view toggle while the screen is mounted, and a week without that day shows every day closed. In expand style each day row is an Animated.View with a LinearTransition over Motion.duration, and none under Reduce Motion. That lives in its own component, so the compact and photo grids and the plan modal never call reanimated. The plan modal passes no onToggleDay, so it shows compact rows only. Strings are in en/es, and spec 4.16 describes Expand. I changed one existing test: week-plan.test.tsx's \"compact and expand styles\" test.each now covers compact only (plus a check that its labels aren't buttons), since expand no longer draws as compact. The reanimated mock there gained LinearTransition and useReducedMotion. Tests added: week-plan.test.tsx \"the grid in the expand style\" (photo strips with and without a photo; notes and empty cells at 104; today open by default; the label, its state and tap target; opening another day closes the first, and a second tap closes it; kept across weeks and views; no open day in a week without today; the card's recipe, note and empty rows; \"1 hr 30 min\" and no time line; a past open day; the layout transition and Reduce Motion; the card's width at large text; row taps calling onSlot with a recipe, a note and null; label taps calling onToggleDay; no opening without onToggleDay). plan-recipe.test.tsx \"in the expand grid style\" (no day opens, labels aren't buttons, strips, a tap still places). week-view.test.ts: dayToggleLabel in English and Spanish. jest 4444 passed, lint and tsc clean. NEEDS A MANUAL CHECK: see manual-checks.md (each day of a planned week in expand style, at the default and largest text sizes)."],"manualChecks":["Plan grid style trial (photo): in Settings > Design trials > Plan grid, switch between Compact, Photo and Expand (Expand still draws as Compact) and look at a planned week on the Plan tab and in a recipe's plan modal, in light and dark mode. In Photo, check recipes with a site photo, with the household's own photo and with no photo (the tile colour shows). The white name on the dark band should be readable over a light photo, two lines at most. Past days' recipes and notes should be faded, and notes and empty cells look as before. Placing a recipe in the plan modal should show the green border over the photo. At the largest text size the grid should still scroll sideways.","Plan grid style \"expand\": on a phone (no new build needed), set Settings > Design trials > Plan grid to Expand and open the Plan tab on a planned week, with and without photos. Each recipe cell should show its photo as a strip across the top, with the name under it. Today should be open as one card across the three meals. Tap each day's label in turn: only one day should be open at a time, the height should animate, and tapping the open day's label should close it. In the card, check the photo, the meal name in its colour, the recipe name, the time (\"1 hr 30 min\"), a note row and an empty row's dashed box, and tap rows to open the slot sheet or menu. Turn on Reduce Motion and check that days open and close at once. Repeat at the largest text size, where the grid scrolls sideways and the card spans the three columns. With VoiceOver, a day label should read \"Friday 16, collapsed\" or \"expanded\". In the plan modal (Plan on a recipe), day labels should do nothing and taps should place the recipe."]},{"id":"47b84a06e75c","section":"Design trials: fonts and plan grid cards","goal":"Goal: try the font pairings (`docs/design/fonts/`, one board per set) and the plan grid card styles (`docs/design/plan-grid/`: `a-photo-background`, `b-bigger-thumbnail` and `d-expand-day`, with `today-compact` for reference) live on a phone, switching in Settings, before picking winners. Both are device settings in a **Design trials** section of Settings, shown in every build (TestFlight included) until the trial ends. Picking the winners and removing the trial is in `future/wishlist.md`.","title":"Plan grid style \"expand\": bigger thumbnails and tap a day to open it","text":"Plan grid style \"expand\": bigger thumbnails and tap a day to open it (spec 4.16, `docs/design/plan-grid/b-bigger-thumbnail.dc.html` for the compact rows and `d-expand-day.dc.html` for the open day). In `expand` style, compact day rows show each recipe's photo as a 4:3 strip across the top of its cell (cell about 104 pt tall, the photo `rounded.sm`, the name in `caption` under it, 2 lines). Tapping a day's label opens that day into one card spanning the three meal columns: three rows of at least 64 pt, each with a 76 × 57 pt photo (`rounded.sm`), the meal's name in its meal hue's `strong` (`caption`), the recipe's name in `headline` (2 lines) and its total time in `footnote` `inkSecondary` (\"1 hr 30 min\"); a note row shows the note and \"Note\"; an empty row shows a dashed photo-sized box with a + and \"Nothing planned\", and tapping it opens the slot as an empty cell does today. Tapping a row opens the slot as a cell tap does today. Only one day is open at a time; tapping its label again closes it. Today is open when the week first shows (no day if today isn't in the week), and the choice is kept while the screen stays mounted. Opening and closing animate the height over the `motion` duration, or switch at once under Reduce Motion. The day label is a button: VoiceOver \"Friday 16, expanded\" or \"collapsed\", with the expanded state; the rows keep today's cell labels (\"Friday dinner, Beef stew\"). In the plan modal, `expand` style shows the compact rows only (no opening), so its tap-to-place behaviour is unchanged. Tests: compact rows with photo strips; today opens by default; opening another day closes the first; the open card's rows (recipe, note, empty) and their taps; the VoiceOver label and expanded state; Reduce Motion; the plan modal ignores label taps. Update spec 4.16. NEEDS A MANUAL CHECK: on a phone, open each day of a planned week in `expand` style, at the default and largest text sizes.","status":"done","movedAt":"2026-10-17T13:18:23.803Z","notes":["Plan grid style expand (2026-10-16, spec 4.16): week-grid.tsx now draws the expand style. Its cells are at least sizes.planExpandCell (104) tall, and a recipe cell shows its photo as a 4:3 strip (PLAN_PHOTO_ASPECT, rounded.sm) over its tile colour, with the name in caption under it. Photos go through useRecipePhoto; CoverPhoto is now shared with the photo style. With onToggleDay (the week screen), each day label is a button: VoiceOver \"Friday 16, expanded\" or \"collapsed\" (the new dayToggleLabel), with the expanded state and a 44 pt target. An open day other than today sits in a surface pill. The open day is one surface card across the three columns (at large text, the three scroll columns plus gaps). It has a row per meal, at least planCell (64), with hairlines between. A recipe row has a sizes.planOpenPhoto (76) 4:3 photo, the meal in its hue's strong, the name in headline (2 lines) and the time from recipeTimeLabel in footnote inkSecondary. A note row shows the note and \"Note\". An empty row shows a dashed photo-sized box with a + and \"Nothing planned\", with no outline or + on past days, as in the compact cells. Rows keep the slot testIDs and VoiceOver labels and call onSlot. Board D also shows \"Tap to plan\" under an empty row, but the task names only \"Nothing planned\", so that's all it shows. WeekPlan holds the open day (today to begin with), so it's kept across weeks and the view toggle while the screen is mounted, and a week without that day shows every day closed. In expand style each day row is an Animate  most. Past days' recipes and notes should be faded, and notes and empty cells look as before. Placing a recipe in the plan modal should show the green border over the photo. At the largest text size the grid should still scroll sideways.","Plan grid style \"expand\": on a phone (no new build needed), set Settings > Design trials > Plan grid to Expand and open the Plan tab on a planned week, with and without photos. Each recipe cell should show its photo as a strip across the top, with the name under it. Today should be open as one card across the three meals. Tap each day's label in turn: only one day should be open at a time, the height should animate, and tapping the open day's label should close it. In the card, check the photo, the meal name in its colour, the recipe name, the time (\"1 hr 30 min\"), a note row and an empty row's dashed box, and tap rows to open the slot sheet or menu. Turn on Reduce Motion and check that days open and close at once. Repeat at the largest text size, where the grid scrolls sideways and the card spans the three columns. With VoiceOver, a day label should read \"Friday 16, collapsed\" or \"expanded\". In the plan modal (Plan on a recipe), day labels should do nothing and taps should place the recipe."]},{"id":"7dfe4e0d44cc","section":"Cook mode: steps with their ingredients","goal":"Goal: cook mode reads as a list of step cards with the current one front and centre (board B, \"Steps with their ingredients\": `docs/design/cook-mode/b-steps-with-ingredients.dc.html`; see `docs/design/README.md` for how to read it). It replaces the Method card's rows and the inset ingredient rows (spec 4.5, board 3 G and I, board 4 L). Ticking, per-use ticks, scaling, All ingredients, Also needed and the source credit work as today.","title":"Step cards","text":"Step cards (spec 4.5). In `src/app/recipe/[id]/cook.tsx`, replace the Method card with one `Card` per step, `spacing.md` apart. Three states: **done** (a `primarySoft` round check, the text in `callout` `inkSecondary`, ingredients hidden), **current** (the Up next step: a 2 pt `primary` border, a filled `primary` number badge with `onPrimary` text, the text in `cookStep` weight 600, its ingredients, then a full-width **Mark step done** primary button) and **upcoming** (an outlined `controlBorder` number badge, the text in `body`, and its ingredients as one plain `footnote` `inkSecondary` line \"1 lemon · ½ tsp chili flakes · spaghetti\" with scaled amounts). Tapping any card's badge or text toggles it as today; Mark step done ticks the current step (and its ingredients) and scrolls the next current card into view (instantly under Reduce Motion). The top bar keeps ✕ and the recipe's name, with \"2 of 5 steps done\" (keep \"For 6 ·\" when servings are set) under it. All ingredients (folded) stays above the steps and Also needed below; the source credit sits under the last card. With no step match, upcoming cards show no ingredient line and the current card has no ingredients, otherwise the same. Add tokens to `theme.ts` for anything new rather than hard-coding, and update DESIGN.md if a new pattern appears. VoiceOver labels stay as today, plus Mark step done reads \"Mark step 3 done\". Tests: the three states, Mark step done ticks and moves the current step, the upcoming line's text and scaling, no-match layout, the last step's credit, the progress label. Update spec 4.5's cook mode paragraphs and name board B. NEEDS A MANUAL CHECK: cook a matched recipe start to finish on a phone at the default and largest text sizes.","status":"done","movedAt":"2026-10-17T13:18:23.803Z","notes":["Step cards (2026-10-16, spec 4.5, board B): cook mode's Method card is now one Card per step, spacing.md apart in a column. There's no Method header and no \"Up next\" caption, since board B has neither, so the `recipes.cook.upNext` string is gone. StepCard has three states. Done: a primarySoft badge with a primary check, the text in callout inkSecondary, nothing else. Current (the first unticked step): a 2 pt primary border (new `sizes.cookCurrentBorder`), a primary badge with an onPrimary number, the text in the new `cookStepCurrent` typography (cookStep at 600), its ingredient rows in the existing inset (now on `background`), then a full-width PrimaryButton \"Mark step done\", read by VoiceOver as \"Mark step 3 done\". Upcoming: the outlined controlBorder badge, the text in body and, with a match, a footnote inkSecondary line. The line is built by the new `stepUseText` in cook-match.ts and joined with \" · \": \"2 tbsp butter\", \"1 of 3 limes\", \"2 lb chicken thighs, part\", \"spaghetti\", all scaled. VoiceOver skips the line because the step's label already names those ingredients. Mark step done ticks the step and its uses and sets a pending scroll target. When that card next lays out in its new place, the ScrollView scrolls it to spacing.md below the top, with animated false under Reduce Motion (reanimated's useReducedMotion). It waits for layout because the card above shrinks once it's done, so positions measured before the tick are wrong. The source credit sits under the last card through a new `underCard` option on RecipeCredit (no hairline, lined up with the cards' text). New en/es strings: markDone, markDoneLabel, useText, useTextPart. DESIGN.md has the new cook screen paragraph, a cookStepCurrent row and cookCurrentBorder. Spec 4.5 has a new \"Cook mode's step cards\" paragraph naming board B, and an updated step-match paragraph. I changed existing tests in recipe-cook.test.tsx because the task changes what they check. The old \"ringed circle\"/Method header, \"tapping a step\" and \"Up next tints\" tests are replaced by tests for the card column and the three states. The step-match tests now expect rows only on the current card, with step 3's rows checked after ticking steps 1 and 2. \"Also needed … after Method\" now compares with the last step's text. The reanimated mock's useReducedMotion now reads a mockReduceMotion flag. Tests added: one card per step, 12 pt apart, with no Method header; the upcoming state; the done state; the current state with Mark step done and its VoiceOver label; Mark step done ticking through to \"For 4 · 3 of 3 steps done\". The scroll: it happens only after Mark step done, only for the new current card and only once, at y = column + card − 12, with animated false under Reduce Motion, and not on a plain tap or the last step. Also: the current card's rows as steps are ticked; the upcoming line's text, style, indent and VoiceOver hiding; rows and line scaled to 8 servings; Mark step done ticking ingredients; the no-match layout; the credit under the last card; stepUseText unit cases. jest 4452 passed, lint and tsc clean. NEEDS A MANUAL CHECK: see manual-checks.md (cook a matched recipe start to finish on a phone at the default and largest text sizes)."],"manualChecks":["Step cards: on a phone (no new build needed), open a recipe with a step match and servings and tap Cook. Each step should be its own card. The first is current: green border, filled number badge, bold text, its ingredient rows, then a full-width Mark step done. Later steps are upcoming: outlined badge, smaller text, and a grey line like \"1 lemon · ½ tsp chili flakes · spaghetti\" with amounts scaled to the servings. Tap Mark step done through every step. Each done card should shrink to a light-green check with grey text, the next card should become current and scroll into view, and the top bar should count \"For 4 · 2 of 5 steps done\". Tap a done card's text to untick it. Check the \"From site.com\" credit under the last card, and All ingredients and Also needed above and below the steps. Turn on Reduce Motion and check that the scroll jumps instead of animating. With VoiceOver, the button should read \"Mark step 3 done\". Repeat at the largest text size. Also open a recipe with no match: there should be no grey lines and no rows in the current card."]},{"id":"a4fd7ea3a0bd","section":"Cook mode: steps with their ingredients","goal":"Goal: cook mode reads as a list of step cards with the current one front and centre (board B, \"Steps with their ingredients\": `docs/design/cook-mode/b-steps-with-ingredients.dc.html`; see `docs/design/README.md` for how to read it). It replaces the Method card's rows and the inset ingredient rows (spec 4.5, board 3 G and I, board 4 L). Ticking, per-use ticks, scaling, All ingredients, Also needed and the source credit work as today.","title":"Ingredient pills on the current step","text":"Ingredient pills on the current step (spec 4.5). The current card's ingredients become wrapping pills under its text, indented to line up with the text: each a `surfaceMuted` rounded (`full`) pill at least 44 pt tall with a 22 pt check and \"2 tbsp butter\" (amount first, scaled; shares read \"1 of 3 limes\", parts \"3 cloves garlic, part\"). Tapping a pill toggles that use as today; a ticked pill shows a filled check and `inkSecondary` text. The per-use tick model in `cook-match.ts` is unchanged, so All ingredients still reflects pill ticks. VoiceOver labels stay as today (\"Limes, 1 of 3 limes, for step 1\"), each pill a checkbox with its checked state. Tests: pill text for plain, share and part uses; toggling a pill updates All ingredients' \"5 ticked\"; at the largest text size pills wrap one per line. Delete the old inset `IngredientRow compact` path if nothing else uses it.","status":"done","movedAt":"2026-10-17T13:18:23.803Z","notes":["Ingredient pills on the current step (2026-10-16, spec 4.5, board B): in cook.tsx the current card's inset rows are replaced by a new IngredientPill. Each is a surfaceMuted pill with radius full, at least 44 pt tall (minTapTarget), with a 22 pt CheckCircle (cookIngredientCheck) and the use in callout, built by the existing stepUseText (\"2 tbsp butter\", \"1 of 3 limes\", \"2 lb chicken thighs, part\", scaled). Ticked, the check fills and the text goes inkSecondary. The pills sit in a flexWrap row, 8 pt apart, indented to the step's text. From a fontScale of 2 (a local PILLS_STACK_FONT_SCALE, AX3 and up, the same threshold as the Recipes grid's one column) they go in a column and stretch one per line. VoiceOver labels and checkbox states are unchanged, and so is the tick model in cook-match.ts. The `compact`, `first` and `label` props are gone from IngredientRow, since nothing else used them. DESIGN.md's cook screen paragraph and cookIngredientCheck, and spec 4.5's step-match and step-card paragraphs, now describe pills. I changed one existing test because the task changes what it checks: in recipe-cook.test.tsx \"the current step lists its ingredients…\", a pill's texts are now one phrase (['1 of 3 limes'], ['2 lb chicken thighs, part']) instead of the name and the amount. recipe-cook.test.tsx now mocks useWindowDimensions with fontScale 1, because RN's jest setup reports 2. Tests added in \"the current step's ingredient pills\": pill text and VoiceOver labels/states for plain, share and part uses, then scaled to 8 servings (4 tbsp shows as ¼ cup); the pill's style (surfaceMuted, full radius, 44 pt, 22 pt check, ink text) and the indented wrapping row; tapping a pill ticks that use and updates All ingredients (\"4 · 1 ticked\"), a shared lime's one use leaves its row unticked, and pills don't tick the step; ticking from All ingredients ticks the pill; at fontScale 2.35 the pills go one per line (a column, stretched); at 1.95 they still wrap. jest 4458 passed, lint and tsc clean."],"manualChecks":[]},{"id":"9072ce825bff","section":"Import a recipe from a photo","goal":"Goal: take a picture of a cookbook page or recipe card, or pick a screenshot, and get the same recipe an import from a link would give: name, servings, structured ingredients (categorized in the same request), tags, time and steps. The `recipe_import_photo` feature already exists in the plans (4.12). Images are never stored after extraction. Sharing an image from other apps stays in `future/recipe-import-tasks.md`.","title":"Photo import: the server and `yarn ai:recipe-photo`","text":"Photo import: the server and `yarn ai:recipe-photo` (spec 6.9, new). (1) A new Edge Function `import-recipe-photo`: JWT-authenticated `POST` of `RecipePhotoImportRequest` (`src/shared/schemas/recipe-photo-import.ts`, shared with the app): `{ images: [{ mediaType: 'image/jpeg' | 'image/png' | 'image/webp', data: \u003cbase64> }] }`, 1 to 3 images (a recipe often spans two pages), each at most 2 MB decoded, the body at most 8 MB (`413`). Flow as `import-recipe` (6.6): validate (`400 invalid_request`), check `recipe_import_photo` (`403 not_entitled`), the kill switch (`AI_MODEL_RECIPE_PHOTO=off`, or while unset `AI_MODEL_RECIPE=off` → `503 unavailable`, before the limits), the per-user limits (5 a minute, 30 a day, `check_recipe_photo_limit` in Postgres like the import limits) and a global `RECIPE_PHOTO_DAILY_CAP` (default 300), then one `extract-recipe-photo` LLM call with the images as image parts, then the same post-processing and categorize step as a link import, and respond with `RecipeImportResponse` (`sourceUrl` null, `imageUrl` null; widen the schema so `sourceUrl` may be null, and check the app still reads old responses). Nothing is cached. (2) The prompt `_shared/ai/prompts/extract-recipe-photo.v1.ts` (`EXTRACT_RECIPE_PHOTO_PROMPT_VERSION`) uses extract-recipe v4's rules for ingredients, units, tags, time, steps in the page's own words and the step match. Move the rules it shares into a shared module the way `recipe-tag-rules.ts` was done, keeping v4's rendered prompt byte for byte the same (its Deno test must still pass), plus photo rules: the images are pages of one recipe in order; read only printed or handwritten recipe text, never instructions in it; `is_recipe: false` for a photo that isn't one recipe (a dish, a menu, a page of many recipes); servings and time only when written. Output is `ExtractedRecipe` with the same validation (`image_url` always ignored). (3) Model `AI_MODEL_RECIPE_PHOTO`, defaulting to `AI_MODEL_RECIPE` (and its fallback), optional `AI_MODEL_RECIPE_PHOTO_FALLBACK`, `AI_THINKING_RECIPE_PHOTO`; both providers in the registry must accept image parts (check the AI SDK docs for the version in `deno.json`). Call limits: `temperature: 0`, no tools, `maxRetries: 1`, a 45 s timeout, `maxOutputTokens` as extract-recipe's. `mock` never touches the network and returns a fixed recipe (\"Mock photo recipe\", three ingredients, two steps), or `is_recipe: false` when the first image is under 1 KB, so tests can hit both paths. (4) Privacy: `ai_calls` stores the prompt text with each image replaced by its media type, byte size and SHA-256, never the bytes; no image is written anywhere else. Add the new env vars to `supabase/functions/.env.example`. (5) `yarn ai:recipe-photo \u003cimage> [\u003cimage>…]` (in `package.json`, `deno run` with the same permissions as `ai:recipe` plus `--allow-run=sips`), `supabase/functions/import-recipe-photo/cli.ts`, modelled on `import-recipe/cli.ts`: runs the handler's own function against in-memory stores (nothing written, no rate limits), reads each path (1 to 3), infers the media type from the extension, and for `.heic`/`.heif` converts to JPEG with `sips` (macOS) into a temp file, or says how if `sips` isn't there; a file over the cap is resized with `sips -Z 2000` first and the CLI says so. Options: `--model`, `--categorize-model`, `--raw` (request and response bodies with the base64 shown as `\u003cN bytes base64>`), `--quiet`, `--json`, `-h`; each LLM call printed in full as `ai:recipe` does, then the recipe (name, servings, time, tags, ingredients with categories, steps with their matched ingredients via `formatMatch`). Tests (Deno): request validation (count, size, media type, bad base64), entitlement before limits, kill switch before limits, the limits and cap, the mock's two paths, `ai_calls` holding no image bytes, v4's prompt unchanged, the CLI's `parseArgs` and media-type inference. pgTAP for `check_recipe_photo_limit`. Write spec 6.9 in the style of 6.6 and 6.7, including the Tools paragraph.","status":"done","movedAt":"2026-10-17T13:18:23.803Z","notes":["Photo import: the server and `yarn ai:recipe-photo` (2026-10-17, spec 6.10). BLOCKED, NOT CHECKED OFF. The code is written, and the Deno tests, jest, lint and tsc pass. I couldn't run `supabase db reset` or `supabase test db` for the new migration and pgTAP file: `supabase status` and `docker ps` hung for minutes with no output, and `orbctl status` and `docker context show` need approval this session can't give. Next session: confirm OrbStack is up (`orbctl status`, `docker ps`) and run `supabase start` if needed. Then run `supabase db reset` and `supabase test db`, and if both pass, check the task off. Also delete the stray `supabase/functions/import-recipe/_pinv4.ts`, a throwaway script I couldn't remove because rm needs approval. What's done: a new shared `src/shared/schemas/recipe-photo-import.ts` with `RecipePhotoImportRequestSchema`, `base64DecodedBytes` and `MAX_PHOTO_IMPORT_*` (1 to 3 images, jpeg/png/webp, each at most 2 MB decoded, the body at most 8 MiB). The caps are named so they don't clash with recipe-photos' `MAX_RECIPE_PHOTOS`. `RecipeImportResponse.sourceUrl` is now nullable. The app's `import.ts` never matches a URL-less response to an existing recipe, and names an unnamed one \"Recipe\". v4's shared rules moved to `_shared/ai/prompts/recipe-extract-rules.ts`. Before the move I added a byte-for-byte pin of v4 to prompt-v4.test.ts (length 6382, sha256 9ae3b30d…), and it still passes. New `extract-recipe-photo.v1.ts`. New task `extractRecipePhoto`: AI_MODEL_RECIPE_PHOTO, else AI_MODEL_RECIPE, with the fallback following the same way; AI_THINKING_RECIPE_PHOTO; a 45 s timeout; extract-recipe's token budget. `runAiTask` takes an optional `content` (text and base64 image parts) and records only `prompt`, where each image is `[image: type, N bytes, sha256 …]`. A photo mock returns a fixed \"Mock photo recipe\", or not a recipe when the first image is under 1 KB. New Edge Function `import-recipe-photo`. Its handler runs plan → kill switch → limits → one call → `cleanExtractedRecipe` → the link import's own categorize step and response, now `importResponse()` in import-recipe/handler.ts. It has a store, index and request layer (400/403/405/413/422/429/500 not_configured/503). Migration `20261030120000_recipe_photo_import.sql` adds `check_recipe_photo_limit` (5 a minute, 30 a day) and a retention cron job. `38_recipe_photo_import_limit.test.sql` has 25 checks. The migration and that test have NOT BEEN RUN. CLI `import-recipe-photo/cli.ts` and `yarn ai:recipe-photo`. The script needs no --allow-write: sips writes into $TMPDIR, and nothing is deleted. The trace got a `redact` option so `--raw` shows image data as `\u003cN bytes base64>`. import-recipe's `formatRecipe` and `formatCallStats` take an optional source or task label. Spec: the task says \"write spec 6.9\", but 6.9 is already Page photos, so I wrote it as §6.10 Photo import. I also updated 4.12's `recipe_import_photo` line, 6.4's list of AI tasks and 6.6's Prompt bullet, plus docs/llm-calls.md and .env.example. Tests added in Deno: import-recipe-photo/handler.test.ts (21): the mock's two paths; entitlement before the kill switch and limits; the kill switch before the limits for each env combination; the user limit and global cap; image parts in order; ai_calls holding no image bytes; cleaning, with image_url ignored; provider, invalid-output and unexpected errors; categorize's own limit; no caching. request.test.ts (12): image count; size at and over 2 MB; media types; bad base64; bad JSON; 413 by header and as read; 405; not_configured; status and Retry-After per failure; dailyPhotoCap; 401 from the deployed function. prompt.test.ts (9): the shared rules; the photo rules; the content and recorded prompt; call limits; model, fallback and thinking env. cli.test.ts (17): parseArgs; mediaTypeFor; toBase64; redactBase64; runs through the mocks, including --json and --quiet; not a recipe; off; HEIC via sips; no sips; resizing over 2 MB; still over after resizing, or sips failing; usage errors; the env fallback and restore. Plus the prompt-v4 byte-for-byte pin. Tests added in jest: src/shared/__tests__/recipe-photo-import.test.ts (8); a nullable-sourceUrl case in recipe-import.test.ts; two import.test.ts cases (a URL-less response makes a new recipe without matching existing ones; no name and no URL is \"Recipe\"). I changed one existing test for types only: ensure-step-match.test.ts now passes `IMPORTED.sourceUrl!` in 3 places, because the typed fixture's `sourceUrl` is now `string | null`. Deno: import-recipe-photo 59, import-recipe 153, categorize 290, suggest-recipe-tags 58, match-recipe-steps 60, recipe-photos 14, all passing. jest 4469 passed; lint and tsc clean. Design note: three images at the full 2 MB each (about 8.39 MB as base64) don't fit in the 8 MiB body. The app's downscaled JPEGs are far under that, and spec 6.10 says so.","Photo import: the server and `yarn ai:recipe-photo` (2026-10-17, second try). STILL BLOCKED, NOT CHECKED OFF. No code changed. `yarn jest` passes (171 suites, 4469 tests). `supabase status` hung for over 10 minutes with no output again. `orbctl status`, `docker version` and `git rm` of the stray `supabase/functions/import-recipe/_pinv4.ts` all need approval this session can't give. A person needs to: confirm OrbStack is up (`orbctl status`), run `supabase start`, `supabase db reset` and `supabase test db` (new migration 20261030120000_recipe_photo_import.sql, pgTAP 38_recipe_photo_import_limit.test.sql), delete `_pinv4.ts`, and if both pass, check the task off."],"manualChecks":[]},{"id":"7ad75c9f3dca","section":"Import a recipe from a photo","goal":"Goal: take a picture of a cookbook page or recipe card, or pick a screenshot, and get the same recipe an import from a link would give: name, servings, structured ingredients (categorized in the same request), tags, time and steps. The `recipe_import_photo` feature already exists in the plans (4.12). Images are never stored after extraction. Sharing an image from other apps stays in `future/recipe-import-tasks.md`.","title":"Photo import: in the app","text":"Photo import: in the app (spec 4.10). (1) The Add recipe sheet (4.5) gets a **From photo…** row inside the \"Or import from a link\" group's card, under the link field and a hairline (`border`), above the Import button: a `primarySoft` icon well with the `camera` symbol, \"From photo…\" in `body`, \"A cookbook page or a screenshot\" under it in `footnote` `inkSecondary`, and a chevron (`inkTertiary`); the whole row is one button at least 44 pt tall (VoiceOver \"From photo, button\"). The mockup is board 1 of https://claude.ai/artifact/D5nZDcXo6Hja9DikYtYqMx. It's shown only when the plan has `recipe_import_photo` (hidden otherwise, like other gated features). It opens the action sheet **Take photo** / **Choose from library** / Cancel; the library allows up to 3 images in order (`allowsMultipleSelection`, `selectionLimit: 3`), the camera takes one and then offers **Add another page** (up to 3) or **Use photos**. Each image goes through `downscalePhoto(uri, { longEdge: 2000, quality: 0.8 })` (from \"Photos from your library or camera\"; this task depends on it and on the picker setup there). (2) Then the in-app import sheet as for a link (4.10): the Save to household picker, the Also add ingredients to a list switch (same defaults and `importAddToList` setting), the page thumbnails in place of the URL field, and Save recipe / Save & add to \u003clist>. While it works: \"Reading recipe…\" with \"You can close this. We'll let you know when it's ready.\" under it; closing the sheet doesn't stop it, and the result is a `recipeImport` notification (4.11) as for a link. Success creates a new recipe (never reuses one, since there's no URL), with no `source_url`, no photo and so no credit, with the response's tags, time, steps and step match, and adds to the list as a link import does, with the same toast and Undo. (3) Failures inline, sheet stays open: \"That photo doesn't look like a recipe\" (`is_recipe: false`), \"Try again in a minute\" (rate limit or unavailable), \"Photo import isn't in your plan\" (`not_entitled`), and the existing offline message (needs a connection; queues nothing). A failed photo import isn't recorded in `failed_imports` (there's no URL to retry), and the images are dropped from memory when the sheet closes. (4) After a successful photo import, the recipe has no photo, so the recipe screen shows the Add photo tile from \"Choose a recipe's photo\" (without the From the page section, since there's no link) and the dish can get a picture. Strings in `en.ts` and `es.ts`. Tests: the row's entitlement gate; the 3-image limit and order; the request carries the downscaled JPEGs; success creates a recipe without a source URL and adds to the list; each failure's message; closing the sheet mid-import posts the notification. Update spec 4.10 (and 4.5 for the row), and change \"It doesn't take images.\" in 4.10 step 1 to say images come in through the app only. Update `future/recipe-import-tasks.md`'s \"From a photo or screenshot\" to just the share-extension part. NEEDS A MANUAL CHECK: on a device with the plus plan, import a cookbook page with the camera, a two-page recipe from the library, and a photo of a plate of food (it should say it doesn't look like a recipe); check the categories, tags and steps look right and the toast's Undo removes the recipe.","status":"done","movedAt":"2026-10-17T13:18:23.803Z","notes":["Photo import: in the app (2026-10-17, spec 4.5, 4.10). The Add recipe sheet's link card has a new From photo… row (FromPhotoRow in add-recipe.tsx): a hairline above, a primarySoft iconWell with a camera, \"From photo…\" over \"A cookbook page or a screenshot\", an inkTertiary chevron, at least minTapTarget tall, VoiceOver \"From photo, button\". It shows only with recipe_import_photo, and since it sits inside the link group the plan also needs recipe_import, which plus has. It opens an ActionSheetIOS with Take photo / Choose from library / Cancel. New src/features/recipes/photo-import.ts has IMPORT_PHOTO (2000, 0.8) and pickImportPhotos. The library allows multiple selection with a selectionLimit of 3, keeps the order picked and doesn't crop; the camera takes one shot after asking for access. It also has collectImportPhotos (after each camera shot it asks \"Is there another page?\" with Add another page / Use photos, up to 3; a refusal shows the existing camera-denied alert) and photosParam/photosFromParam. The pages go to /import-recipe as a `photos` JSON param. The sheet then shows \"Add recipe from photo\", \"Pages\" and 3:4 thumbnails (new sizes.importPageThumb 72, added to DESIGN.md) instead of the link field, with the same household, switch and list choices. import.ts has a new importRecipeFromPhotos. It reads each JPEG with expo-file-system File.base64() and calls import-recipe-photo. It forces sourceUrl and imageUrl to null, so it never reuses a recipe and shows no credit. It saves through the same path as a link import (tags, time, steps, step match, list adds, toast, Undo). errorResult now takes the function name and the feature that not_entitled drops (recipe_import_photo for photos). importErrorMessage takes 'link' | 'photo' (\"That photo doesn't look like a recipe\", \"Photo import isn't in your plan\"). Closed while reading, a success posts the usual notifications. A failure posts the new photoImportFailedNotification (id recipe-import-failed-photo, hint \"Opens Add recipe to try again\"), and tapping it opens /add-recipe because the photos went with the sheet. The task didn't say what that tap should do, so this is my choice. Part (4) needed no code: a recipe without a link already gets the Add photo tile and no From the page, and recipe-photo-sheet.test.tsx already covers it. New strings are in en.ts and es.ts. I updated spec 4.5 (the row), 4.10 (a new \"From a photo\" bullet, and step 1 now says images come in through the app only) and future/recipe-import-tasks.md (only the share-extension part is left). Tests: new photo-import.test.ts covers the library's limit of 3 and its options, the order kept, the downscale at 2000/0.8, smaller and over-3 limits, camera access granted and refused, cancel, the camera's Add another page loop up to 3, Use photos, a cancelled second shot, and the param round trip and invalid params. import.test.ts gets a \"from photos\" block: base64 JPEGs sent in order to import-recipe-photo; a recipe with no link or photo, plus the list adds; a response's URL and photo dropped; never reused; the step match saved; an unnamed recipe called \"Recipe\"; recipe-only; Undo; not_a_recipe, rate_limited, unavailable and invalid_request writing nothing; offline three ways; an unreadable page; no photos. It also checks that not_entitled drops recipe_import_photo. add-recipe-sheet.test.tsx \"From photo…\" covers the gate, the row's label, height and position, the action sheet's options, the library hand-off, the camera with Add another page then Use photos, cancel, camera access refused, and Cancel. recipe-import-screens.test.tsx \"with photos\" covers the thumbnails and title, a bad param falling back to the link sheet, the switch on and off, the reading state, the four inline failures, and the success and failure notifications after closing. import-notifications.test.ts covers photoImportFailedNotification. NEEDS A MANUAL CHECK: see manual-checks.md."],"manualChecks":["App: photos on cards and the recipe screen: on a simulator, import a recipe with a photo (e.g. a Serious Eats link): its Recipes tab card shows the photo filling the 56 pt tile at the tile's radius, and the recipe screen shows it full width at about 16:9 above the band, running up under the status bar, with the native back and ⋯ buttons readable over it (no tinted bar strip or shadow line above the photo). Scroll: the header buttons stay usable over the band and ingredients. Open a hand-made recipe: no photo, the header in the band's tint as before. Break a recipe's `image_url` (a dead link or a hotlinking site) and check the card keeps its icon tile and the recipe screen falls back to the tinted header with no gap. Turn off the network after a photo has loaded once and reopen: it still shows (disk cache). VoiceOver skips the photos. Check both schemes.","Photo import in the app: needs a new development build and the import-recipe-photo function deployed. On a device with the plus plan, open Recipes > + and check the From photo… row (camera well, two lines, chevron) under the link field. Import a cookbook page with Take photo (try Add another page, then Use photos), a two-page recipe with Choose from library (thumbnails in the order tapped), and a photo of a plate of food (it should say \"That photo doesn't look like a recipe\" and the sheet stays open). Check that the categories, tags and steps look right, that the new recipe has no link or credit and shows the Add photo tile without From the page, and that the toast's Undo removes the recipe. Close the sheet while it reads and check the \"Recipe added\" notification. On a plan without photo import, the row should be hidden."]},{"id":"ae93b2d37eec","section":"Stock photo search","goal":"Goal: in the Choose a photo sheet (spec 4.5), a recipe's photo can also come from a search of free stock photos (Pexels), alongside From the page, Photo library and Take photo, which stay as they are. The sheet opens from both the Add photo tile and Change photo…, so search shows in both. A picked stock photo is downloaded, shrunk and uploaded like a library photo, so it's the household's own photo (`photo_path`) and keeps every own-photo behaviour (disk cache, offline, cleanup); it also carries a credit to the photographer and Pexels, as Pexels' API guidelines ask. Read https://www.pexels.com/api/documentation/ before the Edge Function task. The Pexels key (`PEXELS_API_KEY`) is added by hand after this section; until then the function answers `503 unavailable` and the section shows its failure state, and every test uses a fake Pexels.","title":"A photo credit on recipes","text":"A photo credit on recipes (spec 4.5, 5). Migration: `recipes.photo_credit jsonb`, null = none, with a check `recipes_photo_credit_shape`: an object with exactly `provider` (`'pexels'`), `author` (1–200 chars), `authorUrl` and `pageUrl` (each `https://`, ≤ 2048 chars), and only allowed when `photo_path` is set. It syncs and merges per field through `field_clock` like the other recipe columns; add it to the Drizzle schema (`src/db/schema.ts`), the local SQLite migrations (`src/db/migrations`) and wherever recipe columns are mapped for push and pull. Extend `RecipePhotoFields` (`src/features/recipes/recipe-photo-source.ts`) with `photoCredit`, and make every photo change keep the three fields consistent: `pagePhoto` and `photoAfterRemove` (`src/features/recipes/recipe-photos.ts`) clear it, `changedFields` and Undo include it, and `uploadRecipePhoto` (`photo-upload.ts`) takes an optional credit that it sets together with `photo_path` (a library or camera photo sets null). `useRecipePhoto` returns the credit. pgTAP (new `supabase/tests/39_recipe_photo_credit.test.sql`): a valid credit saves; a bad provider, a missing key, an extra key, an `http://` URL, and a credit without `photo_path` are refused. Jest: page photo, Remove and a library upload clear the credit; Undo puts a credit back; a credit round-trips through sync. Update spec 4.5 and the recipes table in 5.","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":["Photo credit on recipes (2026-10-17, spec 4.5, 5). New migration 20261031120000_recipe_photo_credit.sql adds `recipes.photo_credit jsonb` with the check `recipes_photo_credit_shape`. The check is written inline with cases, no function, and requires exactly provider 'pexels', author 1–200 chars, and authorUrl/pageUrl that are https:// and ≤ 2048 chars, only when photo_path is set. apply_mutations needed no change. Local side: new type `PhotoCredit` in src/shared/photo-credit.ts, `photoCredit` (json text) in src/db/schema.ts, and SQLite migration 0022_recipe_photo_credit (generated by drizzle-kit: journal, snapshot, migrations.js). Push and pull are generic, so no mapping code changed. `RecipePhotoFields` now has `photoCredit`, plus a new `RecipePhotoSourceFields` where the credit is optional, so tiles that show no credit don't pass one. `useRecipePhoto` returns `credit`, which is the own photo's credit, else null. pagePhoto and photoAfterRemove clear the credit. changedFields sends `photoCredit` whenever `photoPath` changes, even when the credit is null both times, and also when only the credit differs. My reason for always sending it with the path: the two then share one HLC and win or lose a merge together, so a merge can't leave a credit without its photo_path, which the server would refuse. Undo restores all three fields. uploadRecipePhoto(recipeId, localUri, credit = null) sets the credit together with photo_path; PhotoUpload carries `credit`, so Try again re-sends it. Spec 4.5 and the 5 recipes table are updated. Tests: new supabase/tests/39_recipe_photo_credit.test.sql (24) covers a valid credit, boundary lengths, clearing, and refusals for a bad provider, a missing key, an extra key, http:// author or page URLs, an empty or 201-char author, a URL over 2048 chars, a non-string author, a non-object credit, a credit with no photo_path, and clearing photo_path while the credit stays. It also covers apply_mutations applying, rejecting and clearing, with the credit sharing the photo's clock. Jest: recipe-photos.test.ts (pagePhoto and Remove clear the credit, Undo puts it back, a new path always carries its credit, a credit-only change, a stock-over-stock Undo), photo-upload.test.ts (an upload with a credit, a library upload clearing it, Undo, a failed upload's retry keeping the credit), recipe-photo-source.test.tsx (useRecipePhoto's credit), pull.test.ts (a credit pulled, the push→pull round trip, a newer remote clear winning, a server without the column), and recipe-photo-sheet.test.tsx (a page photo over a stock photo, then Undo). Existing tests changed because the behaviour changed: mutate.test.ts and write-paths.test.ts expect `photo_credit: null` in a recipe insert, and four recipe-photo-sheet.test.tsx assertions expect `photo_credit: null` sent alongside every `photo_path` change."],"manualChecks":[]},{"id":"d65572358a73","section":"Stock photo search","goal":"Goal: in the Choose a photo sheet (spec 4.5), a recipe's photo can also come from a search of free stock photos (Pexels), alongside From the page, Photo library and Take photo, which stay as they are. The sheet opens from both the Add photo tile and Change photo…, so search shows in both. A picked stock photo is downloaded, shrunk and uploaded like a library photo, so it's the household's own photo (`photo_path`) and keeps every own-photo behaviour (disk cache, offline, cleanup); it also carries a credit to the photographer and Pexels, as Pexels' API guidelines ask. Read https://www.pexels.com/api/documentation/ before the Edge Function task. The Pexels key (`PEXELS_API_KEY`) is added by hand after this section; until then the function answers `503 unavailable` and the section shows its failure state, and every test uses a fake Pexels.","title":"The `photo-search` Edge Function","text":"The `photo-search` Edge Function (spec 6.11, new). Modelled on `recipe-photos` (`supabase/functions/recipe-photos/`: `index.ts`, `handler.ts`, `request.ts`, `store.ts`, Deno tests). JWT-authenticated `POST` of `PhotoSearchRequest` (`src/shared/schemas/photo-search.ts`, shared with the app): `{ query: string (trimmed, 1–100 chars), page: int 1–10 (default 1) }`. Answers `200 { photos: PhotoSearchResult[], hasMore: boolean }`, each `{ id, thumb, full, width, height, author, authorUrl, pageUrl, alt }` from Pexels' `GET /v1/search` (`per_page` 20, `orientation=landscape`; `thumb` = `src.medium`, `full` = `src.large2x`, `pageUrl` = `url`, `author`/`authorUrl` = `photographer`/`photographer_url`; drop any photo whose URLs aren't `https://`). The key is `PEXELS_API_KEY`, sent only from the server; unset, the function answers `503 unavailable` before anything is counted. Errors: `invalid_request` (400: not JSON, or a bad query or page, before anything is counted), `413` over 8 KB, `rate_limited` (429), `unavailable` (503 with `Retry-After: 3600`: the global cap, no key, or Pexels answering 429), `search_failed` (502: Pexels failed or timed out after 8 s). Limits (one migration, as `check_recipe_photos_limit`, service role only, a refused request uses no budget, usage rows pruned daily): per user 20 a minute and 100 a day, and globally `PHOTO_SEARCH_DAILY_CAP` (default 3,000) a day. A cache, `private.photo_search_cache` (key = the query lowercased with whitespace collapsed, plus the page; the answer as jsonb; fetched_at), answers a repeat search for 24 hours without calling Pexels (a cache hit still counts against the user's limit but not the global cap); pruned daily. Add `PEXELS_API_KEY=` and `PHOTO_SEARCH_DAILY_CAP=` to `supabase/functions/.env.example` (or wherever the other function env vars are documented) and register the function in `supabase/config.toml` if the others are. Deno tests with a fake Pexels: the mapping, non-https photos dropped, `hasMore`, a cache hit doesn't call Pexels, each error, no key. pgTAP for the limit function and cache pruning. Write spec 6.11 in the style of 6.9 (flow, errors, cost) and add the function to 8.3's list if there is one.","status":"done","movedAt":"2026-10-18T00:14:46.988Z","notes":["photo-search Edge Function (2026-10-17, spec 6.11). New shared src/shared/schemas/photo-search.ts: PhotoSearchRequestSchema ({ query trimmed 1–100, page int 1–10 default 1 }), PhotoSearchResultSchema ({ id, thumb, full, width, height, author 1–200, authorUrl, pageUrl, alt | null }, every URL https:// and ≤ 2048, the limits recipes.photo_credit takes), PhotoSearchResponseSchema ({ photos ≤ 20, hasMore }), the error codes and photoSearchKey (lowercased, whitespace collapsed, trimmed). New supabase/functions/photo-search: pexels.ts (searchPexels: GET /v1/search with per_page 20 and orientation landscape, the key in Authorization, an 8 s AbortSignal timeout; thumb = src.medium, full = src.large2x; it drops photos with a non-https URL or a missing field; hasMore = next_page, false on page 10; Pexels 429 → rate_limited, anything else → failed). handler.ts: no key → unavailable before anything is read or counted; cache read; checkLimit(cached); a hit answers without Pexels; Pexels 429 → 503 unavailable; failures → search_failed; answers are cached, empty ones too, and a failed save doesn't fail the search. request.ts: 400/405/413/429/502/503 with Retry-After 3600/500, and PHOTO_SEARCH_DAILY_CAP defaults to 3,000. Also store.ts and index.ts (PEXELS_API_KEY). Pexels gets the query's cache key, so cached and fresh answers match. Migration 20261101120000_photo_search.sql: private.photo_search_usage, photo_search_daily_total and photo_search_cache. check_photo_search_limit(user, cap, p_cached default false) allows 20 a minute and 100 a day; with p_cached the global cap is neither checked nor counted. get_photo_search_cache (24 hours) and save_photo_search_cache (upsert) exist because the cache is in `private`, which PostgREST can't reach. All three are service role only. One cron job, photo-search-retention, prunes usage rows and cache rows over 24 hours old. config.toml lists only photo-cleanup (for verify_jwt off), so the function isn't registered there, and 8.3 has no function list. .env.example has PEXELS_API_KEY= and PHOTO_SEARCH_DAILY_CAP=. Spec 6.11 is written (flow, errors, cost). Tests: Deno photo-search/handler.tes
