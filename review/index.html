<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ralph Review</title>
<style>
:root {
  --bg: #EEF3EC; --surface: #FFFFFF; --muted: #DCE4DA; --border: #E3E9E1; --control: #B9C4BC;
  --ink: #1D2A22; --ink2: #55635A; --ink3: #7C877F; --primary: #2E6B45; --on-primary: #FFFFFF;
  --primary-soft: #DDEFE2; --on-primary-soft: #1F5233; --pending: #8A5C0C; --pending-soft: #FFF7E6;
  --header: #1F4D33; --on-header: #FFFFFF; --on-header2: #B7D2BF;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #111915; --surface: #1B241F; --muted: #26312B; --border: #26312B; --control: #4A5850;
  --ink: #E6EDE7; --ink2: #A9B6AD; --ink3: #7F8C84; --primary: #7CC395; --on-primary: #10301D;
  --primary-soft: #1F3A2A; --on-primary-soft: #BFE5CC; --pending: #E7B866; --pending-soft: #2E2516;
  --header: #163A26; --on-header: #FFFFFF; --on-header2: #9FC2AA;
} }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
header { background: var(--header); color: var(--on-header); padding: 28px 16px 20px; }
.wrap { max-width: 860px; margin: 0 auto; }
h1 { margin: 0; font-size: 28px; letter-spacing: -0.01em; }
.sub { color: var(--on-header2); margin-top: 4px; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); margin-top: 14px; overflow: hidden; }
.bar > div { height: 100%; background: var(--on-header2); transition: width .2s; }
.filters { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.filters button { border: 0; border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer;
  background: rgba(255,255,255,.14); color: var(--on-header); }
.filters button[aria-pressed="true"] { background: var(--on-header); color: var(--header); }
main { padding: 8px 16px 48px; }
.batch { margin-top: 22px; color: var(--ink2); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.section { background: var(--surface); border-radius: 16px; margin-top: 10px; overflow: hidden; }
.section > h2 { margin: 0; padding: 14px 16px 4px; font-size: 17px; display: flex; gap: 8px; align-items: baseline; }
.section > h2 .count { margin-left: auto; color: var(--ink2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.goal { padding: 0 16px 10px; color: var(--ink2); font-size: 13px; }
.goal summary { cursor: pointer; font-weight: 600; }
.task { border-top: 1px solid var(--border); padding: 12px 16px; display: grid; grid-template-columns: 28px 1fr; gap: 4px 12px; }
.task input { appearance: none; width: 24px; height: 24px; margin: 1px 0 0; border-radius: 50%; border: 2px solid var(--control);
  cursor: pointer; display: grid; place-items: center; }
.task input:checked { background: var(--primary); border-color: var(--primary); }
.task input:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--on-primary); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.task input:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.title { font-weight: 600; cursor: pointer; }
.task.reviewed .title { color: var(--ink2); text-decoration: line-through; }
.badges { display: inline-flex; gap: 6px; margin-left: 6px; vertical-align: 1px; }
.badge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--primary-soft); color: var(--on-primary-soft); }
.badge.warn { background: var(--pending-soft); color: var(--pending); }
details.more { grid-column: 2; font-size: 14px; }
details.more > summary { color: var(--ink2); cursor: pointer; font-size: 13px; }
.block { margin-top: 8px; }
.block h3 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
.block p, .block li { margin: 0 0 6px; }
.block ul { margin: 0; padding-left: 18px; }
.check { background: var(--pending-soft); border-radius: 10px; padding: 8px 10px; }
code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--muted); border-radius: 4px; padding: 1px 4px; word-break: break-word; }
a { color: var(--primary); }
.empty { text-align: center; color: var(--ink2); padding: 40px 0; }
.tools { display: flex; gap: 12px; justify-content: flex-end; margin-top: 18px; font-size: 13px; }
.tools button { border: 0; background: none; color: var(--primary); font: inherit; font-weight: 600; cursor: pointer; padding: 0; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Ralph review</h1>
  <div class="sub" id="sub"></div>
  <div class="bar"><div id="fill"></div></div>
  <div class="filters" role="group" aria-label="Show">
    <button data-f="todo">To review</button><button data-f="manual">Manual checks</button>
    <button data-f="done">Reviewed</button><button data-f="all">All</button>
  </div>
</div></header>
<main class="wrap">
  <div id="list"></div>
  <div class="tools"><button id="expand">Expand all</button><button id="export">Copy reviewed state</button></div>
</main>

 NEW rows (spec 4.1; board 1 A). When a list opens with news (`listNewsSince` with its marker), a `Card` sits at the top of the list, above the first section, in every view mode. It has the members' avatars (up to 3, overlapping by 10 pt, in `memberHue`), a `headline` title, a `footnote` `inkSecondary` line and a ✕ (44 pt, VoiceOver \"Dismiss\"). Titles: \"Alex added 4 items\", \"Alex and Sam added 7 items\", \"Alex, Sam and 2 others added 12 items\". The `footnote` reads \"Since you looked, yesterday at 6:40 PM\", with *when* as the edit sheet's Added rows read it, plus a time. Under it, in `callout`, up to 3 names in sentence case, then \"and 1 more\". The card is worked out once when the list opens and doesn't change during the visit: items arriving live use the arrival cue, not the card. ✕ hides it for this visit. Each new item's row gets a `Badge` \"NEW\" (`primarySoft`) after the name, and a second line \"Alex · yesterday\" (the row's existing second line comes after it, e.g. \"Alex · yesterday · from Chicken tacos\"). The badges stay until the list stops being on screen, so moving the marker clears them. VoiceOver: the card is one element (\"Alex added 4 items since yesterday, 6:40 PM: eggs, limes, corn tortillas and 1 more\") with Dismiss as an action, and new rows add \"new, added by Alex\". Tests: each title form; names and \"and N more\"; frozen during the visit; dismiss; badges cleared after leaving and coming back; nothing at all for a list with no marker or no news; VoiceOver labels. Update spec 4.1. NEEDS A MANUAL CHECK: with two accounts in one household, add items on one device, open the list on the other, and check the card and the badges.","status":"done","movedAt":"2026-10-16T23:36:40.770Z","notes":["The \"since you looked\" card and NEW rows (2026-10-16, spec 4.1): `useListSeenMarker` now also returns the current visit (`{ since, at, news }`): `listNewsSince` is read once as the list comes on screen with a marker, and the visit is cleared when the list leaves the screen, which moves the marker. New `src/features/lists/list-news.ts` has `summarizeNews` (an item counts once, under whoever added to it last), `newsTitle` (one, two, or \"Alex, Sam and 2 others\"), `newsSinceLine` (\"Since you looked, yesterday at 6:40 PM\"; under an hour just \"5 min ago\"), `newsItemsLine` (up to 3 names, the line in sentence case, then \"and N more\"), `newsCardLabel`, `rowNews` / `newRowLine` / `newRowLabel`, and `useListVisitNews` (✕ dismissal tied to the visit object). New `news-card.tsx` (`NewsCard`: avatars overlapping by 10 pt in `memberHue`, `headline` title, `footnote` line, `callout` names, a 44 pt ✕; one VoiceOver element with a Dismiss action). It's wired into `ListScreen` above the first section in every view mode, with `useMemberNames` for names. `ItemRow` takes `news`: a NEW `Badge` after the name, \"Alex · yesterday\" ahead of the second line, and \"new, added by Alex\" in its label after the name (`itemRowLabel` takes `news`). A new item checked off during the visit loses its badge. Strings are under `lists.news` in en/es (Spanish times are 24-hour, as `formatDate` gives for `es`). Added a spec 4.1 \"Since you looked\" bullet. I didn't re-run `yarn i18n:export`. Tests: new `list-news.test.ts` (17: each title form in English and Spanish, names and \"and N more\", the since line, summarize/dedupe/null, member names and Someone, row news, VoiceOver labels); `list-screen.test.tsx` \"since you looked\" (10: the card and rows in all three view modes, two members with ordering and avatars, frozen during the visit, ✕, the VoiceOver Dismiss action, cleared after leaving and showing only what's new on return, dismissal only for that visit, no marker, no news, a checked new item); `item-row.test.tsx` (2: badge, line and label; no news). Jest 4146 passed (2 skipped); lint and tsc pass. No `supabase/` changes. NEEDS A MANUAL CHECK: with two accounts in one household, add items on one device, open the list on the other, and check the card and the badges (steps in manual-checks.md)."],"manualChecks":["The \"since you looked\" card and NEW rows: with two accounts in one household on two devices, open a list on device B, then leave it (another tab). On device A, add 4 items to it, one of them a Combine into an item B added. Open the list on B. In By aisle, As added and By recipe, a card sits at the top above the first section. It shows A's avatar, \"Alex added 4 items\", \"Since you looked, today at \u003ctime>\", \"Eggs, limes, corn tortillas and 1 more\" and a ✕. Each of those rows has a green NEW badge after its name and \"Alex · N min ago\" at the start of its second line (before \"from \u003crecipe>\" where there is one). While B watches, add one more item on A: the card doesn't change and the new row gets no badge. Tap ✕: the card goes and the badges stay. Switch tabs and come back: no card, no badges. With VoiceOver, the card is one element (\"Alex added 4 items since today, \u003ctime>: eggs, …\") with a Dismiss action, and a new row reads \"…, new, added by Alex, …\". At the largest text size, the card and the badge wrap rather than clip."]},{"id":"b7b17a2e273d","section":"Household activity","goal":"Goal: you can tell what the rest of the household did to a list. When you open a list and someone else added items since you last looked, a card says so (\"Alex added 4 items\") and those rows are marked **NEW** until you leave (board 1 A). While you're looking at a list and someone else adds to it, the new row slides in tagged with their name, and the header says \"Alex is adding\" while they are (board 2 D and E, and the prototype). Mockups: https://claude.ai/artifact/7YVHMBerTkBufhm8CcVv8C. Boards 1 B and C and board 2 F aren't built. Every string is in `en.ts` and `es.ts`. The tasks run in order: the first one puts members' names on the device, and the rest need them.","title":"A row that arrives while you look","text":"A row that arrives while you look (spec 4.1, 4.6; board 2 E, the prototype). While a list is on screen, an item that appears in its live query and that another member added (a new item, or a Combine raising an existing item's amount) gets an arrival cue. A new row grows into place: Reanimated `entering`/layout, about 250 ms. Under Reduce Motion it appears without growing. The row then gets the existing merge flash: `pendingSoft` fading to the row's tint over `motion` (reuse the add-merge flash and its timing, and add a `motion` token if one is missing). A `surface` name tag (radius `full`) sits before the amount: a 20 pt avatar in `memberHue` plus the first name (\"Alex\") in `caption` in the hue's `strong`. The tag stays until you scroll the list or leave it. If the row lands outside the visible area, a pill floats 8 pt above the add bar (\"2 new from Alex\", or \"3 new\" for several people, with a down arrow). Tapping it scrolls to the first such row, and it goes away once they've been seen. Your own adds and pull catch-up when a list first opens (items that existed before it was shown) never get the cue. No haptic and no sound. VoiceOver: an announcement, \"Alex added limes\", throttled to one per 5 s and grouped (\"Alex added 3 items\"). Tests: which changes get the cue (another member's add, a Combine, my add, the first load); the tag cleared by scrolling; the off-screen pill and its scroll; the Reduce Motion path; announcement grouping. Update spec 4.1. NEEDS A MANUAL CHECK: on two devices, add items on one while watching the list on the other, in By aisle and As added, with Reduce Motion on and off.","status":"done","movedAt":"2026-10-16T23:36:40.770Z","notes":["A row that arrives while you look (2026-10-16, spec 4.1): new `src/features/lists/arrivals.ts`. `useListArrivals(listId, items, onScreen, me)` keeps a visit per list (on screen by the Keep screen on rule, in the foreground). It starts from `readListContents`, a synchronous read of the list's live contribution ids and items to get, so a live query that loads late can't look like arrivals. It's worked out during render as the live query's rows change, so a new row mounts already knowing it arrived. `detectArrivals` picks items to get with a contribution not seen before, from another member (not me on any device, not a null `added_by`), made on the server after the visit started less `SEEN_CLOCK_SKEW_MS`, so pull catch-up doesn't count. `grow` is set when the item wasn't already to get (new, or a checked item re-added). It returns `cues` (flash and grow, for the visit), `tags` (cleared by `clearTags` on the FlatList's `onScrollBeginDrag`), `unseen` (for the pill, `markSeen`) and the latest batch for VoiceOver. Leaving the list clears all of it. `ItemContribution` now carries `addedBy` (`listItemsQuery` selects it). `ItemRow` takes `arrival` ({ key, grow }), `tag`, `arrivalRef` and `onArrivalLayout`. `arrival` uses `growIn`, a custom Reanimated entering in `use-motion.ts` that opens the height over `Motion.duration` and is skipped under Reduce Motion, and `ArrivalFlash`, a `pendingSoft` overlay that fades out over the new `Motion.flashMs` token and restarts on a new contribution key. `tag` is a `surface` pill before the amount: a 20 pt avatar (new `Sizes.tagAvatar`) in `memberHue` and the short name in `caption` in the hue's `strong`; the row label adds \"added by Alex\". `ListScreen` wraps the FlatList in a measured viewport view. Arrived rows are measured with `measureInWindow` after each arrival, layout and scroll (`inSight`: the row's middle is inside the list's frame; a row that isn't drawn, e.g. in a folded section, is out of sight). Rows out of sight show `ArrivalPill` 8 pt above the add bar (\"2 new from Alex\" / \"3 new\", `arrivalPillText`). It scrolls to the first in list order: centred, or opening the section and using `scrollToIndex` when the row isn't drawn. `useArrivalAnnouncements` announces at most once per `ANNOUNCE_EVERY_MS` (5 s): the first at once, then the rest grouped (`arrivalAnnouncement`: \"Alex added limes\", \"Alex added 3 items\", a sentence per member). What's waiting is dropped on leaving. No haptic. Strings are under `lists.arrivals` in en/es. The existing add-merge highlight (aisle `soft` while its toast shows) is unchanged; the arrival flash is its own fade with the new token. Spec 4.1 has a new \"A row that arrives while you look\" bullet; DESIGN.md has an \"Arrival cue\" entry. Tests: new `arrivals.test.ts` (20: another member's add, a Combine, my adds, null `added_by`, catch-up before the visit and the skew edge, a checked item, a checked item re-added grows, several amounts at once, signed out; `readListContents`; `inSight` edges; the pill for one member, several, none, Someone, Spanish; announcement wording, grouping, dedupe, several members, Spanish). `item-row.test.tsx` \"an arrival\" (8: grow and clip, the Reduce Motion path, a Combine doesn't grow, the flash colour and `flashMs` fade, a re-flash on a new key, the tag's look, order and label, no arrival, the ref and layout callbacks). Its Reanimated mock gained `useSharedValue`, `useAnimatedStyle`, `withTiming` and a Reduce Motion switch; no existing test changed. `list-screen.test.tsx` \"a row that arrives while you look\" (14: another member's add, a Combine, my adds, first load and pull catch-up, every view mode, the tag cleared by scrolling, leaving and the list's own sheets, background, a checked-off arrival, the off-screen pill counting, scrolling and clearing, a row landing in sight, a folded section opened by the pill, announcement throttle and grouping with no haptic, announcements dropped on leaving). Jest 4187 passed (2 skipped); lint and tsc pass. No `supabase/` changes. NEEDS A MANUAL CHECK: on two devices, add items on one while watching the list on the other, in By aisle and As added, with Reduce Motion on and off (steps in manual-checks.md)."],"manualChecks":["A row that arrives while you look: with two accounts in one household on two devices, open the same list on both. On device A, add a new item (limes) while watching device B. On B the row grows into place (about 250 ms; the rows below make room), flashes pale amber that fades to the row's colour, and shows a pill before the amount with A's coloured avatar and first name (\"Alex\"). On A, add an amount to an item already on the list (\"2 milk\"): on B that row flashes and gets the tag without growing. Scroll B's list by hand: the tags go. Add something on B itself: no cue. Scroll B so the top of the list is out of view, then add two items on A: a green pill \"2 new from Alex ↓\" floats 8 pt above the add bar (above the toast when one shows). Tap it: the list scrolls to the first new row, and the pill goes once both rows have been in sight. Have a third member add too: the pill reads \"3 new\". Fold the aisle a new item lands in (By aisle) and add to it from A: the pill appears, and tapping it opens the aisle. Leave the list and come back: no cues. Do all of this in By aisle and in As added, with Reduce Motion off and on (on: the row just appears, and still flashes). With VoiceOver on B: \"Alex added limes\" is spoken at once; three quick adds from A within 5 seconds give one more announcement, \"Alex added 2 items\"; no haptic or sound on any arrival."]},{"id":"c5b437837f9d","section":"Household activity","goal":"Goal: you can tell what the rest of the household did to a list. When you open a list and someone else added items since you last looked, a card says so (\"Alex added 4 items\") and those rows are marked **NEW** until you leave (board 1 A). While you're looking at a list and someone else adds to it, the new row slides in tagged with their name, and the header says \"Alex is adding\" while they are (board 2 D and E, and the prototype). Mockups: https://claude.ai/artifact/7YVHMBerTkBufhm8CcVv8C. Boards 1 B and C and board 2 F aren't built. Every string is in `en.ts` and `es.ts`. The tasks run in order: the first one puts members' names on the device, and the rest need them.","title":"\"Alex is adding\"","text":"\"Alex is adding\" (spec 4.1, 7; board 2 D, the prototype). Use Supabase Realtime Presence on a private channel per open list, topic `list:\u003clistId>`, separate from the sync channels, which have per-client topics. First read the current Supabase Realtime Authorization and Presence docs. A migration adds RLS policies on `realtime.messages` so that only members of the list's household can join that topic or track presence on it. While the list is on screen, the app is in the foreground and it's online, the app joins and tracks `{ user_id, adding }`. `adding` is true while the add field is focused and for 10 s after the person's last add. Updates are throttled to one a second. The app leaves the channel on leaving the list or going to the background. The list header shows a 32 pt pill under \"9 to get · By aisle\", on the green (a `HEADER_WASH` fill, `onHeader` text): a 24 pt avatar and \"Alex is adding\", or \"Alex and Sam are adding\", or \"3 people are adding\", with three dots that pulse (static under Reduce Motion). It fades in and out over 200 ms, ignores your own presence, and is hidden in add mode (the header is collapsed then). VoiceOver: the pill is a static text element, with no announcement. Presence never carries what is being typed. Tests: the presence state, joining and leaving (screen, background, offline); the 10 s tail and the throttle; the pill's text for 1, 2 and 3+ people; your own presence ignored; pgTAP that a non-member can't join the topic. Update spec 4.1 and 7. The user pushes the migration (hand them the command). NEEDS A MANUAL CHECK: on two devices, focus the add field on one and watch the header on the other; background the first and see the pill go.","status":"done","movedAt":"2026-10-16T23:36:40.770Z","notes":["\"Alex is adding\" (2026-10-16, spec 4.1, 7.2): WebFetch wasn't permitted, so instead of the Supabase docs pages I read the installed realtime-js 2.117.3 (`private`, `presence.key`/`enabled`, `track`, `presenceState`, and how `channel()` reuses a topic) and the local `realtime` schema (`realtime.messages.topic`/`extension`, `realtime.topic()`). New migration `20261027153000_list_presence.sql`: `private.can_use_list_topic(topic)` (security definer: `list:\u003cid>` for a list in one of the caller's households, compared as text) and two policies on `realtime.messages` for `authenticated`, select (join and receive) and insert (track), both only for `extension = 'presence'`. New `src/features/lists/presence.ts`: `othersAdding` (from presence state: each user once, in order, never me on any device), `addingPillText` (one, two, \"3 people\"), `createThrottle` (the first value at once, then the latest at most once per `PRESENCE_THROTTLE_MS`), `joinListPresence` (a private channel `list:\u003clistId>` keyed by user; tracks `{ user_id, adding }` after SUBSCRIBED and again after a rejoin; a join waits for the last leave of the same topic, since realtime-js hands back an existing channel), `useListPresence` (joined while on screen by the Keep screen on rule, in the foreground and not offline, signed in and configured; leaving clears the pill) and `useAddingTail` (focused, or 10 s after the last add). `ListScreen` feeds it the add field's focus and calls `noteAdd` on an item add and a recipe add. New `adding-pill.tsx` (`AddingPill`): a `sizes.viewButton` pill in the new `listHeaderColors().presencePill` (`HEADER_WASH`, `onHeader`), with a 24 pt avatar (new `Sizes.presenceAvatar`), the text in `amount` and three 4 pt dots (`Sizes.presenceDot`) that pulse (`Motion.presencePulseMs`; still under Reduce Motion). It fades in and out over the new `Motion.presenceFadeMs` (200), has `accessibilityRole=\"text\"`, no live region and no announcement, and is `hidden` in add mode. It sits inside the collapsing header, under the count and view button. Strings are under `lists.presence` in en/es. Spec 4.1 has an \"Alex is adding\" bullet, 7.2 a \"List presence\" bullet, and DESIGN.md an \"Adding pill\" entry. `fake-supabase` channels now record `opts`, `track` payloads and presence listeners, with `setPresence`. The list-screen test's Reanimated mock gained `withDelay`/`withRepeat`/`withSequence`; no existing test changed. Tests: new `presence.test.tsx` (32: othersAdding incl. my other devices and malformed entries, pill text in en/es and Someone, the throttle, join/track/rejoin/sync/leave, a join waiting for the last leave, the hook joining and leaving on screen, list switch, offline and back, signed out, unconfigured and unmount, the 10 s tail and its restart), new `adding-pill.test.tsx` (6: look and tokens, 200 ms fade, pulse, Reduce Motion, VoiceOver, hidden or empty), `list-screen.test.tsx` \"Alex is adding\" (9: private topic and key, 1/2/3+ with avatar, own presence ignored, static text with no announcement, hidden in add mode, tracking focus with the 10 s tail and throttle and no typed text, another tab, own sheets, background, unmount), and pgTAP `35_list_presence.test.sql` (12: a member joins and tracks; no broadcast; another household's list, a non-list topic, a non-member, a member who left and anon are all refused). Jest 4234 passed (2 skipped); lint and tsc pass; `supabase db reset` and `supabase test db` pass. LEFTOVER: `supabase/tests/99_probe.test.sql` is a throwaway probe I couldn't delete (rm needed approval); it's now a single passing assertion, so delete it. The user pushes the migration: `supabase db push`. NEEDS A MANUAL CHECK: on two devices, focus the add field on one and watch the header on the other; background the first and see the pill go (steps in manual-checks.md)."],"manualChecks":["\"Alex is adding\": first push the migration (`supabase db push`, which applies `20261027153000_list_presence.sql`). With two accounts in one household on two devices, open the same list on both. On device A, tap the add field: within about a second, B's green header shows a pill under \"N to get · By aisle\" with A's coloured avatar and \"Alex is adding\", and three pulsing dots. It fades in. Leave A's field: the pill stays while A adds, and goes (fading) about 10 s after A's last add. Focus the field on A again, then send A to the background (home screen): the pill on B goes. Turn on airplane mode on A with the field focused: the pill on B goes within Realtime's timeout. Focus B's own field: B's header collapses and shows no pill, and A shows \"Bea is adding\" (B's name). With a third member adding too: \"Alex and Sam are adding\"; with three others: \"3 people are adding\". Turn on Reduce Motion on B: the dots keep still. With VoiceOver on B the pill reads as plain text and nothing is announced when it appears. In the hosted project's Realtime logs, check that the joins to `list:\u003cid>` succeed (no \"Unauthorized\" errors), which confirms the RLS policies work against the hosted Realtime."]},{"id":"23d3c842e400","section":"Step ingredients in cook mode","goal":"Goal: in cook mode you stop scrolling between the ingredient checklist and the steps. An AI call works out which ingredients each step uses. The match is saved on the recipe and synced, so cook mode stays fast and works offline. Each step then lists its own ingredients (amounts and checks) right under it (board 3 G and I). A recipe with no match yet opens cook mode as it does today (board 4 L). The match shows only in cook mode: the recipe screen doesn't change, and there's no way to edit a match by hand. Mockups: https://claude.ai/artifact/7YVHMBerTkBufhm8CcVv8C. Follow `docs/llm-calls.md` \"Adding a new LLM task\". Every string is in `en.ts` and `es.ts`. The tasks run in order. The first task is an eval: stop after it if the results aren't good enough.","title":"The eval first: can a model match ingredients to steps?","text":"The eval first: can a model match ingredients to steps? (spec 6; `docs/spikes.md`). Add an AI task `match-recipe-steps` in `_shared/ai/tasks.ts`, with a versioned prompt (`prompts/match-recipe-steps.v1.ts`) and `AI_MODEL_STEPS` (default the recipe model; optional `_FALLBACK`). Input: the steps (numbered) and the ingredients (numbered: name, quantity, unit, note). Output (Zod): for each step, a list of `{ ingredient: \u003cindex>, quantity: number | null }`, where `quantity` is that step's share in the ingredient's own unit when the recipe splits it (\"juice of 1 lime\" from 3 limes), and null for all of it or not stated. Validation drops unknown indexes and repeats within a step, nulls a share that isn't positive or is over the total, and turns a step count that doesn't match into `unavailable`. The prompt: the recipe is untrusted text; only ingredients the step actually uses; \"the chicken\" in step 5 means the cooked chicken from step 1, which is not a new use; a pantry staple named in no step stays unplaced. Add the eval at `supabase/functions/match-recipe-steps/eval/`: 15 or more recipes from the import eval's fixtures that have steps, with hand-labelled expected matches in `expected.json`. `yarn ai:eval:steps [--model …]` prints per-recipe and overall precision and recall of (step, ingredient) pairs, the share of ingredients placed nowhere, split-amount accuracy, and median and p95 latency and cost per recipe. Run it on the current recipe model and on at least one cheaper model. Also add `yarn ai:steps` for trying one recipe by hand, like `yarn ai:tags`, with an in-memory store and the real model unless `--model mock`. It accepts a recipe link (`yarn ai:steps https://…`: the import's own fetch and extraction get the steps and ingredients, with nothing cached or written), `--file page.html`, or `--step \"…\"` and `--ingredient \"2 lb chicken thighs\"` flags, repeated, for a recipe typed in. It prints each numbered step, then its matched ingredients indented under it with amounts and shares (\"Limes · 1 of 3\"), then \"Not in a step\" with the unplaced ones, then the model, the prompt version, the latency and the tokens. It also takes `--model`, `--raw` (the model's JSON as returned), `--json` and `--quiet`, as `ai:tags` does. Document both scripts in `docs/llm-calls.md` \"Running a call yourself\". Write the results and a go/no-go with the chosen model in `docs/spikes.md` §5 (\"Step ingredients\"). Suggested bar: precision ≥ 0.95 (a wrong ingredient on a step is worse than a missing one) and recall ≥ 0.85. No app or database changes in this task. Tests: the schema and validation (bad index, repeat, a share over the total, step count mismatch); the mock model, which matches by name words appearing in the step text; the eval scorer on a tiny fixture. If the bar isn't met, mark this done, write up why in the spikes doc, and stop: tell the user in progress.md that the rest of the section is on hold.","status":"done","movedAt":"2026-10-16T23:36:40.770Z","notes":["The eval first: step ingredients (2026-10-16, spec 4.5, 6; docs/spikes.md §5): **done, go.** New AI task `matchRecipeSteps` in `_shared/ai/tasks.ts` (`AI_MODEL_STEPS`, else `AI_MODEL_RECIPE`, fallbacks likewise; `AI_THINKING_STEPS`; 20 s timeout; `stepsMaxOutputTokens` 200 + 80 per step, capped at 6,000) with `MatchRecipeStepsOutputSchema` and `cleanStepMatch` (steps that don't line up → null, which `matchRecipeSteps` throws as `steps_mismatch`; unknown or repeated ingredients dropped; a share is kept only when positive and below the ingredient's quantity, rounded to 3 decimals; uses in recipe order). Prompt `prompts/match-recipe-steps.v1.ts`, its rules in `prompts/step-match-rules.ts` for the later import task. Mock `mockStepsModel` (an ingredient's last name word in the step text). `supabase/functions/match-recipe-steps/`: `match.ts` (`matchRecipeSteps`, `StepMatchRecipeSchema`, `StepMatchError`; no index.ts yet, the Edge Function is a later task), `cli.ts` (`yarn ai:steps \u003curl>`, `--file`, or `--step`/`--ingredient`; a link or file goes through `importRecipe` with categorize on the mock), `eval/eval.ts` (`yarn ai:eval:steps`, `--only`, `--price-in`/`--price-out`) and `eval/recipes.json` (16 recipes: 13 import-eval JSON-LD pages with the import model's ingredients frozen in, plus typed tacos with split limes, Spanish sopa de fideo, and an injection step; 100 steps, 220 needed pairs, hand-labelled). Results: gemini-3.8-flash 100% precision, 100% recall, all shares right, p50 2.5 s / p95 8.0 s; gemini-3.5-flash-lite 99.1% / 100%, p50 1.2 s / p95 2.0 s; ~1,000 in / 200 out tokens per recipe. Decision: keep `AI_MODEL_STEPS` unset (follows the recipe model). Docs: `docs/llm-calls.md`, `docs/spikes.md` §5, `.env.example`. Tests: 27 new Deno tests in `match-recipe-steps` pass; suggest-recipe-tags (58), import-recipe (119) and categorize-ingredients (290) still pass; `yarn tsc` and `yarn expo lint` clean."],"manualChecks":[]},{"id":"8cbbf78a4c94","section":"Step ingredients in cook mode","goal":"Goal: in cook mode you stop scrolling between the ingredient checklist and the steps. An AI call works out which ingredients each step uses. The match is saved on the recipe and synced, so cook mode stays fast and works offline. Each step then lists its own ingredients (amounts and checks) right under it (board 3 G and I). A recipe with no match yet opens cook mode as it does today (board 4 L). The match shows only in cook mode: the recipe screen doesn't change, and there's no way to edit a match by hand. Mockups: https://claude.ai/artifact/7YVHMBerTkBufhm8CcVv8C. Follow `docs/llm-calls.md` \"Adding a new LLM task\". Every string is in `en.ts` and `es.ts`. The tasks run in order. The first task is an eval: stop after it if the results aren't good enough.","title":"Saving the match on the recipe","text":"Saving the match on the recipe (spec 5, 7). A migration adds `recipes.step_ingredients jsonb` (null = never matched). Shape: `{ \"v\": 1, \"basis\": \"\u003chash>\", \"steps\": [[{ \"id\": \"\u003crecipe_ingredient_id>\", \"quantity\": null }], …] }`, one entry per step. A shape check (`private.recipe_step_ingredients_ok`, like the steps check) allows at most 100 steps and 80 ids per step, and needs `v` and `basis`. The ids aren't checked against `recipe_ingredients`, because deleted ones are filtered in the app. `apply_mutation` takes it as a last-writer-wins field, the whole value as one field like `tags` (a new migration redefining `private.apply_mutation` from the latest one). Add it to the local schema (Drizzle migration), `mutate.ts`, push and pull (compared by content, like `tags`). Add the pure `stepIngredientsBasis(steps, liveIngredientIds)` in `src/shared/` (a stable hash of the step texts and the sorted ids). Add `stepMatch(recipe, ingredients)` in `src/features/recipes/`. It returns `{ state: 'none' | 'fresh' | 'stale', steps: [...], unplaced: [...] }`, where `steps` has the live ingredients for each step (deleted ids dropped, the rest in the recipe's ingredient order) and `unplaced` has the live ingredients in no step. The match is stale when the basis doesn't match. A stale match is still shown. Tests: the basis is stable across key order and changes with a step edit, an added ingredient and a deleted ingredient; deleted ids are filtered; unplaced; the shape check accepts good values and refuses bad ones (pgTAP); a pull round-trip. The user pushes the migrations (hand them the command).","status":"done","movedAt":"2026-10-16T23:36:40.770Z","notes":["Saving the step match on the recipe (2026-10-16, spec 4.5, 5, 7): Supabase migration `20261025120000_step_ingredients.sql` adds `recipes.step_ingredients jsonb` with `private.recipe_step_ingredients_ok` (an object with a positive-integer `v`, a 1–64-char `basis` and 1–100 steps of at most 80 `{ id: 1–64 chars, quantity: null or > 0 }`; written with cases so a value of the wrong type is refused, not thrown on). I did NOT redefine `private.apply_mutation`, though the task asked for it: `recipes` has no settable-column list there (every column that isn't a key or the server's is settable, as `recipe_steps.sql` notes), so the column is already field-level LWW as one value, and the pgTAP test shows it. Copying the 260-line function unchanged would only risk merge conflicts. Local: `recipes.stepIngredients` + Drizzle `0019_step_ingredients.sql`. mutate, push and pull needed no code change: they handle columns generically, and pull's `canonicalJson` already compares jsonb by content. `src/shared/step-ingredients.ts`: the `StepIngredients` type and `stepIngredientsBasis` (a cyrb53 hex hash of JSON [steps, sorted ids]). `src/features/recipes/step-match.ts`: `stepMatch` (none/fresh/stale; live ingredients ordered by position; deleted and unknown ids dropped; a repeated id counted once; shares kept; steps line up with the recipe's current steps). Updated spec §5 (schema and shape) and §7.1. Tests: `src/shared/__tests__/step-ingredients.test.ts` (6), `src/features/recipes/__tests__/step-match.test.ts` (12), pull.test \"recipe step ingredients\" (6, including a push→echo round-trip with the keys reordered by jsonb), pgTAP `33_step_ingredients.test.sql` (33). I changed the existing mutate.test and write-paths.test only to add `step_ingredients: null` to their full lists of insert fields, since an insert now sends the new column. Jest 4016 passed (2 skipped); lint, tsc, `supabase db reset` and `supabase test db` (900) pass. The user pushes the migration: `supabase db push`."],"manualChecks":[]},{"id":"fdc91ed33df1","section":"Step ingredients in cook mode","goal":"Goal: in cook mode you stop scrolling between the ingredient checklist and the steps. An AI call works out which ingredients each step uses. The match is saved on the recipe and synced, so cook mode stays fast and works offline. Each step then lists its own ingredients (amounts and checks) right under it (board 3 G and I). A recipe with no match yet opens cook mode as it does today (board 4 L). The match shows only in cook mode: the recipe screen doesn't change, and there's no way to edit a match by hand. Mockups: https://claude.ai/artifact/7YVHMBerTkBufhm8CcVv8C. Follow `docs/llm-calls.md` \"Adding a new LLM task\". Every string is in `en.ts` and `es.ts`. The tasks run in order. The first task is an eval: stop after it if the results aren't good enough.","title":"The `match-recipe-steps` Edge Function","text":"The `match-recipe-steps` Edge Function (spec 6, 4.12). It takes a JWT-authenticated `POST { steps, ingredients: [{ id, name, quantity, unit, note }] }` (the schema in `src/shared/schemas/`, shared with the app). It validates (`400`, `413` over 256 KB) and checks a new feature `step_ingredients` (`403 not_entitled`). The migration seeds the feature on standard and plus, and the pgTAP plan checks cover it. It checks `AI_MODEL_STEPS=off` (`503`), then per-user limits (30 a minute, 300 a day; `check_step_match_limit`, like the tag limit) and a global daily cap `STEP_MATCH_DAILY_CAP` (default 5,000). It makes one call with the chosen model from the eval, `temperature: 0`, a 20 s timeout and `maxOutputTokens` sized from the eval, and maps the indexes back to the request's ids. It returns `200 { steps, promptVersion }` and stores nothing but `ai_calls`. Errors, input caps and the `Retry-After` values are as `suggest-recipe-tags` has them. `yarn ai:steps` (from the eval task) now runs through this handler. Tests (Deno): validation, entitlement before limits, limits, the off switch, id mapping, the mock model end to end. Update spec 6 (a new 6.8) and 4.12, and `docs/llm-calls.md`. The user deploys the function and sets the secrets (hand them the commands).","status":"done","movedAt":"2026-10-16T23:36:40.770Z","notes":["The `match-recipe-steps` Edge Function (2026-10-16, spec 4.12, 6.8): migration `20261026120000_match_recipe_steps.sql` adds the `step_ingredients` feature (seeded on standard and plus) and `check_step_match_limit` (30 a minute, 300 a day, global cap passed in; usage tables in `private`, retention job at 03:37 UTC). Shared schema `src/shared/schemas/match-recipe-steps.ts` (`MatchRecipeStepsRequestSchema`: 1–100 steps, at least one not blank, trimmed and cut to 2,000; ingredients with unique 1–64-char ids, empty names dropped, first 80, at least one; response `{ steps: [[{ id, quantity }]], promptVersion }`). Function `supabase/functions/match-recipe-steps/`: `handler.ts` (`matchSteps`: plan → off switch → limits → `matchRecipeSteps`; blank steps not sent and answered `[]`; indexes mapped back to ids; steps_mismatch is a 503 with Retry-After 30), `request.ts` (400/405/413/500 not_configured/503 as suggest-recipe-tags; `STEP_MATCH_DAILY_CAP` default 5,000), `store.ts`, `index.ts`. `yarn ai:steps` now runs `matchSteps` against `MemoryStepMatchStore` (ids \"1\", \"2\", …); its `--json` now prints `{ name, source, request, response }`, so I changed the existing cli.test `--json` assertion to match. `Feature` gains `step_ingredients` in `_shared/entitlements.ts` and in the app's `FEATURES` (so `my_features` keeps it). I left the app's `DEFAULT_FEATURES` as `['categorize']` although standard now also has `step_ingredients`: the next task (`ensureStepMatch`) should decide whether to add it. I changed the existing `17_plans.test.sql` for the new feature (seeded rows, my_features answers; plan 42 → 46). Docs: spec 4.12 and new 6.8, `docs/llm-calls.md`, `.env.example`, README, a spikes §5 note. Tests: Deno `handler.test.ts` (19: mock end to end, id mapping incl. skipped blank names and blank steps, entitlement before the off switch and limits, off switch, limits, provider/timeout/invalid/mismatch, 500), `request.test.ts` (12: validation cases, cuts, the 100-step max, failure mapping, 413, not_configured, cap parsing, 401), `cli.test.ts` +2; pgTAP `34_step_match_limit.test.sql` (28). Deno: match-recipe-steps 60, suggest-recipe-tags 58, import-recipe 119, categorize 290 pass; jest 4016 passed (2 skipped); lint, tsc, `supabase db reset`, `supabase test db` (932) pass. The user deploys: `supabase db push`, `supabase functions deploy match-recipe-steps`, and optionally `supabase secrets set STEP_MATCH_DAILY_CAP=5000` (leave `AI_MODEL_STEPS` unset so it follows `AI_MODEL_RECIPE`)."],"manualChecks":[]},{"id":"5405fe0005aa","section":"Step ingredients in cook mode","goal":"Goal: in cook mode you stop scrolling between the ingredient checklist and the steps. An AI call works out which ingredients each step uses. The match is saved on the recipe and synced, so cook mode stays fast and works offline. Each step then lists its own ingredients (amounts and checks) right under it (board 3 G and I). A recipe with no match yet opens cook mode as it does today (board 4 L). The match shows only in cook mode: the recipe screen doesn't change, and there's no way to edit a match by hand. Mockups: https://claude.ai/artifact/7YVHMBerTkBufhm8CcVv8C. Follow `docs/llm-calls.md` \"Adding a new LLM task\". Every string is in `en.ts` and `es.ts`. The tasks run in order. The first task is an eval: stop after it if the results aren't good enough.","title":"Matching recipes in the background","text":"Matching recipes in the background (spec 4.5). Add `ensureStepMatch(recipeId)` in `src/features/recipes/`. It does nothing when offline, when the user lacks `step_ingredients`, when the recipe has no steps or no ingredients, when the match is `fresh`, or when a call for that recipe is already in flight. Otherwise it calls the function and, if the recipe's basis is unchanged when the answer comes back, writes `step_ingredients` through `mutate.ts`. Call it after a recipe import saves, after the Steps sheet's Save, 2 s after the last ingredient edit on the recipe screen, and when the recipe screen or the cook screen opens (which is how recipes from before this feature get matched; there's no launch backfill). Errors are silent, with no UI. `unavailable` and `rate-limited` pause all matching for an hour (in memory), and `not-entitled` stops it for the session. Two household devices may both match; the last writer wins, which is fine. Tests: each skip condition; a basis change during the call drops the answer; each trigger, including opening a recipe that has steps but no match; the pauses.","status":"done","movedAt":"2026-10-16T23:36:40.770Z","notes":["Matching recipes in the background (2026-10-16, spec 4.5): added `src/features/recipes/ensure-step-match.ts` with `ensureStepMatch(recipeId)` (skips when paused/stopped, without `step_ingredients`, with no non-blank steps or no live ingredients, a fresh match, offline/signed out, and joins a call already in flight for that recipe; writes `step_ingredients` via `updateRows` only if the basis is unchanged when the answer returns), `ensureStepMatchSoon` (2 s debounce per recipe) and `useEnsureStepMatch`. `unavailable`/`rate_limited` (or a bare 503/429) pause all matching for an hour; `not_entitled` (or a bare 403) stops it for the session and calls `lostFeature`; all errors are silent. Triggers: `importRecipe` after it saves, the Steps sheet's Save, recipe-screen ingredient add/edit/delete/undo (debounced), and opening the recipe and cook screens. Exported `knownOffline` from `suggest-tags.ts` so both callers share it. Added a 4.5 bullet to the spec. Tests: `ensure-step-match.test.ts` (31: the request and saved value, shares, stale re-match, each skip, in-flight join, a basis change during the call drops the answer (step edit, added/deleted ingredient, deleted recipe; a rename keeps it), wrong step count/malformed/thrown/network/500 are silent with no pause, the hour pause for each code, the session stop, the 2 s debounce per recipe, the import trigger) and `step-match-triggers.test.tsx` (11: opening the recipe and cook screens with steps but no match, no steps, fresh, no feature; Steps sheet Save; recipe-screen add, delete, delete+undo). jest 4058 passed (2 skipped); lint and tsc pass."],"manualChecks":[]},{"id":"9276c27b2d3a","section":"Step ingredients in cook mode","goal":"Goal: in cook mode you stop scrolling between the ingredient checklist and the steps. An AI call works out which ingredients each step uses. The match is saved on the recipe and synced, so cook mode stays fast and works offline. Each step then lists its own ingredients (amounts and checks) right under it (board 3 G and I). A recipe with no match yet opens cook mode as it does today (board 4 L). The match shows only in cook mode: the recipe screen doesn't change, and there's no way to edit a match by hand. Mockups: https://claude.ai/artifact/7YVHMBerTkBufhm8CcVv8C. Follow `docs/llm-calls.md` \"Adding a new LLM task\". Every string is in `en.ts` and `es.ts`. The tasks run in order. The first task is an eval: stop after it if the results aren't good enough.","title":"Imports come back already matched","text":"Imports come back already matched (spec 6.6, 4.10). Add `extract-recipe.v4.ts`, keeping v3's file with a byte-for-byte test as v2 has. v4 also returns `step_ingredients`: for each output step, `{ ingredient: \u003cindex into the output ingredients>, quantity: number | null }`, using the matching rules from `match-recipe-steps.v1` (share the rule text in a `_shared/ai/prompts/step-match-rules.ts` that both prompts import). Today the JSON-LD path sends only ingredient lines, and the steps come from JSON-LD after the call. In v4, the JSON-LD steps (after `cleanRecipeSteps`) are sent to the model too, numbered, as untrusted data, with \"match these, don't rewrite them\". The model still returns `steps: []` for them, and the server keeps the JSON-LD steps. The page-text path matches the steps it extracts. Validate the result as `match-recipe-steps` does. A step count that doesn't match the final steps, or any invalid match, drops `step_ingredients` and keeps the rest of the import: a bad match never fails an import. `RecipeImportResponse` gains `stepIngredients: [[{ index, quantity }]] | null` (indexes into the response's `ingredients`). An older server's response without it reads as null. When the import creates the recipe, the app saves it as `step_ingredients`, mapping indexes to the new `recipe_ingredients` ids, with the basis worked out from what it saved. That makes the match fresh, so `ensureStepMatch` makes no call. A reused recipe keeps its own match, the same rule as tags (4.14). The prompt version is in the cache key, so v3 results aren't served. Re-run `yarn ai:eval:recipe` (ingredients, tags and steps must not get worse) and add the step-match score from the steps eval to it. Note in `docs/spikes.md` §5 whether matching inside the import is as good as the standalone call; if it's clearly worse, set `step_ingredients` to null in the response and leave matching to `ensureStepMatch`. Raise `maxOutputTokens` to fit. `yarn ai:recipe` prints the import's step match under its ingredient table, in `ai:steps`' format. Tests (Deno): v4 sends JSON-LD steps and keeps them; the match maps to the output ingredients; a bad match is dropped and the import still succeeds; the mock returns a match. In the app: an import saves a fresh match and makes no `match-recipe-steps` call; null leaves the recipe unmatched; a reused recipe isn't changed. Update spec 6.6 and 4.10. The user deploys the function (hand them the command).","status":"done","movedAt":"2026-10-16T23:36:40.770Z","notes":["Imports come back already matched (2026-10-16, spec 4.10, 6.6): finished from ralph run 1016-074225-10, which built the server side (extract-recipe v4 sending JSON-LD steps to match, rules shared with match-recipe-steps v1 in `step-match-rules.ts`, v3 pinned by a SHA-256 test, `cleanExtractedRecipe` checking the match with `cleanStepMatch` and mapping it past dropped ingredients, `RecipeImportResponse.stepIngredients`, `maxOutputTokens` up to 10,000, the step-match score in `ai:eval:recipe`, `ai:recipe` printing the match) and was killed while running the live eval. Added the app side: `save()` in `src/features/recipes/import.ts` writes the match as `step_ingredients` on a recipe the import creates (indexes mapped to the new `recipe_ingredients` ids in position order, basis from the saved steps and ids), so it's fresh and `ensureStepMatch` makes no call; a misaligned match or null is skipped; a reused recipe isn't touched. Tests: import.test.ts, ensure-step-match.test.ts, recipe-import schema tests (v3 cache row is a miss, older server's response reads null). Live eval v3 vs v4 in docs/spikes.md §5: no worse on ingredients or tags; step match 100% precision, 99.5% recall, so imports keep it. Spec 4.10, 6.6. Deploy: `supabase functions deploy import-recipe`."],"manualChecks":[]},{"id":"c18a54f95bf5","section":"Step ingredients in cook mode","goal":"Goal: in cook mode you stop scrolling between the ingredient checklist and the steps. An AI call works out which ingredients each step uses. The match is saved on the recipe and synced, so cook mode stays fast and works offline. Each step then lists its own ingredients (amounts and checks) right under it (board 3 G and I). A recipe with no match yet opens cook mode as it does today (board 4 L). The match shows only in cook mode: the recipe screen doesn't change, and there's no way to edit a match by hand. Mockups: https://claude.ai/artifact/7YVHMBerTkBufhm8CcVv8C. Follow `docs/llm-calls.md` \"Adding a new LLM task\". Every string is in `en.ts` and `es.ts`. The tasks run in order. The first task is an eval: stop after it if the results aren't good enough.","title":"Cook mode with ingredients under each step","text":"Cook mode with ingredients under each step (spec 4.5; board 3 G and I, board 4 L). When `stepMatch` isn't `none`, the cook screen changes in four ways. (1) The Ingredients card becomes **All ingredients**, folded by default, one row with a \"9 · 5 ticked\" `footnote` and a chevron. It unfolds to today's checklist and stays as set for this visit. (2) Each step in the Method card lists its ingredients under its text in a rounded (`md`) inset on `background` (`surface` on the UP NEXT step's `primarySoft`). Each is a row of at least 44 pt: a 22 pt check, the name in `cookStep`, and the amount (`amount` `inkSecondary`) scaled to the servings as today. A split share shows its own scaled amount followed by \"of 3\" (\"1 of 3\"); for a split with no share, the amount is followed by \"part\". A step with no ingredients shows none. (3) An **Also needed** card after Method, headed \"Not in a step\", lists the unplaced ingredients. (4) Ticks are per (step, ingredient): ticking a step ticks its ingredients (unticking the step leaves them). An All ingredients row is ticked when every one of its uses is ticked, and ticking it there ticks all its uses. The counts follow. With no match, the screen is exactly today's. Ticks are still the screen's state only. VoiceOver: step rows keep their label and add \"uses chicken thighs, chipotle in adobo, limes, garlic\". Ingredient rows read \"\u003cname>, \u003camount>, for step 1\", or \", 1 of 3 limes\". Tests: the matched and unmatched layouts; the fold; split amounts with servings scaling; the tick rules both ways; Also needed; VoiceOver labels; the `stale` state still shows the match. Update spec 4.5 and DESIGN.md's cook screen pattern. NEEDS A MANUAL CHECK: cook a matched recipe on a device at the default and the largest text sizes, and once in airplane mode.","status":"done","movedAt":"2026-10-16T23:36:40.770Z","notes":["Cook mode with ingredients under each step (2026-10-16, spec 4.5; board 3 G and I, board 4 L): `src/features/recipes/cook-match.ts` (per-use tick keys, `usesByIngredient`, `tickUses`, `allTicked`, `toggleAllUses`, `toggleUse`, `cookAmount`, `stepAmount` for \"1 of 3\" and \"3 cloves · part\" with spoken forms). `recipe/[id]/cook.tsx`: with a match that isn't `none`, All ingredients folds (\"9 · 5 ticked\", expanded state for VoiceOver), each step's ingredients sit in an `md` inset (`background`, `surface` on Up next) as siblings of the step's checkbox so VoiceOver reaches them, Also needed lists the unplaced ones, and step labels add \"uses …\". `CheckCircle` gained `size`; new token `cookIngredientCheck` 22. No match: unchanged (the 20 existing tests pass as they were). Tests: 8 new in recipe-cook.test.tsx (fold, insets and labels, shares and part, servings scaling, Also needed, tick rules both ways, stale shown, unmatched, helpers). Spec 4.5 and DESIGN.md's cook screen updated. Full jest 4261 passed, lint and tsc clean. NEEDS A MANUAL CHECK: cook a matched recipe on a device at the default and the largest text sizes, and once in airplane mode."],"manualChecks":[]},{"id":"14ebde1637c1","section":"Add bar","goal":"","title":"No chips while the add field is empty","text":"No chips while the add field is empty (spec 4.2). Today an empty, focused add field on a list shows the household's usual items in the chip row. Stop that: with the field empty (whitespace counts), there's no chip row at all, on lists as on recipes. Chips appear only once something is typed, as autocomplete, exactly as now. Remove the empty-field branch of `suggestionChips` in `src/features/lists/suggestions.ts` and the `usual` source the add bar passes it. Delete `usualItems` in `items.ts`, its `UsualItem` type and the \"Usual items\" strings in `en.ts` and `es.ts` if nothing else uses them. Tests: an empty or whitespace-only field gives no chips and no row, typing still shows recipe, history and catalog chips. Drop the usual-items tests. Update spec 4.2: delete the **Usual items** bullet and the \"with the field empty … usual items\" part of the chip-row bullet.","status":"done","movedAt":"2026-10-16T23:36:40.770Z","notes":["No chips while the add field is empty (2026-10-16, spec 4.2): `suggestionChips` returns [] for empty/whitespace text and lost its `usual` source; `ItemAddBar` no longer reads usual items, drops its `listId` prop (used only for them, so `list-screen.tsx` no longer passes it and the list-screen test's `listId` assertion went) and its own focus state, and always labels the row \"Suggestions\". Deleted `usualItems`, `openItemKeysQuery` (only it used it), `UsualItem`, and `addBar.usualItems` in en/es; spec 4.2 loses the **Usual items** bullet and the empty-field part of the chip-row bullet. Left `rankUsual` in `src/domain/suggestion-rank.ts` (now used only by its own tests) since the task didn't name it. Tests: replaced the usual-items tests in suggestions.test.ts and add-bar.test.tsx (behaviour changed) with \"the empty field\" tests (empty and whitespace give no chips and no row with history and recipes on hand; typing still shows recipe, history and catalog chips; clearing removes the row), changed the Spanish row-label test to expect no row while empty, and dropped the `usualItems` tests in items.test.ts."],"manualChecks":[]},{"id":"48ff01e33a25","section":"Add bar","goal":"","title":"Shortest match first in autocomplete","text":"Shortest match first in autocomplete (spec 4.2). Typing `coffee` on a list shows \"Coffee filters\" before \"Coffee\": `rankHistory` (`src/domain/suggestion-rank.ts`) sorts by frecency first, and `getSuggestions` (`src/features/lists/suggestions.ts`) puts every history match ahead of the catalog. Change the order of the item chips. (1) A suggestion whose name is the typed name (both normalized as an add, so `coffees` counts too) comes first, from history or the catalog. With 2 or more history matches the catalog is still left out, except for this exact match, which always shows. (2) Then shorter names before longer ones, whether they come from history or the catalog. (3) At equal length, a whole-name prefix match beats a word match, then higher frecency, then history before catalog, then alphabetical. The limit (5), the dedupe by key and recipe chips leading the row don't change. Tests: `coffee` with history Coffee filters (often bought) and Coffee gives Coffee, then Coffee filters. Coffee only in the catalog with two history matches still shows Coffee first. `chi` gives Chives before Chicken thighs. Also cover the tie-breaks. Update spec 4.2's **Ranking** bullet and the JSDoc on `rankHistory` and `getSuggestions`.","status":"done","movedAt":"2026-10-16T23:36:40.770Z","notes":["Shortest match first in autocomplete (2026-10-16, spec 4.2): `suggestion-rank.ts` gets `matchSuggestion` (exact when a name is the typed name, both through `normalizeIngredientName`, so `coffees` is Coffee; else prefix/word as before) and `compareMatches` (exact, then shorter display name, then prefix before word). `rankHistory` sorts by that, then frecency, then alphabetical, and also matches a row that is the typed name. New `mergeSuggestions(history, catalog, query, limit)` orders both sources the same way, then history (in `rankHistory` order) before the catalog, then alphabetical; dedupe by key (history wins) and the limit unchanged. `searchRecentItems` also pre-filters on the key being the typed name's. New `catalogEntry(name)` in `categories.ts` looks up the catalog grocery row for the typed name; `getSuggestions` always includes it, while with 2+ history matches the rest of the catalog is still left out. JSDoc on `rankHistory`, `getSuggestions`, `searchRecentItems` and `suggestionChips` updated; spec 4.2 **Ranking** rewritten and **History first** notes the exact-match exception. Existing tests changed because the order changed: suggestion-rank.test.ts (the two frecency tests use equal-length names; \"prefix ahead of word\" and \"higher-scoring word beats prefix\" became \"at equal length prefix beats a higher-scoring word match\" and \"a shorter word match beats a longer prefix match\"), items.test.ts \"applies the limit after ranking\" (now chili, chive), suggestions.test.ts (one-history-match/dedupe, hidden rows, applySuggestion, hide-drops-below-2 use queries/expectations for the new order), categories.test.ts autocomplete (adds `chickens`). New tests: rankHistory (4: typed name first however often others are bought, plural and accent exact, exact beats a shorter match, `chi` Chili/Chives before Chicken thighs); `mergeSuggestions` (7: exact from the catalog and as a plural, shorter first across sources, prefix before word at equal length, history order then catalog alphabetical, dedupe, limit, no match/blank); searchRecentItems (exact key first, `coffees`); getSuggestions (5: Coffee before often-bought Coffee filters, `coffees`, an amount; catalog Coffee first with two history matches and `Coffees`; `chi` Chives before Chicken thighs; shorter catalog names before a longer history name with the 14-letter tie going to history, and the limit; history before catalog at equal length). Jest 4237 passed (2 skipped); lint and tsc pass. No `supabase/` changes. LEFTOVER: `src/scratch-tmp/p.test.ts` is a throwaway probe I couldn't delete (rm needed approval); it's now a single passing placeholder, so delete `src/scratch-tmp/`."],"manualChecks":[]},{"id":"efda86f2f481","section":"Fixes","goal":"","title":"Drag to reorder in As added doesn't move rows live","text":"Drag to reorder in As added doesn't move rows live (spec 4.6 \"Your own order\"). Long-pressing a row in As added and dragging it doesn't really work: the other rows never make room while you drag, so the list doesn't rearrange under the finger as it should (as the Aisle order screen does, board 12). Find out why in `src/features/lists/reorderable-rows.tsx` and `row-drag.ts` (e.g. the row boxes not being measured or kept up to date inside the FlatList, the shift styles not reacting to `to`, the long-press and pan not handing off, or the list's own scroll or swipe gestures taking the touch) and fix it so the spec's behaviour holds: the row lifts (bigger, with a shadow), the others slide to make room as it passes them, the list scrolls near its edges, and the drop lands where the gap is and saves once (no jump back, no saving when dropped in place). Long-press and lift without moving still enters Select mode, and tap and swipe are unchanged. Tests: the pure drag math in `row-drag.ts` for moving up and down past several rows and across a scroll; whatever the cause turned out to be, covered so it can't come back. NEEDS A MANUAL CHECK: on a device, in As added on a list with 10+ items, drag a row up and down several places (and far enough to auto-scroll) and check the others make room live and the drop lands and stays where you let go.","status":"done","movedAt":"2026-10-16T23:36:40.770Z","notes":["Drag to reorder in As added moves rows live (2026-10-16, spec 4.6): the cause was each row's `onLayout` doing `boxes.set({ ...boxes.get(), [id]: box })` on the JS thread. In Reanimated 4.5 a JS-thread `set` is only scheduled onto the UI thread while `get` reads the UI value now, so rows laying out together overwrote one another and only the last row's box survived. The rest counted as zero height, so nothing made room and the drop slots were wrong. Fix: `boxes.modify(all => withBox(all, id, box))`, which runs in order on the UI thread. Also pulled the drag reaction's math into a pure `dragTo(rows, from, translation, scrolled)` in `row-drag.ts`, placed below `clampDrag` because the worklets plugin turns worklet functions into consts, which aren't hoisted. Tests: `row-drag.test.ts` adds `dragTo` (down and up past several rows including a taller one, across an auto-scroll both ways, clamped at the ends, no boxes) and `withBox`. `reorderable-rows.test.tsx`'s Reanimated mock now defers JS-thread `set`/`modify` until the UI thread runs, as on device (an existing test file's mock changed, no assertions weakened), and adds two tests that the other rows make room live, down and up. Those two tests and two existing drop tests fail with the old `onLayout`. NEEDS A MANUAL CHECK (in manual-checks.md)."],"manualChecks":["Drag to reorder in As added moves rows live: on a device, in As added on a list with 10+ items (a few with notes, so rows differ in height), long-press a row and drag it up and down several places, and far enough to auto-scroll at the top and bottom edges. Check that the row lifts (bigger, with a shadow), the others slide to make room as it passes them, and the drop lands where the gap was and stays there with no jump back. A long-press let go without moving should enter Select mode; dropping a row back in its own place shouldn't change anything; tap and swipe should work as before."]},{"id":"32bb7d759b20","section":"Quieter household activity","goal":"Goal: the list tells you what's new without the extra chrome. Keep the \"Alex is adding\" header pill as it is. Drop the \"since you looked\" card, the name lines and tags on rows, the merge flash and the \"2 new from Alex\" pill. What's left is one cue: a NEW badge on an item another member added, which fades out about 10 s after you've seen it.","title":"One NEW badge instead of the card and name tags","text":"One NEW badge instead of the card and name tags (spec 4.1). (1) Remove the \"since you looked\" card: delete `news-card.tsx` and its use in `list-screen.tsx`, and the card's strings in `en.ts` and `es.ts` (title forms, `sinceAt`, `since`, `names*`, `label*`, `rowLine`). Keep `listNewsSince` and the `list.seenAt.\u003clistId>` marker, because they still decide which rows are new on open. (2) Rows that are new on open lose their \"Alex · yesterday\" line, so the row's second line is only its own (e.g. \"from Chicken tacos\"), and they keep the `Badge` \"NEW\" (`primarySoft`). (3) Rows that arrive while you look lose the name tag (avatar and first name) and get the same NEW badge. They keep only the grow-in (the ordinary insert animation) and the VoiceOver announcement (\"Alex added limes\"). Remove the arrival's merge flash (the add-merge flash on your own adds stays). Remove the off-screen pill above the add bar (\"2 new from Alex\", \"3 new\") and its scroll-to: delete the pill component, the off-screen tracking that only feeds it, and `arrivals.pillFrom*`, `arrivals.pill*` and `arrivals.pillHint`. Delete `arrivals.tagLabel` and the tag component if nothing else uses them. (4) The badge's clock starts when its row is first visible on screen (on open for rows in view, on scroll for rows below). After 10 s it fades out over the `motion` duration, or disappears at once under Reduce Motion, and it doesn't come back during the visit. Leaving the list still moves the marker, so a badge you left before it faded doesn't return. (5) VoiceOver: a new row adds \"new\" while its badge shows (replacing \"new, added by Alex\"). Tests: no card renders for a list with news; a new-on-open row has the badge and no name line; an arriving row has the badge and no name tag; the badge's 10 s clock starts on visibility, not on load (a row scrolled into view later keeps its badge until 10 s after that); Reduce Motion; the VoiceOver label. Drop the card's, name tag's, flash's and pill's tests. Update spec 4.1 (remove the card, the row's name line, the name tag, the arrival flash and the pill, and describe the badge's fade). NEEDS A MANUAL CHECK: on two devices, add items on one, then open the list on the other and watch the badges fade; add more while watching and check they arrive with a badge, no name tag, no flash and no pill, including when they land below the visible rows.","status":"done","movedAt":"2026-10-17T13:18:23.803Z","notes":["One NEW badge instead of the card and name tags (2026-10-16, spec 4.1): removed the \"since you looked\" card (its use in `list-screen.tsx`, and its strings in en/es), the new row's \"Alex · yesterday\" line, the arrival's name tag and `pendingSoft` flash, and the off-screen pill with its scroll-to and the off-screen tracking behind it (`arrivals.pill*`, `pillHint` and `tagLabel` strings, `arrivalPillText`, the tag/unseen state in `useListArrivals`, the `sizes.tagAvatar` and `Motion.flashMs` tokens). `list-news.ts` is now `newItemIds`/`useListVisitNews` (a set of ids, from `listNewsSince` and the kept `list.seenAt` marker), `inSight` (moved from arrivals) and `useNewBadgeClocks`: each badge's clock starts the first time its row is in sight (measured against the list on layout, scroll and when the set of NEW rows changes; rows not drawn don't count), and `Motion.newBadgeMs` (10 s) later it's gone for the rest of the visit, even if that item gets another add. Leaving or backgrounding ends the visit. `ItemRow` takes `isNew` (badge in an `Animated.View` that fades out over `motion.duration`, no exit animation under Reduce Motion; VoiceOver \"new\"/\"nuevo\"), `grow`, `newRef`/`onNewLayout`; the name row is always a row so a fading badge stays beside the name. Your own add-merge tint is unchanged. Tests: item-row.test.tsx (badge, no name line, Spanish, no flash or tag, fade vs Reduce Motion, label drops \"new\" once the badge goes, refs); list-news.test.ts rewritten (newItemIds, inSight, the clock: 10 s from sight not load, a later-seen row keeps its badge until 10 s after, no restart, visits reset); list-screen.test.tsx (no card in any view mode, new-on-open and arriving rows NEW with no name line or tag, the visibility clock for rows in and below view, rows not drawn wait, no pill or scroll-to, own merge tint kept). Dropped the card, name tag, flash and pill tests (and list-news's card-text tests); changed the existing \"frozen\" news test, since a live add is now NEW too (as an arrival). Spec 4.1 and DESIGN.md updated. Jest 4249 passed (2 skipped); lint and tsc clean. No `supabase/` changes. LEFTOVER: I couldn't delete `src/features/lists/news-card.tsx` (rm and git rm needed approval), so it's now an empty `export {}` stub: delete it. NEEDS A MANUAL CHECK: on two devices, add items on one, then open the list on the other and watch the badges fade; add more while watching and check they arrive with a badge, no name tag, no flash and no pill, including when they land below the visible rows."],"manualChecks":["One NEW badge instead of the card and name tags: with two accounts in one household on two devices, add a few items on A with the list closed on B, then open the list on B. No card at the top. The new rows show \"NEW\" after the name with no \"Alex · …\" line, and each badge fades about 10 s after its row is on screen. Rows below the fold keep theirs until you scroll to them, then fade 10 s later. Folded aisles do the same once you unfold them. Then add more on A while watching B: each new row grows in with a NEW badge, with no name tag, no amber flash and no \"2 new from Alex\" pill, including when it lands below the visible rows. Leave the list before a badge fades and come back: it's gone. With Reduce Motion on, badges vanish at once instead of fading. With VoiceOver, a new row reads \"Limes, new, …\" while its badge shows, and \"Alex added limes\" is still announced."]},{"id":"5e706a61fa6c","section":"Recipe screen spacing","goal":"","title":"Room between the Ingredients count and the servings stepper","text":"Room between the Ingredients count and the servings stepper (spec 4.5). On the recipe screen the Ingredients card's header puts the count (\"9\") right against the `Stepper` passed as `trailing` (`src/app/recipe/[id]/index.tsx`). Fix it in `SectionHeader` (`src/components/section-header.tsx`) so every header with a count and a trailing control gets it: at least `spacing.md` between the title-and-count group and `trailing`, and the title (not the count or the trailing control) is what shrinks or wraps when space runs out. Check the other headers with both (cook screen's Also needed, the list's aisle headers, Add to list) still look right. Tests: a header with a count and a trailing control lays out the gap; at the largest accessibility text size the stepper stays whole and the title wraps. NEEDS A MANUAL CHECK: open a recipe with servings at the default and largest text sizes and look at the Ingredients header, with Reset showing (stepper off the base) and without.","status":"done","movedAt":"2026-10-17T13:18:23.803Z","notes":["Room between the Ingredients count and the servings stepper (2026-10-16, spec 4.5): in `SectionHeader` the title and count now sit in their own group (`flex: 1`, `minWidth: 0`, `sm` gap inside), the row's gap to `trailing` is `spacing.md` (was `sm`) in both the plain and folding headers, and `trailing` is wrapped in a `flexShrink: 0` view; the title is `flex: 1, flexShrink: 1` with no line limit and the count `flexShrink: 0`, so the title is what wraps. Headers without a trailing control lay out as before. The list's aisle headers don't pass `trailing` and Add to list doesn't use `SectionHeader`, so only the recipe Ingredients/Method headers and cook mode's Method/Also needed change. Tests added in `section-header.test.tsx` (with `useMotion` mocked for the folding header): the `md` gap with title and count grouped before the trailing control (plain and folding), the title shrinks and wraps while the count and trailing control don't, a hidden count still gets the gap, and no trailing slot without a trailing control. NEEDS A MANUAL CHECK: open a recipe with servings at the default and largest text sizes and look at the Ingredients header, with Reset showing and without (added to manual-checks.md)."],"manualChecks":["Room between the Ingredients count and the servings stepper: open a recipe with servings, at the default text size and at the largest accessibility text size, and look at the Ingredients header with the stepper at the base servings (no Reset) and off it (Reset showing). The count \"9\" sits clearly apart from Reset/the stepper (at least 12 pt), the stepper is whole, and at the largest size the \"Ingredients\" title wraps instead of squeezing the stepper. Also glance at cook mode's Also needed header and the recipe Method card's header (count and Edit) to check they still look right."]},{"id":"92d3e3221789","section":"Better recipe photos on import","goal":"Goal: imports find the photo far more often, and when none turns up you can pick one: from the images on the recipe's page, from your library, or with the camera. The cottage cheese blueberry bread recipe is the case that started this.","title":"A longer chain of photo fallbacks in `import-recipe`","text":"A longer chain of photo fallbacks in `import-recipe` (spec 6.6 step 5, `src/shared/recipe-jsonld.ts`, `supabase/functions/_shared/fetch-page.ts`). The photo is the first usable one of, in order: (1) the JSON-LD Recipe's `image`, now also resolving an `{ \"@id\": … }` reference to an `ImageObject` elsewhere in the same `@graph` (the Yoast/WordPress pattern, which today yields nothing), and `thumbnailUrl`; (2) the `@graph`'s `WebPage` `primaryImageOfPage` or `Article` `image` (same `@id` resolution); (3) `og:image`, `og:image:secure_url`, `og:image:url`; (4) `twitter:image`, `twitter:image:src`; (5) `\u003clink rel=\"image_src\">`; (6) microdata `itemprop=\"image\"` (`content`, `src` or `href`); (7) the first content `\u003cimg>` inside `\u003carticle>` or `\u003cmain>` (else the body) that looks like a photo: skip `svg`, `gif`, `data:` URLs, tracking pixels and anything whose `src`, `class`, `id` or `alt` says logo, avatar, icon, sprite, badge, ad or gravatar, and skip images with a declared `width` or `height` under 300; read `src`, else `data-src`, `data-lazy-src`, `data-original`, else the largest `srcset`/`data-srcset` candidate. Every candidate still goes through `cleanImageUrl` (https, ≤ 2048, resolved against the page). The client-sent page path (`request.page.imageUrl`) gets the same chain where it has the markup. Bump nothing in the prompt; the photo is never read by the model. Add a `readImageCandidates(markup, jsonLd, pageUrl)` that returns the ordered, de-duplicated list (up to 12) and use its first entry as `image_url`; the next task reuses it. Tests in `recipe-jsonld.test.ts`, `fetch-page.test.ts` and `handler.test.ts`: one per rung, the `@id` reference, lazy-loaded `data-src`/`srcset`, logo/avatar/pixel/small images skipped, order (an earlier rung wins), de-duplication, and a page with nothing still gives null. Add a fixture page for the cottage cheese blueberry bread recipe (URL: https://snacks.webxo.xyz/high-protein-cottage-cheese-blueberry-bread/) to `supabase/functions/import-recipe/eval/fixtures/` if one doesn't exist, and a test that it now gets a photo. Note: on 2026-10-16 that page, fetched with `fetch-page.ts`'s `USER_AGENT`, had an `og:image` (`…/wp-content/uploads/2026/05/Screenshot-2026-03-23-112812.png`, a PNG) and a Yoast `@graph` with no Recipe node, and today's `readPage` already returns that og:image for it, so the fixture test alone would pass before this task's changes. Find where the photo was actually lost and cover that with a test too. Suspects: the client-sent page path (`page-capture.ts` → `request.page.imageUrl`), the app saving or reusing a recipe by URL in `src/features/recipes/import.ts` without taking `imageUrl`, a cached extraction (`getCached`) from before og:image was read, and the photo failing to load in the app (`usePhotoFailed`). Say in progress.md which one it was; if none of them reproduces, say so. Update spec 6.6 step 5's **Photo** sentence with the chain.","status":"done","movedAt":"2026-10-17T13:18:23.803Z","notes":["A longer chain of photo fallbacks in import-recipe (2026-10-16, spec 6.6 step 5): `jsonLdImageCandidates(blocks, pageUrl)` in `src/shared/recipe-jsonld.ts` (rung 1 the Recipe's `image` then `thumbnailUrl`, rung 2 `WebPage` `primaryImageOfPage` then `Article` `image`, `{ \"@id\" }` references resolved across every block, one hop, no loops); `findRecipe`'s `imageUrl` resolves `@id` and falls back to `thumbnailUrl` too. `readImageCandidates(markup, jsonLd, pageUrl)` in `_shared/fetch-page.ts` adds og:image/secure_url/url, twitter:image/src (on `property` or `name`), `\u003clink rel=\"image_src\">`, microdata `itemprop=\"image\"` and the first content `\u003cimg>` (article, else main, else body; logo/avatar/icon/sprite/badge/ad/gravatar/pixel words in src/class/id/alt, declared px size under 300, svg/gif/`data:` skipped; `src`, `data-src`, `data-lazy-src`, `data-original`, largest `srcset`/`data-srcset` via the new `largestSrcsetUrl`), de-duplicated, at most 12. `readPage` returns them as `imageCandidates` with `imageUrl` the first. The client-page path uses `clientPageImage` (JSON-LD rungs from the sent blocks, then the sent `imageUrl`). **Where the photo was lost: the client-sent page path, from Safari's share sheet.** `targets/share-recipe/Preprocess.js` never captured an image, and `ShareQueue.Envelope.Page` had no `imageUrl`, so a Safari share sent `{ title, jsonLd, text }`; the server uses a sent page without fetching, and with a Yoast `@graph` that has no Recipe node the photo was null although the page had an og:image. Fixed both ways: the server now reads the `@graph`'s primary image, and Preprocess.js, `CAPTURE_SCRIPT` (both from the new `PAGE_IMAGE_SOURCES`, rungs 3–6) and the Swift `ShareQueue.page(…, imageUrl:)` / `ShareViewController` now send it. The other suspects don't reproduce: the device fallback for pasted links (`page-capture.ts`) already sent og:image; `getCached` is keyed by prompt version and og:image reading shipped with v3, so no cached row predates it; `import.ts` reusing a recipe by URL keeps that recipe's own fields by design (a recipe first saved without a photo stays so, as its tags do), which isn't this page's first import; `usePhotoFailed` can't be checked without a device. Rung 7 (content `\u003cimg>`) is server-only; the device doesn't run it. The Swift edits weren't compiled (no build here). **The fixture `nojsonld-webxo-cottage-cheese-blueberry-bread.html` is a hand reconstruction**: curl and WebFetch were blocked in this session, so it was built from the task's description (Yoast @graph without Recipe, that og:image PNG) with made-up recipe text, logo, avatars and a lazy `\u003cimg>`; SOURCES.md says so, and manual-checks.md has the command to replace it. Tests: recipe-jsonld.test.ts (@id in the same graph, after the Recipe, in another block, self/bad references, thumbnailUrl; `jsonLdImageCandidates` rungs 1–2, IRI/array types, order, dedupe, Recipe without ingredients, mal
