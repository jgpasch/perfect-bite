name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      # Generated by `expo start` locally (and gitignored); tsc needs it for Expo's ambient types.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: yarn expo lint
      - run: yarn tsc --noEmit
      - run: yarn jest --ci

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
